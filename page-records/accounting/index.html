<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>简纸 — 记账</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+SC:wght@300;400;600;700&family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="../../shared.js"></script>
<style>
body.page-accounting{ margin:0; background:#0F0F0E; font-family:'Noto Serif SC','Outfit',sans-serif; -webkit-tap-highlight-color:transparent; }
.page-accounting .app-viewport{ max-width:480px; margin:0 auto; background:#F5F4F0; min-height:100vh; display:flex; flex-direction:column; }
.page-accounting .no-scrollbar::-webkit-scrollbar{ display:none; }
.page-accounting .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }
.page-accounting .header-bar{ height:56px; border-bottom:1px solid #EAE7E1; padding:0 16px; display:flex; align-items:center; justify-content:space-between; background:#F5F4F0; }
.page-accounting .back-btn{ background:none; border:none; padding:8px; color:#2C2B29; cursor:pointer; }
.page-accounting .header-title{ font-size:16px; font-weight:600; color:#2C2B29; }
.page-accounting .header-right{ display:flex; align-items:center; gap:6px; }
.page-accounting .add-btn{ width:36px; height:36px; border-radius:999px; background:#405140; color:#FBFBFA; border:none; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.page-accounting .add-btn:active{ background:#354335; }
.page-accounting .list-area{ flex:1; overflow-y:auto; padding:16px 16px 100px; }
.page-accounting .summary-card{ background:#FBFBFA; border:1px solid #EAE7E1; border-radius:16px; padding:16px; margin-bottom:12px; display:flex; justify-content:space-around; text-align:center; }
.page-accounting .summary-item{ flex:1; }
.page-accounting .summary-label{ font-size:10px; color:#A1A1AA; margin-bottom:2px; }
.page-accounting .summary-amt{ font-size:18px; font-weight:700; font-family:'Inter',sans-serif; }
.page-accounting .summary-amt.income{ color:#4E7C59; }
.page-accounting .summary-amt.expense{ color:#A65D52; }
.page-accounting .month-label{ font-size:12px; color:#8B8B80; padding:0 2px 8px; font-weight:600; }
.page-accounting .fin-item{ display:flex; justify-content:space-between; align-items:center; padding:14px 12px; background:#FBFBFA; border:1px solid #EAE7E1; border-radius:12px; margin-bottom:6px; }
.page-accounting .fin-item:active{ background:#F0EFEA; }
.page-accounting .fin-left{ display:flex; align-items:center; gap:10px; min-width:0; flex:1; }
.page-accounting .fin-cat-dot{ width:6px; height:6px; border-radius:999px; flex-shrink:0; }
.page-accounting .fin-cat-dot.expense{ background:#A65D52; }
.page-accounting .fin-cat-dot.income{ background:#4E7C59; }
.page-accounting .fin-info{ min-width:0; }
.page-accounting .fin-name{ font-size:13px; color:#2C2B29; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.page-accounting .fin-date{ font-size:10px; color:#A1A1AA; margin-top:1px; }
.page-accounting .fin-amt{ font-size:14px; font-weight:600; font-family:'Inter',sans-serif; flex-shrink:0; }
.page-accounting .fin-amt.neg{ color:#A65D52; }
.page-accounting .fin-amt.pos{ color:#4E7C59; }
.page-accounting .empty-state{ text-align:center; padding:60px 24px; }
.page-accounting .empty-icon{ width:48px; height:48px; color:#BFBBB0; margin-bottom:12px; }
.page-accounting .empty-text{ font-size:14px; color:#8B8B80; margin-bottom:4px; }
.page-accounting .empty-hint{ font-size:12px; color:#A1A1AA; }

/* Quick add modal */
.page-accounting .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:100; display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.3s; }
.page-accounting .modal-overlay.show{ opacity:1; pointer-events:auto; }
.page-accounting .modal-sheet{ width:100%; max-width:480px; background:#F5F4F0; border-radius:24px 24px 0 0; padding:20px 20px calc(20px + env(safe-area-inset-bottom,0)); transform:translateY(100%); transition:transform 0.3s cubic-bezier(0.16,1,0.3,1); max-height:70vh; overflow-y:auto; }
.page-accounting .modal-overlay.show .modal-sheet{ transform:translateY(0); }
.page-accounting .modal-handle{ width:32px; height:4px; background:#D4D0C8; border-radius:2px; margin:0 auto 16px; }
.page-accounting .modal-title{ font-size:15px; font-weight:600; color:#2C2B29; margin-bottom:16px; }
.page-accounting .type-tabs{ display:flex; gap:8px; margin-bottom:16px; }
.page-accounting .type-tab{ flex:1; padding:10px; border-radius:10px; border:1px solid #E2E0D8; background:#FBFBFA; font-size:13px; cursor:pointer; font-family:inherit; text-align:center; }
.page-accounting .type-tab.active{ background:#405140; color:#FBFBFA; border-color:#405140; }
.page-accounting .form-field{ margin-bottom:14px; }
.page-accounting .form-label{ font-size:10px; color:#A1A1AA; display:block; margin-bottom:4px; font-weight:600; }
.page-accounting .form-input{ width:100%; padding:10px 0; border:none; border-bottom:1px solid #E2E0D8; font-size:14px; outline:none; background:transparent; color:#2C2B29; font-family:inherit; }
.page-accounting .form-input:focus{ border-bottom-color:#7E997E; }
.page-accounting .form-actions{ display:flex; gap:10px; margin-top:20px; }
.page-accounting .form-btn{ flex:1; padding:11px; border-radius:10px; font-size:12px; font-family:inherit; cursor:pointer; border:none; text-align:center; }
.page-accounting .form-btn.primary{ background:#405140; color:#FBFBFA; }
.page-accounting .form-btn.cancel{ background:#FBFBFA; border:1px solid #E2E0D8; color:#5C5854; }
</style>
</head>
<body class="page-accounting">
<div class="app-viewport">
  <div class="header-bar">
    <button onclick="history.back()" class="back-btn"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15.75 19.5L8.25 12l7.5-7.5"/></svg></button>
    <span class="header-title">记账</span>
    <div class="header-right">
      <button class="add-btn" onclick="openAddModal()" aria-label="新增记账">＋</button>
    </div>
  </div>
  <div class="list-area no-scrollbar" id="fin-list">
    <div class="empty-state">
      <svg class="empty-icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="12" y1="7" x2="12" y2="17"/><path d="M8 9h2"/><path d="M14 15h2"/></svg>
      <div class="empty-text">还没有记账记录</div>
      <div class="empty-hint">从今天记下第一笔</div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="add-modal" onclick="if(event.target===this)closeAddModal()">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title">新增记账</div>
    <div class="type-tabs">
      <button class="type-tab active" id="tab-expense" onclick="setFinType('expense')">支出</button>
      <button class="type-tab" id="tab-income" onclick="setFinType('income')">收入</button>
    </div>
    <div class="form-field">
      <label class="form-label">金额</label>
      <input class="form-input" id="fin-amount" type="number" step="0.01" min="0" placeholder="0.00" />
    </div>
    <div class="form-field">
      <label class="form-label">分类</label>
      <input class="form-input" id="fin-category" placeholder="餐饮 / 交通 / 购物…" />
    </div>
    <div class="form-field">
      <label class="form-label">备注（可选）</label>
      <input class="form-input" id="fin-note" placeholder="咖啡 / 打车…" />
    </div>
    <div class="form-actions">
      <button class="form-btn cancel" onclick="closeAddModal()">取消</button>
      <button class="form-btn primary" onclick="saveFinance()">保存</button>
    </div>
  </div>
</div>

<script>
loadDatabase();
var finType='expense';

function setFinType(t){finType=t;document.getElementById('tab-expense').className='type-tab'+(t==='expense'?' active':'');document.getElementById('tab-income').className='type-tab'+(t==='income'?' active':'');}

function openAddModal(){document.getElementById('add-modal').classList.add('show');document.getElementById('fin-amount').focus();}
function closeAddModal(){document.getElementById('add-modal').classList.remove('show');}

function saveFinance(){
  var amt=parseFloat(document.getElementById('fin-amount').value);
  if(!amt||amt<=0){showToast('请输入有效金额');return;}
  var cat=document.getElementById('fin-category').value.trim()||'其他';
  var note=document.getElementById('fin-note').value.trim();
  if(!db.financeLogs)db.financeLogs=[];
  db.financeLogs.unshift({
    id:'fin_'+Date.now(),
    type:finType,
    amount:amt,
    category:cat,
    note:note,
    date:new Date().toISOString().slice(0,10),
    time:new Date().toISOString()
  });
  saveDatabase();
  closeAddModal();
  document.getElementById('fin-amount').value='';
  document.getElementById('fin-category').value='';
  document.getElementById('fin-note').value='';
  renderFinance();
  showToast('已记录');
}

function renderFinance(){
  var fins=db.financeLogs||[];
  var list=document.getElementById('fin-list');
  if(!list)return;
  if(fins.length===0){
    list.innerHTML='<div class="empty-state"><svg class="empty-icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="12" y1="7" x2="12" y2="17"/><path d="M8 9h2"/><path d="M14 15h2"/></svg><div class="empty-text">还没有记账记录</div><div class="empty-hint">从今天记下第一笔</div></div>';
    return;
  }
  var totalInc=0,totalExp=0;
  fins.forEach(function(f){if(f.type==='income')totalInc+=f.amount||0;else totalExp+=f.amount||0;});
  var html='<div class="summary-card"><div class="summary-item"><div class="summary-label">收入</div><div class="summary-amt income">+¥'+totalInc.toFixed(2)+'</div></div>'+
    '<div class="summary-item"><div class="summary-label">支出</div><div class="summary-amt expense">-¥'+totalExp.toFixed(2)+'</div></div>'+
    '<div class="summary-item"><div class="summary-label">结余</div><div class="summary-amt" style="color:#405140">¥'+(totalInc-totalExp).toFixed(2)+'</div></div></div>';
  var now=new Date();var curMonth=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  html+='<div class="month-label">'+now.getFullYear()+'年'+(now.getMonth()+1)+'月</div>';
  fins.forEach(function(f){
    var sign=f.type==='income'?'+':'-';var cls=f.type==='income'?'pos':'neg';
    html+='<div class="fin-item"><div class="fin-left"><span class="fin-cat-dot '+(f.type==='income'?'income':'expense')+'"></span><div class="fin-info"><div class="fin-name">'+(f.note||f.category||'未分类')+'</div><div class="fin-date">'+(f.category||'')+(f.date?' · '+f.date:'')+'</div></div></div><span class="fin-amt '+cls+'">'+sign+'¥'+Math.abs(f.amount||0).toFixed(2)+'</span></div>';
  });
  list.innerHTML=html;
}

function showToast(msg){
  var t=document.createElement('div');t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#405140;color:#FFF;padding:8px 20px;border-radius:999px;font-size:12px;z-index:999;box-shadow:0 2px 12px rgba(0,0,0,0.15);';
  t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},1800);
}

renderFinance();
</script>
</body>
</html>
