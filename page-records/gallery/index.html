<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>简纸 — 影像回忆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+SC:wght@300;400;600;700&family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="../../shared.js"></script>
<style>
body.page-gallery { margin:0; background:#0F0F0E; font-family:'Noto Serif SC','Outfit',sans-serif;
  -webkit-tap-highlight-color:transparent; }
.page-gallery .app-viewport { max-width:480px; margin:0 auto; background:#F5F4F0; min-height:100vh; box-shadow:0 0 50px rgba(0,0,0,0.6); display:flex; flex-direction:column; }
.page-gallery .no-scrollbar::-webkit-scrollbar { display:none; }
.page-gallery .no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }
.page-gallery .header-bar { height:56px; border-bottom:1px solid #EAE7E1; padding:0 16px; display:flex; align-items:center; justify-content:space-between; background:#F5F4F0; }
.page-gallery .back-btn { background:none; border:none; padding:8px; color:#2C2B29; cursor:pointer; }
.page-gallery .header-title { font-size:14px; font-weight:700; color:#2C2B29; }
.page-gallery .add-btn { width:32px; height:32px; border-radius:999px; background:#405140; color:#FBFBFA; border:none; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.page-gallery .grid-area { flex:1; overflow-y:auto; padding:16px; display:grid; grid-template-columns:1fr 1fr; gap:12px; padding-bottom:96px; align-content:start; }
.page-gallery .photo-card { background:#FFF; border:1px solid #EAE7E1; border-radius:16px; padding:12px; }
.page-gallery .photo-img { width:100%; height:160px; object-fit:cover; border-radius:12px; }
.page-gallery .photo-title { display:flex; justify-content:space-between; margin-top:8px; font-size:12px; font-weight:700; color:#2C2B29; }
.page-gallery .empty-state { grid-column:1/-1; text-align:center; padding:48px; color:#A1A1AA; font-size:14px; }
.page-gallery .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px; }
.page-gallery .modal-overlay.hidden { display:none; }
.page-gallery .modal-content { background:#F5F4F0; border:1px solid #DDD9CF; width:100%; max-width:360px; border-radius:24px; padding:24px; }
.page-gallery .modal-head { display:flex; justify-content:space-between; padding-bottom:8px; border-bottom:1px solid #EAE7E1; margin-bottom:16px; }
.page-gallery .modal-title { font-size:14px; font-weight:700; color:#2C2B29; }
.page-gallery .modal-close { background:none; border:none; color:#5C5854; font-size:16px; cursor:pointer; }
.page-gallery .input-field { width:100%; height:40px; padding:0 12px; font-size:12px; border:1px solid #EAE7E1; border-radius:8px; margin-bottom:12px; box-sizing:border-box; }
.page-gallery .upload-zone { border:2px dashed #DDD9CF; border-radius:12px; padding:24px; text-align:center; margin-bottom:16px; cursor:pointer; }
.page-gallery .file-input { display:none; }
.page-gallery .upload-status { font-size:12px; color:#5C5854; }
.page-gallery .submit-btn { width:100%; height:44px; background:#065F46; color:#FBFBFA; border:none; border-radius:12px; font-size:12px; font-weight:700; cursor:pointer; }

	.page-gallery .num{font-family:"Inter",Arial,sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
	</style>
</head>
<body class="page-gallery">
<div class="app-viewport">
  <div class="header-bar">
    <button onclick="history.back()" class="back-btn"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15.75 19.5L8.25 12l7.5-7.5"/></svg></button>
    <h3 class="header-title">影像回忆 🖼️</h3>
    <button onclick="openUploadModal()" class="add-btn">+</button>
  </div>
  <div class="grid-area no-scrollbar" id="gallery-grid"></div>
</div>
<div class="modal-overlay hidden" id="global-modal"><div class="modal-content" id="modal-content-area"></div></div>
<script>
loadDatabase();
function render() {
  var g = document.getElementById('gallery-grid');
  if (!g) return;
  g.innerHTML = '';
  if (db.photos.length===0) { g.innerHTML='<div class="empty-state">还没有照片</div>'; return; }
  db.photos.forEach(function(p) {
    g.innerHTML += '<div class="photo-card"><img src="'+p.src+'" class="photo-img"><div class="photo-title"><span>'+escapeHtml(p.title)+'</span></div></div>';
  });
}
function openUploadModal() {
  showModal('<div><div class="modal-head"><span class="modal-title">记录瞬间 📸</span><button onclick="closeModal()" class="modal-close">✕</button></div>' +
    '<input id="p-title" placeholder="影像名称" class="input-field">' +
    '<div class="upload-zone" onclick="document.getElementById(\'p-file\').click()">' +
    '<input type="file" id="p-file" accept="image/*" class="file-input" onchange="handleFile(this)">' +
    '<span id="p-status" class="upload-status">📰 选择照片</span></div>' +
    '<button onclick="submitP()" class="submit-btn">永久锁定</button></div>');
}
var _tmpPhoto = '';
function handleFile(input) {
  if (!input.files||!input.files[0]) return;
  var reader = new FileReader();
  reader.onload = function(e) { _tmpPhoto = e.target.result; document.getElementById('p-status').textContent = '✅ 已选择'; };
  reader.readAsDataURL(input.files[0]);
}
function submitP() {
  var t = document.getElementById('p-title');
  if (!_tmpPhoto) return;
  db.photos.unshift({id:'photo_'+Date.now(), title:t?escapeHtml(t.value.trim())||'未命名':'未命名', src:_tmpPhoto, date:'7月20日'});
  saveDatabase(); closeModal(); render();
}
render();
</script>
</body>
</html>
