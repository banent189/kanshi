<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>简纸 — 今日动态</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+SC:wght@300;400;600;700&family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="../../shared.js"></script>
<style>
/* ═══════════ 今日动态 — 私人生活纸 ═══════════ */
body.page-timeline{
  --page-bg:#F6F3EC; --paper:#FAF8F2; --text-main:#292923; --text-body:#32322D;
  --text-soft:#96958D; --text-faint:#AAA89F; --green:#5E6E58; --green-soft:#EEF0E8;
  --line:#E7E3DA; --mood-bg:#F6F1E6; --overlay:rgba(40,38,33,0.55);
  margin:0; background:#E9E5DC; font-family:'Noto Serif SC','Outfit',sans-serif;
  -webkit-tap-highlight-color:transparent; overflow-x:hidden;
}
.page-timeline *{ box-sizing:border-box; }
body.page-timeline.page-timeline-locked{ overflow:hidden; }

/* ═══ 页面容器 ═══ */
.page-timeline .timeline-page{
  position:relative; width:100%; max-width:480px; min-height:100vh; margin:0 auto;
  background:var(--page-bg); overflow-x:hidden;
}

/* ═══ 顶部导航 ═══ */
.page-timeline .timeline-header{
  position:sticky; top:0; z-index:40; background:var(--page-bg);
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; min-height:56px;
  padding-top:env(safe-area-inset-top,0px); border-bottom:1px solid var(--line);
}
.page-timeline .th-left{ justify-self:start; padding-left:18px; }
.page-timeline .th-title{
  font-size:17px; font-weight:500; color:var(--text-main); white-space:nowrap;
  font-family:'Noto Serif SC',serif; justify-self:center; letter-spacing:1px;
}
.page-timeline .th-right{ justify-self:end; display:flex; align-items:center; gap:4px; padding-right:18px; }
.page-timeline .th-btn{
  width:40px; height:40px; display:flex; align-items:center; justify-content:center;
  background:none; border:none; padding:0; cursor:pointer; color:var(--text-body);
}
.page-timeline .th-btn svg{ width:20px; height:20px; stroke-width:1.5; }
.page-timeline .th-btn:active{ opacity:0.6; }
.page-timeline .th-plus{
  width:30px; height:30px; border-radius:999px; background:var(--green); color:#FFF;
  font-size:19px; font-weight:300; display:flex; align-items:center; justify-content:center; padding:0;
}

/* ═══ 顶部轻区域（日期条 + 找一找）═══ */
.page-timeline .timeline-topbar{ position:sticky; top:calc(56px + env(safe-area-inset-top,0px)); z-index:39; background:var(--page-bg); }
.page-timeline .timeline-date-filter{
  display:none; height:44px; align-items:center; justify-content:space-between; gap:10px;
  padding:0 22px; border-bottom:1px solid var(--line);
}
.page-timeline .timeline-date-filter.show{ display:flex; }
.page-timeline .tdf-date{
  display:flex; align-items:center; gap:6px; background:none; border:none; cursor:pointer;
  font-size:14px; color:var(--text-main); font-family:'Noto Serif SC',serif; padding:8px 0; white-space:nowrap;
}
.page-timeline .tdf-date .ic{ font-size:12px; }
.page-timeline .tdf-right{ display:flex; align-items:center; gap:14px; }
.page-timeline .tdf-today{ display:none; background:none; border:none; color:var(--green); font-size:13px; cursor:pointer; font-family:inherit; padding:8px 0; white-space:nowrap; }
.page-timeline .tdf-today.show{ display:inline-block; }
.page-timeline .tdf-clear{ background:none; border:none; color:var(--text-faint); font-size:13px; cursor:pointer; font-family:inherit; padding:8px 0; white-space:nowrap; }
.page-timeline .timeline-find-entry{
  display:flex; align-items:center; gap:6px; width:100%; background:none; border:none;
  padding:12px 22px; color:#77766F; font-size:13px; cursor:pointer;
  font-family:'Noto Serif SC',serif; text-align:left;
}
.page-timeline .timeline-find-entry .f-ic{ font-size:14px; }
.page-timeline .timeline-find-entry:active{ color:var(--green); }

/* ═══ 日期浮层 ═══ */
.page-timeline .date-picker-popover{
  display:none; position:absolute; top:calc(env(safe-area-inset-top,0px) + 100px); right:16px;
  z-index:45; background:var(--paper); border:1px solid var(--line); border-radius:14px;
  box-shadow:0 10px 32px rgba(40,38,33,0.12); padding:14px; width:210px;
}
.page-timeline .date-picker-popover.show{ display:block; }
.page-timeline .dp-title{ font-size:13px; color:var(--text-main); margin-bottom:10px; }
.page-timeline .date-picker-popover input[type=date]{
  width:100%; height:36px; border:1px solid var(--line); border-radius:10px; padding:0 10px;
  font-size:13px; font-family:inherit; outline:none; background:#FFF; color:var(--text-main);
}

/* ═══ 时间线 ═══ */
.page-timeline .timeline-groups{ padding:6px 22px 56px; }
.page-timeline .timeline-day{ margin-bottom:30px; }
.page-timeline .timeline-day-title{
  display:flex; align-items:center; gap:10px; font-size:16px; font-weight:500; color:#34342F;
  font-family:'Noto Serif SC',serif; margin:30px 0 18px; letter-spacing:0.5px;
}
.page-timeline .timeline-day:first-child .timeline-day-title{ margin-top:16px; }
.page-timeline .timeline-day-title::after{
  content:''; width:26px; height:1px; background:#DEDAD1;
}

/* 轻时间线条目（无贯穿竖线） */
.page-timeline .timeline-item{ display:flex; gap:10px; padding-bottom:22px; }
.page-timeline .tl-time{
  width:42px; flex-shrink:0; text-align:right; font-size:12px; color:#A9A69C;
  padding-top:3px; font-family:'Outfit','Inter',sans-serif;
}
.page-timeline .tl-body{ flex:1; min-width:0; }

/* 作者行（弱化） */
.page-timeline .timeline-author-profile-trigger{
  display:flex; align-items:center; gap:7px; background:none; border:none; padding:0; margin:0;
  cursor:pointer; text-align:left; font-family:inherit; min-height:30px;
}
.page-timeline .timeline-avatar{
  width:28px; height:28px; border-radius:50%; flex-shrink:0; overflow:hidden; position:relative;
  display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; color:#FFF;
  background:linear-gradient(135deg,#5E6E58,#8A9882);
}
.page-timeline .timeline-avatar .av-letter{ position:relative; z-index:0; }
.page-timeline .timeline-avatar img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:1; }
.page-timeline .timeline-avatar img.is-broken{ display:none; }
.page-timeline .timeline-display-name{ font-size:12px; font-weight:400; color:#73736C; }

/* 正文 */
.page-timeline .activity-text{
  font-size:15px; line-height:1.75; color:var(--text-body); white-space:pre-wrap;
  word-break:break-word; margin:8px 0 0; font-family:'Noto Serif SC',serif;
}

/* 图片 */
.page-timeline .activity-images{ margin:10px 0 0; display:grid; gap:4px; border-radius:10px; overflow:hidden; background:#EDEAE1; }
.page-timeline .activity-images.c1{ grid-template-columns:1fr; }
.page-timeline .activity-images.c2,
.page-timeline .activity-images.c4{ grid-template-columns:1fr 1fr; }
.page-timeline .activity-images.c3,
.page-timeline .activity-images.c5,
.page-timeline .activity-images.c6,
.page-timeline .activity-images.c7,
.page-timeline .activity-images.c8,
.page-timeline .activity-images.c9{ grid-template-columns:repeat(3,1fr); }
.page-timeline .activity-img{
  width:100%; display:block; object-fit:cover; cursor:pointer; opacity:0; transition:opacity 0.25s;
}
.page-timeline .activity-img.loaded{ opacity:1; }
.page-timeline .activity-images:not(.c1) .activity-img{ aspect-ratio:1; height:auto; }
.page-timeline .activity-images.c1 .activity-img{ max-height:55vh; }

/* 标签 / 心情 */
.page-timeline .activity-meta-row{
  display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin:10px 0 0;
}
.page-timeline .activity-tags{ display:flex; flex-wrap:wrap; gap:6px; }
.page-timeline .activity-tag{ font-size:11px; color:#6B7A63; }
.page-timeline .activity-mood{ font-size:16px; line-height:1; }
.page-timeline .activity-mood .mood-label{ font-size:11px; color:var(--text-faint); margin-left:3px; }

/* ··· 极轻 */
.page-timeline .activity-more{
  position:absolute; right:0; top:-6px; width:34px; height:34px;
  display:flex; align-items:center; justify-content:center; background:none; border:none;
  color:#C9C4B8; font-size:15px; letter-spacing:1px; cursor:pointer; font-weight:700;
}
.page-timeline .activity-more:active{ color:var(--text-soft); }

/* ═══ 空状态 ═══ */
.page-timeline .timeline-empty{
  display:none; text-align:center; padding:80px 30px 40px; color:var(--text-soft); font-size:15px;
  line-height:2; white-space:pre-line; font-family:'Noto Serif SC',serif;
}
.page-timeline .timeline-empty.show{ display:block; }
.page-timeline .timeline-empty .empty-sub{ font-size:12px; color:var(--text-faint); }
.page-timeline .timeline-empty .empty-btn{
  display:inline-block; margin-top:16px; padding:8px 26px; border-radius:999px; border:1px solid var(--line);
  background:var(--paper); color:var(--green); font-size:13px; cursor:pointer; font-family:'Noto Serif SC',serif;
}
.page-timeline .timeline-empty .empty-btn:active{ background:var(--green-soft); }

/* ═══ 主遮罩（publish 1000 / subsheet 1200 / confirm 1500）═══ */
.page-timeline .timeline-publish-overlay{
  position:fixed; inset:0; background:var(--overlay); z-index:1000; display:none;
  align-items:center; justify-content:center; padding:16px;
}
.page-timeline .timeline-publish-overlay.show{ display:flex; }
.page-timeline .timeline-subsheet-overlay{
  position:fixed; inset:0; background:var(--overlay); z-index:1200; display:none;
  align-items:flex-end; justify-content:center;
}
.page-timeline .timeline-subsheet-overlay.show{ display:flex; }
.page-timeline .timeline-confirm-overlay{
  position:fixed; inset:0; background:var(--overlay); z-index:1500; display:none;
  align-items:center; justify-content:center; padding:24px;
}
.page-timeline .timeline-confirm-overlay.show{ display:flex; }

/* ═══ 记下这一刻弹窗 ═══ */
.page-timeline .timeline-publish-modal{
  width:calc(100vw - 32px); max-width:390px; max-height:calc(100vh - 32px);
  background:var(--paper); border-radius:20px; box-shadow:0 20px 60px rgba(40,38,33,0.18);
  display:flex; flex-direction:column; overflow:hidden;
}
.page-timeline .pm-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 20px 6px; border-bottom:none; flex-shrink:0;
}
.page-timeline .pm-title{ font-size:16px; font-weight:500; color:var(--text-main); font-family:'Noto Serif SC',serif; }
.page-timeline .pm-close{ width:32px; height:32px; border:none; background:none; color:var(--text-faint); font-size:14px; cursor:pointer; }
.page-timeline .pm-body{ flex:1; overflow-y:auto; padding:14px 20px 6px; }
.page-timeline .pm-text{
  width:100%; min-height:140px; max-height:44vh; padding:8px 2px 14px;
  border:none; border-bottom:1px solid #E6E1D8; border-radius:0;
  font-size:16px; line-height:1.7; font-family:'Noto Serif SC',serif;
  color:var(--text-body); outline:none; background:transparent; resize:none;
}
.page-timeline .pm-text:focus{ border-bottom-color:#98A18F; }
.page-timeline .pm-text::placeholder{ color:#AAA89F; }
.page-timeline .pm-photos{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.page-timeline .pm-photo-item{
  width:76px; height:76px; border-radius:10px; overflow:hidden; position:relative; flex-shrink:0;
  background:#EDEAE1;
}
.page-timeline .pm-photo-item img{ width:100%; height:100%; object-fit:cover; }
.page-timeline .pm-photo-del{
  position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:999px;
  background:rgba(40,38,33,0.55); color:#FFF; border:none; font-size:10px; cursor:pointer; padding:0;
}
.page-timeline .pm-actions{ display:flex; align-items:center; gap:22px; flex-wrap:wrap; margin-top:14px; }
.page-timeline .pm-act{
  display:flex; align-items:center; gap:5px; height:36px;
  background:transparent; border:0; padding:6px 0;
  font-size:13px; color:#6E7568; cursor:pointer; font-family:'Noto Serif SC',serif;
}
.page-timeline .pm-act .a-ic{ font-size:14px; }
.page-timeline .pm-act .a-val{ color:var(--text-soft); font-size:12px; max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.page-timeline .pm-act .a-val.has{ color:var(--green); }
.page-timeline .pm-act:active{ color:var(--green); }
.page-timeline .pm-foot{ display:flex; align-items:center; justify-content:flex-end; gap:18px; padding:10px 20px calc(14px + env(safe-area-inset-bottom,0px)); flex-shrink:0; }
.page-timeline .pm-btn{ border:none; cursor:pointer; font-family:'Noto Serif SC',serif; }
.page-timeline .pm-btn-ghost{ background:transparent; color:var(--text-soft); font-size:14px; padding:8px 4px; }
.page-timeline .pm-btn-ghost:active{ color:var(--text-main); }
.page-timeline .pm-btn-primary{
  height:42px; padding:0 24px; border-radius:11px; background:#596854; color:#FFF;
  font-size:14px; font-weight:500;
}
.page-timeline .pm-btn-primary:active{ opacity:0.85; }

/* 编辑模式日期行 */
.page-timeline .pm-date-row{ display:none; margin-top:12px; }
.page-timeline .pm-date-row.show{ display:flex; align-items:center; justify-content:space-between; }
.page-timeline .pm-date-row .d-label{ font-size:13px; color:var(--text-body); }
.page-timeline .pm-date-row input[type=date]{
  height:34px; border:1px solid var(--line); border-radius:10px; padding:0 10px; font-size:13px;
  font-family:inherit; outline:none; background:#FFFDF8; color:var(--text-body);
}

/* ═══ Bottom Sheet ═══ */
.page-timeline .timeline-sheet{
  width:100%; max-width:480px; background:var(--paper); border-radius:22px 22px 0 0;
  max-height:76vh; display:flex; flex-direction:column;
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -10px 40px rgba(40,38,33,0.12);
}
.page-timeline .sheet-handle{ width:36px; height:4px; border-radius:2px; background:#DCD7CB; margin:10px auto 2px; flex-shrink:0; }
.page-timeline .sheet-title{ font-size:15px; font-weight:500; color:var(--text-main); text-align:center; padding:10px 20px 12px; font-family:'Noto Serif SC',serif; flex-shrink:0; }
.page-timeline .sheet-body{ flex:1; overflow-y:auto; padding:4px 20px 8px; }
.page-timeline .chip-grid{ display:flex; flex-wrap:wrap; gap:8px; }
.page-timeline .chip-grid .tag-chip{ flex-shrink:1; }
.page-timeline .tag-chip{
  padding:7px 12px; border-radius:9px; border:none;
  background:#F4F2EC; color:var(--text-body); font-size:13px; white-space:nowrap;
  cursor:pointer; font-family:'Outfit','Inter',sans-serif;
}
.page-timeline .tag-chip.is-sel{ background:#66725F; color:#FFF; }
/* 心情 chip：更轻，选中浅绿 */
.page-timeline .sheet-mood-chip{ background:transparent; color:var(--text-body); }
.page-timeline .sheet-mood-chip.is-sel{ background:#E7EBE2; color:#4F5C4A; }
.page-timeline .sheet-done-btn{
  display:block; width:100%; height:42px; border:none; border-radius:11px;
  background:#596854; color:#FFF; font-size:14px; cursor:pointer; font-family:'Noto Serif SC',serif; margin-top:16px;
}
.page-timeline .sheet-done-btn:active{ opacity:0.85; }
/* 标签 Sheet 头行（标题 + 完成） */
.page-timeline .sheet-row-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:6px 2px 14px;
}
.page-timeline .sheet-row-head span{ font-size:15px; font-weight:500; color:var(--text-main); font-family:'Noto Serif SC',serif; }
.page-timeline .sheet-done{
  background:none; border:none; color:#596854; font-size:13px; cursor:pointer;
  font-family:'Noto Serif SC',serif; padding:6px 2px;
}
.page-timeline .sheet-done:active{ opacity:0.7; }
/* 新标签 */
.page-timeline .sheet-new-tag{
  display:inline-block; margin-top:14px; background:none; border:none; color:#6E7568;
  font-size:13px; cursor:pointer; font-family:'Noto Serif SC',serif; padding:6px 2px;
}
.page-timeline .sheet-new-tag-row{ display:none; gap:8px; margin-top:10px; }
.page-timeline .sheet-new-tag-row.show{ display:flex; }
.page-timeline .sheet-new-input{
  flex:1; height:34px; padding:0 14px; border:1px solid var(--line); border-radius:999px;
  font-size:13px; outline:none; background:#FFFDF8; color:var(--text-main); font-family:inherit; min-width:0;
}
.page-timeline .sheet-new-btn{
  height:34px; padding:0 16px; border:none; border-radius:999px; background:var(--green);
  color:#FFF; font-size:13px; cursor:pointer; font-family:inherit; flex-shrink:0;
}
/* 头像与名字 sheet */
.page-timeline .sp-avatar{
  width:64px; height:64px; border-radius:50%; margin:10px auto 8px; overflow:hidden; position:relative;
  display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:500; color:#FFF;
  background:linear-gradient(135deg,#5E6E58,#8A9882);
}
.page-timeline .sp-avatar .av-letter{ position:relative; z-index:0; }
.page-timeline .sp-avatar img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:1; }
.page-timeline .sp-avatar img.is-broken{ display:none; }
.page-timeline .sp-name{ text-align:center; font-size:16px; font-weight:500; color:var(--text-main); font-family:'Noto Serif SC',serif; }
.page-timeline .sp-sub{ text-align:center; font-size:11px; color:#A19F97; margin:3px 0 18px; }
.page-timeline .sp-section{ border-radius:12px; overflow:hidden; }
.page-timeline .sheet-row{
  width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
  height:46px; background:none; border:none; border-bottom:1px solid var(--line);
  font-size:14px; color:var(--text-body); cursor:pointer; font-family:'Noto Serif SC',serif; padding:0 12px;
}
.page-timeline .sp-section .sheet-row:last-child{ border-bottom:none; }
.page-timeline .sheet-row:active{ background:var(--green-soft); }
.page-timeline .sheet-row-arrow{ color:#C9C4B8; font-size:14px; }
.page-timeline .sheet-cancel-btn{
  display:block; width:100%; height:42px; border:none; border-radius:11px;
  background:#F0EDE4; color:var(--text-soft); font-size:14px; cursor:pointer; font-family:'Noto Serif SC',serif;
  margin-top:12px;
}
/* 动作菜单 */
.page-timeline .sheet-action-btn{
  width:100%; display:flex; align-items:center; gap:12px; height:52px;
  background:none; border:none; border-bottom:1px solid var(--line);
  font-size:14px; color:var(--text-body); cursor:pointer; font-family:'Noto Serif SC',serif; padding:0 2px; text-align:left;
}
.page-timeline .sheet-action-btn:active{ background:var(--green-soft); }
.page-timeline .sheet-action-btn.is-danger{ color:#B06262; border-bottom:none; }
.page-timeline .sheet-action-btn .ic{ width:18px; height:18px; flex-shrink:0; color:var(--green); }
.page-timeline .sheet-action-btn.is-danger .ic{ color:#B06262; }
/* 改名编辑层 */
.page-timeline .sheet-rename{ margin-top:4px; }
.page-timeline .sheet-rename input{
  width:100%; height:42px; border:1px solid var(--line); border-radius:12px; padding:0 14px;
  font-size:14px; font-family:'Noto Serif SC',serif; outline:none; background:#FFFDF8; color:var(--text-body);
}
.page-timeline .sheet-rename-btns{ display:flex; gap:10px; margin-top:12px; }
/* 头像预览确认 */
.page-timeline .confirm-box{
  width:min(320px,100%); background:var(--paper); border-radius:20px; padding:26px 20px 20px;
  text-align:center;
}
.page-timeline .confirm-text{ font-size:15px; color:var(--text-main); line-height:1.8; white-space:pre-line; font-family:'Noto Serif SC',serif; }
.page-timeline .confirm-text .sub{ font-size:12px; color:var(--text-faint); }
.page-timeline .confirm-avatar{
  width:100px; height:100px; border-radius:50%; margin:16px auto; overflow:hidden; position:relative;
  display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:600; color:#FFF;
  background:linear-gradient(135deg,#5E6E58,#8A9882);
}
.page-timeline .confirm-avatar img{ width:100%; height:100%; object-fit:cover; }
.page-timeline .confirm-btns{ display:flex; gap:10px; margin-top:18px; }

/* ═══ Toast（小型轻提示，置顶）═══ */
.page-timeline .toast{
  position:fixed; top:calc(env(safe-area-inset-top,0px) + 14px); left:50%; transform:translateX(-50%);
  z-index:2000; background:rgba(90,104,84,0.92); color:#FFF; padding:4px 14px; border-radius:999px;
  font-size:11px; opacity:0; transition:opacity 0.2s; pointer-events:none; white-space:nowrap;
  max-width:70vw; overflow:hidden; text-overflow:ellipsis;
}

<script>
// ═══ 返回 ═══
function smartBack(){
  var r='';
  try{ r=document.referrer||''; }catch(e){}
  if(r.indexOf('page-today')>=0){ window.location.href='/page-today/index.html'; return; }
  if(window.history.length>1){ try{ window.history.back(); return; }catch(e){} }
  window.location.href='/page-records/records.html';
}

// ═══ 常量 ═══
var BASE_TAGS=['日常','吃饭','出去玩','工作','运动','旅行'];
var MOODS=[['😊','开心'],['😌','平静'],['🌧️','惆怅'],['🤩','激动'],['😴','疲惫'],['🥰','温暖'],['🫠','发呆']];
var IDB_NAME='KANSHI_IMAGES',IDB_STORE='images',idbDB=null;
var SAVING=false;

// ═══ 状态 ═══
var timelineState={
  activities:[],
  profile:null,
  selectedDate:null,
  editingId:null,
  draft:{ content:'', tags:[], mood:{emoji:'😊',label:'开心'}, images:[] },
  avatarDraft:null,
  nameDraft:'',
  sheetHandler:null
};
var modalState={ publishOpen:false, activeSubSheet:null, confirmOpen:false };
var savedScrollY=0;
var isDatePopoverOpen=false;
var confirmCallback=null;
var toastTimer=null;

// ═══ 工具函数 ═══
function $(id){ return document.getElementById(id); }
function pad2(n){ return n<10?'0'+n:''+n; }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function fmtDate(dk){ if(!dk)return''; return parseInt(dk.slice(5,7),10)+'月'+parseInt(dk.slice(8,10),10)+'日'; }
function getActivities(){ return timelineState.activities; }
function findActivity(id){ return getActivities().find(function(a){return a.id===id;}); }
function avatarLetter(){
  var s=(timelineState.profile&&(timelineState.profile.displayName||timelineState.profile.id))||'?';
  return String(s).charAt(0);
}
function avatarImgHTML(prefix){
  var p=timelineState.profile;
  if(p&&p.avatar) return '<img src="'+escapeHtml(p.avatar)+'" onerror="this.classList.add(\'is-broken\')" alt="">';
  return '';
}
function avatarHTML(prefix){
  return '<span class="'+(prefix||'timeline')+'-avatar"><span class="av-letter">'+escapeHtml(avatarLetter())+'</span>'+avatarImgHTML(prefix)+'</span>';
}
function lockScroll(){ savedScrollY=window.scrollY; document.body.classList.add('page-timeline-locked'); }
function unlockScroll(){ document.body.classList.remove('page-timeline-locked'); window.scrollTo(0,savedScrollY); }

// ═══ IndexedDB 图片存储 ═══
function idbOpen(){
  return new Promise(function(res,rej){
    if(idbDB)return res(idbDB);
    var req;
    try{ req=indexedDB.open(IDB_NAME,1); }
    catch(e){ rej(e); return; }
    req.onupgradeneeded=function(){ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess=function(){ idbDB=req.result; res(idbDB); };
    req.onerror=function(){ rej(req.error); };
  });
}
function idbPut(key,val){
  return idbOpen().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).put(val,key);
      tx.oncomplete=function(){ res(key); };
      tx.onerror=function(){ rej(tx.error); };
    });
  });
}
function idbGet(key){
  return idbOpen().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction(IDB_STORE,'readonly');
      var r=tx.objectStore(IDB_STORE).get(key);
      r.onsuccess=function(){ res(r.result||null); };
      r.onerror=function(){ rej(r.error); };
    });
  });
}
function dataUrlToBlob(dataUrl){
  var parts=dataUrl.split(','),mime=(parts[0].match(/data:([^;]+)/)||['',''])[1]||'image/jpeg';
  var bin=atob(parts[1]),len=bin.length,bytes=new Uint8Array(len);
  for(var i=0;i<len;i++)bytes[i]=bin.charCodeAt(i);
  return new Blob([bytes],{type:mime});
}
function storeImage(dataUrl){
  var id='img_'+Date.now()+'_'+Math.floor(Math.random()*99999);
  var blob;
  try{ blob=dataUrlToBlob(dataUrl); }
  catch(e){ return Promise.resolve(dataUrl); }
  return idbPut(id,blob).then(function(){ return 'idb:'+id; })
    .catch(function(){ return dataUrl; });
}
function prepareImages(imgs){
  var out=[];
  var tasks=imgs.map(function(src){
    if(typeof src==='string'&&src.indexOf('data:image')===0){
      return storeImage(src).then(function(id){ out.push(id); });
    }
    out.push(src);
    return Promise.resolve();
  });
  return Promise.all(tasks).then(function(){ return out; });
}
function resolveImage(src,cb){
  if(!src){ cb(null); return; }
  if(src.indexOf('idb:')===0){
    idbGet(src.slice(4)).then(function(v){
      if(v instanceof Blob){ cb(URL.createObjectURL(v)); }
      else if(typeof v==='string'){ cb(v); }
      else cb(null);
    }).catch(function(){ cb(null); });
  }else{
    cb(src);
  }
}

// ═══ 数据迁移 ═══
function dateKeyFromStr(s){
  if(!s)return'';
  var m=String(s).match(/(\d{1,2})月(\d{1,2})日/);
  if(!m)return'';
  var now=new Date();
  return now.getFullYear()+'-'+pad2(parseInt(m[1],10))+'-'+pad2(parseInt(m[2],10));
}
function parseDateMs(dateStr,dk){
  var dk2=dk||dateKeyFromStr(dateStr);
  var tm=String(dateStr||'').match(/(\d{1,2}):(\d{2})/);
  if(dk2&&tm){
    var d=new Date(dk2+'T00:00:00');
    d.setHours(parseInt(tm[1],10),parseInt(tm[2],10),0,0);
    return d.getTime();
  }
  var ms=dk2?Date.parse(dk2+'T00:00:00'):NaN;
  return isNaN(ms)?Date.now():ms;
}
function migrate(){
  var changed=false;
  if(!db.userProfile)db.userProfile={};
  var p=db.userProfile;
  if(!p.id){ p.id='user_001'; changed=true; }
  if(!p.displayName){ p.displayName='简纸'; changed=true; }
  if(!p.avatar)p.avatar=null;
  timelineState.profile=p;
  if(!Array.isArray(db.customTags)){ db.customTags=[]; changed=true; }
  if(!Array.isArray(db.customMoods)){ db.customMoods=[]; changed=true; }
  (db.timelinePosts||[]).forEach(function(a){
    if(!a.id){ a.id='activity_'+Date.now()+'_'+Math.floor(Math.random()*9999); changed=true; }
    if(!a.userId){ a.userId=p.id; changed=true; }
    if(!Array.isArray(a.tags)){ a.tags=(a.tags?String(a.tags).split(/[,，\s]+/).filter(Boolean):[]); changed=true; }
    if(!Array.isArray(a.images)){ a.images=(a.image?[a.image]:[]); changed=true; }
    if(!a.dateKey){ a.dateKey=a.occurDate||dateKeyFromStr(a.date)||todayISO(); changed=true; }
    if(!a.occurDate){ a.occurDate=a.dateKey; changed=true; }
    if(!a.createdAt){ a.createdAt=parseDateMs(a.date,a.dateKey); changed=true; }
    else if(typeof a.createdAt==='string'){ var ms=Date.parse(a.createdAt); if(!isNaN(ms)){ a.createdAt=ms; changed=true; } }
    if(!a.mood||typeof a.mood==='string'){
      var em=(a.mood?String(a.mood).trim():'').split(/\s+/);
      a.mood={emoji:em[0]||'',label:em[1]||em[0]||''};
      changed=true;
    }
  });
  return changed;
}
function migrateImages(){
  var moved=false,tasks=[];
  getActivities().forEach(function(a){
    (a.images||[]).forEach(function(src,i){
      if(typeof src==='string'&&src.indexOf('data:image')===0){
        tasks.push(storeImage(src).then(function(id){ a.images[i]=id; moved=true; }));
      }
    });
  });
  return {tasks:tasks,getMoved:function(){ return moved; }};
}
function fmtTime(p){
  if(p.date){
    var m=String(p.date).match(/\d{1,2}:\d{2}/);
    if(m)return m[0];
  }
  var d=new Date(p.createdAt||Date.now());
  return pad2(d.getHours())+':'+pad2(d.getMinutes());
}
function dayLabel(dk){
  if(dk===todayISO())return '今天';
  var y=new Date(); y.setDate(y.getDate()-1);
  var yk=y.getFullYear()+'-'+pad2(y.getMonth()+1)+'-'+pad2(y.getDate());
  if(dk===yk)return '昨天';
  return fmtDate(dk);
}

// ═══ 派生数据 ═══
function getFilteredActivities(){
  return getActivities().slice().sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);}).filter(function(a){
    return !timelineState.selectedDate||a.dateKey===timelineState.selectedDate;
  });
}
function getModalTags(){
  var tags=BASE_TAGS.slice();
  (db.customTags||[]).forEach(function(t){ if(tags.indexOf(t)<0)tags.push(t); });
  getActivities().forEach(function(a){
    (a.tags||[]).forEach(function(t){ if(tags.indexOf(t)<0)tags.push(t); });
  });
  return tags;
}
function getModalMoods(){
  var moods=MOODS.slice();
  (db.customMoods||[]).forEach(function(m){
    var dup=moods.some(function(x){return x[0]===m[0];});
    if(!dup)moods.push([m.emoji,m.label]);
  });
  return moods;
}

// ═══ 渲染 ═══
function renderAll(){
  renderDateFilter();
  renderGroups();
}
function renderDateFilter(){
  var bar=$('date-filter');
  bar.classList.toggle('show',!!timelineState.selectedDate);
  if(timelineState.selectedDate){
    $('df-date-text').textContent=fmtDate(timelineState.selectedDate);
    $('df-today').classList.toggle('show',timelineState.selectedDate!==todayISO());
  }
}
function renderGroups(){
  var list=getFilteredActivities();
  var wrap=$('timeline-groups'),empty=$('timeline-empty');
  if(!list.length){
    wrap.innerHTML='';
    empty.innerHTML=emptyHTML();
    empty.classList.add('show');
    return;
  }
  empty.classList.remove('show');
  // 按日期分组
  var groups=[],map={};
  list.forEach(function(a){
    var k=a.dateKey||'';
    if(!map[k]){ map[k]={key:k,items:[]}; groups.push(map[k]); }
    map[k].items.push(a);
  });
  wrap.innerHTML=groups.map(function(g){
    return '<section class="timeline-day" data-day="'+escapeHtml(g.key)+'">'
      +'<div class="timeline-day-title">'+escapeHtml(dayLabel(g.key))+'</div>'
      +g.items.map(itemHTML).join('')
      +'</section>';
  }).join('');
  resolveGroupImages();
}
function emptyHTML(){
  if(!getActivities().length){
    return '这里还很安静。<br><span class="empty-sub">记下第一刻吧</span><br>'
      +'<button class="empty-btn" id="empty-create">＋ 记下这一刻</button>';
  }
  if(timelineState.selectedDate){
    return escapeHtml(fmtDate(timelineState.selectedDate))+'没有留下记录。<br><span class="empty-sub">那天也许只是静静过去了。</span><br>'
      +'<button class="empty-btn" id="empty-today">回今天</button>';
  }
  return '没有找到想看的记录。<br><span class="empty-sub">看看别的日子吧</span>';
}
function itemHTML(p){
  var h='<article class="timeline-item" data-id="'+escapeHtml(p.id)+'">';
  h+='<div class="tl-time">'+escapeHtml(fmtTime(p))+'</div>';
  h+='<div class="tl-dot"></div>';
  h+='<div class="tl-body">';
  h+='<button class="timeline-author-profile-trigger" data-action="profile">';
  h+=avatarHTML('timeline');
  h+='<span class="timeline-display-name">'+escapeHtml(timelineState.profile.displayName)+'</span>';
  h+='</button>';
  if(p.content){
    h+='<div class="activity-text">'+escapeHtml(p.content)+'</div>';
  }
  var imgs=p.images||[];
  if(imgs.length){
    var c=Math.min(imgs.length,9);
    h+='<div class="activity-images c'+c+'">';
    imgs.slice(0,9).forEach(function(src,i){
      h+='<img class="activity-img" data-src="'+escapeHtml(src)+'" data-action="photo" data-id="'+escapeHtml(p.id)+'" data-idx="'+i+'" loading="lazy" alt="">';
    });
    h+='</div>';
  }
  var mood=p.mood||{};
  if((p.tags&&p.tags.length)||(mood.emoji||mood.label)){
    h+='<div class="activity-meta-row">';
    if(p.tags&&p.tags.length){
      h+='<div class="activity-tags">';
      p.tags.forEach(function(t){ h+='<span class="activity-tag">#'+escapeHtml(t)+'</span>'; });
      h+='</div>';
    }
    if(mood.emoji||mood.label){
      h+='<span class="activity-mood">'+escapeHtml(mood.emoji||'')+(mood.label?'<em class="mood-label">'+escapeHtml(mood.label)+'</em>':'')+'</span>';
    }
    h+='</div>';
  }
  h+='<button class="activity-more" data-action="menu" data-id="'+escapeHtml(p.id)+'" aria-label="更多">···</button>';
  h+='</div></article>';
  return h;
}
function resolveGroupImages(){
  [].forEach.call($('timeline-groups').querySelectorAll('.activity-img'),function(img){
    var src=img.getAttribute('data-src');
    if(!src||img.getAttribute('src'))return;
    resolveImage(src,function(url){
      if(url){ img.src=url; img.classList.add('loaded'); }
    });
  });
}

// ═══ Sheet 系统 ═══
function openSheet(title,html,handler){
  $('sheet-title').textContent=title;
  $('sheet-body').innerHTML=html;
  timelineState.sheetHandler=handler||null;
  $('subsheet-overlay').classList.add('show');
  modalState.activeSubSheet='sheet';
  lockScroll();
}
function closeSheet(){
  $('subsheet-overlay').classList.remove('show');
  timelineState.sheetHandler=null;
  modalState.activeSubSheet=null;
  unlockScroll();
}

// ═══ 标签 Sheet（多选 + 确定）═══
function openTagSheet(sel,cb){
  var sels=sel.slice();
  var html='<div class="sheet-row-head"><span>活动标签</span><button class="sheet-done" data-done="1">完成</button></div>'
    +'<div class="chip-grid">';
  getModalTags().forEach(function(t){
    html+='<button class="tag-chip'+(sels.indexOf(t)>=0?' is-sel':'')+'" data-chip="'+escapeHtml(t)+'">'+escapeHtml(t)+'</button>';
  });
  html+='</div>'
    +'<button class="sheet-new-tag" data-newtag="1">＋ 新标签</button>'
    +'<div class="sheet-new-tag-row" id="sheet-new-row"><input type="text" class="sheet-new-input" id="sheet-new-input" placeholder="新标签的名字" maxlength="8"><button class="sheet-new-btn" id="sheet-new-add">添加</button></div>';
  openSheet('',html,function(e){
    var chip=e.target.closest('.tag-chip');
    if(chip){
      var t=chip.getAttribute('data-chip');
      var i=sels.indexOf(t);
      if(i>=0)sels.splice(i,1);
      else sels.push(t);
      chip.classList.toggle('is-sel',sels.indexOf(t)>=0);
      return;
    }
    if(e.target.closest('[data-newtag]')){
      $('sheet-new-row').classList.add('show');
      setTimeout(function(){ var i=$('sheet-new-input'); if(i)i.focus(); },50);
      return;
    }
    if(e.target.closest('#sheet-new-add')){
      var input=$('sheet-new-input');
      var v=(input?input.value:'').trim();
      if(!v){ toast('给个名字吧'); return; }
      if(sels.indexOf(v)<0)sels.push(v);
      if((db.customTags||[]).indexOf(v)<0){
        if(!db.customTags)db.customTags=[];
        db.customTags.push(v);
        saveDatabase();
      }
      if(input)input.value='';
      openTagSheet(sels,cb); // 重绘包含新标签
      return;
    }
    if(e.target.closest('[data-done]')){ closeSheet(); cb(sels); }
  });
}

// ═══ 心情 Sheet（单选即关）═══
function openMoodSheet(cur,cb){
  var html='<div class="chip-grid">';
  getModalMoods().forEach(function(m){
    html+='<button class="tag-chip sheet-mood-chip'+(cur===m[0]?' is-sel':'')+'" data-mood="'+escapeHtml(m[0])+'" data-label="'+escapeHtml(m[1])+'">'+(cur===m[0]?'✓ ':'')+m[0]+' '+m[1]+'</button>';
  });
  html+='</div>';
  openSheet('此刻心情',html,function(e){
    var chip=e.target.closest('.tag-chip');
    if(!chip)return;
    var mood={emoji:chip.getAttribute('data-mood'),label:chip.getAttribute('data-label')};
    closeSheet();
    cb(mood);
  });
}

// ═══ 头像与名字 Sheet ═══
function openProfileSheet(){
  var p=timelineState.profile;
  var html=avatarHTML('sp')
    +'<div class="sp-name">'+escapeHtml(p.displayName)+'</div>'
    +'<div class="sp-sub">头像与名字</div>'
    +'<div class="sp-section">'
    +'<button class="sheet-row" data-sheet-action="avatar">更换头像<span class="sheet-row-arrow">›</span></button>'
    +'<button class="sheet-row" data-sheet-action="name">改个名字<span class="sheet-row-arrow">›</span></button>'
    +'</div>'
    +'<button class="sheet-cancel-btn" data-sheet-action="close">取消</button>';
  openSheet('',html,function(e){
    var b=e.target.closest('[data-sheet-action]');
    if(!b)return;
    var act=b.getAttribute('data-sheet-action');
    if(act==='close')closeSheet();
    else if(act==='avatar')changeAvatar();
    else if(act==='name')openRename();
  });
}
function changeAvatar(){
  var f=document.createElement('input');
  f.type='file';f.accept='image/*';f.style.display='none';
  f.addEventListener('change',function(){
    var file=f.files&&f.files[0];
    f.remove();
    if(!file||!file.type||file.type.indexOf('image/')!==0)return;
    downscale(file,512,function(url){
      timelineState.avatarDraft=url;
      showAvatarConfirm();
    });
  });
  document.body.appendChild(f);
  f.click();
}
function showAvatarConfirm(){
  var box=$('confirm-avatar');
  box.style.display='block';
  box.innerHTML='<img src="'+escapeHtml(timelineState.avatarDraft)+'" alt="">';
  $('confirm-text').textContent='这张照片做头像吗？';
  showConfirm('取消','保存头像',function(){
    var p=timelineState.profile;
    p.avatar=timelineState.avatarDraft;
    db.userProfile=p;
    saveDatabase();
    renderAll();
    toast('✓ 已更换');
  });
}
function openRename(){
  timelineState.nameDraft=timelineState.profile.displayName||'';
  var html='<div class="sheet-rename"><input type="text" id="rename-input" maxlength="20" value="'+escapeHtml(timelineState.nameDraft)+'">'
    +'<div class="sheet-rename-btns"><button class="pm-btn pm-btn-ghost" data-rename-cancel="1">取消</button>'
    +'<button class="pm-btn pm-btn-primary" data-rename-save="1">保存</button></div></div>';
  openSheet('改个名字',html,function(e){
    if(e.target.closest('[data-rename-cancel]')){ closeSheet(); return; }
    if(e.target.closest('[data-rename-save]')){
      var v=($('rename-input')?$('rename-input').value:'').trim();
      if(!v){ toast('名字不能是空的'); return; }
      if(v.length>20){ toast('名字别超过 20 个字'); return; }
      var p=timelineState.profile;
      p.displayName=v;   // 只改名字，id 不变
      db.userProfile=p;
      saveDatabase();
      closeSheet();
      renderAll();
      toast('✓ 已保存');
    }
  });
}

// ═══ 动作菜单 ═══
function openActionSheet(id){
  var a=findActivity(id);
  if(!a)return;
  var html=''
    +'<button class="sheet-action-btn" data-act="edit">编辑</button>'
    +'<button class="sheet-action-btn" data-act="date">调整日期</button>'
    +'<button class="sheet-action-btn" data-act="pin">'+(a.pinned?'取消置顶':'置顶')+'</button>'
    +'<button class="sheet-action-btn is-danger" data-act="del">删除</button>';
  openSheet('',html,function(e){
    var b=e.target.closest('[data-act]');
    if(!b)return;
    var act=b.getAttribute('data-act');
    closeSheet();
    if(act==='edit')openPublishModal(id);
    else if(act==='date'){ timelineState.editingId=id; openPublishModal(id); setTimeout(function(){ $('publish-date-row').classList.add('show'); $('publish-date').focus(); },80); }
    else if(act==='pin'){
      a.pinned=!a.pinned;
      saveDatabase();
      renderAll();
      toast(a.pinned?'置顶了':'取消了置顶');
    }
    else if(act==='del')confirmDelete(id);
  });
}

// ═══ 记下这一刻 / 编辑这条动态 ═══
function openPublishModal(editId){
  var d=timelineState.draft;
  timelineState.editingId=editId||null;
  var editing=!!editId;
  if(editing){
    var a=findActivity(editId);
    if(!a)return;
    d.content=a.content||'';
    d.tags=(a.tags||[]).slice();
    d.mood=a.mood&&(a.mood.emoji||a.mood.label)?{emoji:a.mood.emoji||'',label:a.mood.label||''}:{emoji:'😊',label:'开心'};
    d.images=(a.images||[]).slice();
    $('publish-title').textContent='编辑这条动态';
    $('pm-save').textContent='保存';
    $('publish-date-row').classList.add('show');
    $('publish-date').value=a.dateKey||todayISO();
  }else{
    d.content='';d.tags=[];d.mood={emoji:'😊',label:'开心'};d.images=[];
    $('publish-title').textContent='记下这一刻';
    $('pm-save').textContent='记下';
    $('publish-date-row').classList.remove('show');
  }
  $('publish-text').value=d.content;
  $('publish-file').value='';
  syncActionVals();
  renderPublishPhotos();
  $('publish-overlay').classList.add('show');
  modalState.publishOpen=true;
  lockScroll();
  setTimeout(function(){ $('publish-text').focus(); },60);
}
function closePublish(force){
  var d=timelineState.draft;
  if(!force&&draftDirty()&&!timelineState.editingId){
    $('confirm-avatar').style.display='none';
    $('confirm-text').textContent='这次还没记下，要放弃吗？';
    showConfirm('继续写','放弃',function(){ closePublish(true); });
    return;
  }
  $('publish-overlay').classList.remove('show');
  modalState.publishOpen=false;
  timelineState.editingId=null;
  unlockScroll();
}
function draftDirty(){
  var d=timelineState.draft;
  return (d.content||'').trim()!==''||d.tags.length>0||d.images.length>0;
}
function syncActionVals(){
  var d=timelineState.draft;
  var pv=$('act-photo-val'),tv=$('act-tags-val'),mv=$('act-mood-val');
  // 照片：＋ 照片 · 2
  pv.textContent=d.images.length?('· '+d.images.length):'';
  pv.classList.toggle('has',d.images.length>0);
  // 标签：选中后直接显示 # 日常 · 旅行
  if(d.tags.length){
    var show=d.tags.slice(0,2).join(' · ')+(d.tags.length>2?' +'+(d.tags.length-2):'');
    tv.textContent=show;
    $('act-tags-txt').textContent='';
  }else{
    tv.textContent='';
    $('act-tags-txt').textContent='标签';
  }
  // 心情：选中后显示 🥰 温暖
  if(d.mood.emoji){
    $('act-mood-ic').textContent=d.mood.emoji;
    $('act-mood-txt').textContent=d.mood.label;
    mv.textContent='';
  }else{
    $('act-mood-ic').textContent='☺';
    $('act-mood-txt').textContent='心情';
    mv.textContent='';
  }
}
function renderPublishPhotos(){
  var box=$('publish-photos');
  box.innerHTML='';
  timelineState.draft.images.forEach(function(src,i){
    var item=document.createElement('div');
    item.className='pm-photo-item';
    var im=document.createElement('img');
    im.alt='';
    resolveImage(src,function(url){ if(url&&im.parentNode)im.src=url; });
    var del=document.createElement('button');
    del.className='pm-photo-del';
    del.textContent='✕';
    del.setAttribute('data-photo-del',i);
    item.appendChild(im);
    item.appendChild(del);
    box.appendChild(item);
  });
}
function onFiles(files){
  var d=timelineState.draft;
  if(!files||!files.length)return;
  var remain=9-d.images.length;
  Array.from(files).slice(0,remain).forEach(function(f){
    if(!f.type||f.type.indexOf('image/')!==0)return;
    downscale(f,1280,function(url){
      d.images.push(url);
      syncActionVals();
      renderPublishPhotos();
    });
  });
}
function downscale(file,maxW,cb){
  var r=new FileReader();
  r.onload=function(){
    var img=new Image();
    img.onload=function(){
      var w=img.width,h=img.height;
      var s=Math.min(1,maxW/Math.max(w,h));
      if(s>=1){ cb(r.result); return; }
      var c=document.createElement('canvas');
      c.width=Math.round(w*s); c.height=Math.round(h*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',0.82));
    };
    img.onerror=function(){ cb(r.result); };
    img.src=r.result;
  };
  r.readAsDataURL(file);
}
function savePublish(){
  if(SAVING)return;
  var d=timelineState.draft;
  var content=(d.content||'').trim();
  if(!content&&!d.images.length){
    toast('写下点什么，或放张照片吧');
    return;
  }
  SAVING=true;
  prepareImages(d.images).then(function(ids){
    var now=new Date();
    var ds=now.getFullYear()+'-'+pad2(now.getMonth()+1)+'-'+pad2(now.getDate());
    if(timelineState.editingId){
      var a=findActivity(timelineState.editingId);
      if(!a){ SAVING=false; return; }
      var dateInput=$('publish-date');
      if(dateInput.value)a.dateKey=dateInput.value;
      a.content=content;
      a.tags=d.tags.slice();
      a.mood={emoji:d.mood.emoji,label:d.mood.label};
      a.images=ids;
      a.image=ids[0]||'';
      a.occurDate=a.dateKey;
      // 时间部分保留：date 只更新日期部分
      var hm=fmtTime(a);
      a.date=fmtDate(a.dateKey)+' '+hm;
      if(!safeSave()){ SAVING=false; return; }
      closeSheet();
      closePublish(true);
      renderAll();
      toast('存好了');
      SAVING=false;
      return;
    }
    var post={
      id:'activity_'+now.getTime()+'_'+Math.floor(Math.random()*999),
      userId:timelineState.profile.id,
      content:content,
      tags:d.tags.slice(),
      mood:{emoji:d.mood.emoji,label:d.mood.label},
      images:ids,
      image:ids[0]||'',
      createdAt:now.getTime(),
      dateKey:ds,
      occurDate:ds,
      date:fmtDate(ds)+' '+pad2(now.getHours())+':'+pad2(now.getMinutes())
    };
    db.timelinePosts=db.timelinePosts||[];
    db.timelinePosts.unshift(post);
    if(!safeSave()){ SAVING=false; return; }
    closeSheet();
    closePublish(true);
    timelineState.selectedDate=null;
    renderAll();
    window.scrollTo(0,0);
    toast('记下了');
    SAVING=false;
  }).catch(function(e){
    console.error('save error',e);
    toast('没记成功，再试一次');
    SAVING=false;
  });
}
function safeSave(){
  try{ saveDatabase(); return true; }
  catch(e){
    console.error('quota',e);
    toast('存储有点挤，正在整理照片…');
    var m=migrateImages();
    Promise.all(m.tasks).then(function(){
      if(m.getMoved()){
        try{ saveDatabase(); toast('整理好了，再试一次'); }
        catch(e2){ toast('存储满了，删一些带照片的再试'); }
      }else{ toast('存储满了，删一些带照片的再试'); }
    });
    return false;
  }
}

// ═══ 删除 ═══
function confirmDelete(id){
  $('confirm-avatar').style.display='none';
  $('confirm-text').textContent='要删掉这一段记录吗？';
  showConfirm('取消','删除',function(){
    db.timelinePosts=getActivities().filter(function(a){return a.id!==id;});
    saveDatabase();
    timelineState.activities=db.timelinePosts;
    renderAll();
    toast('删掉了');
  });
}

// ═══ 确认系统 ═══
function showConfirm(cancelLabel,okLabel,cb){
  $('confirm-cancel').textContent=cancelLabel||'取消';
  $('confirm-ok').textContent=okLabel||'确定';
  confirmCallback=cb;
  $('confirm-overlay').classList.add('show');
  modalState.confirmOpen=true;
  lockScroll();
}
function hideConfirm(){
  $('confirm-overlay').classList.remove('show');
  modalState.confirmOpen=false;
  confirmCallback=null;
  unlockScroll();
}

// ═══ Toast ═══
function toast(m){
  var t=$('toast');
  t.textContent=m;
  t.classList.add('show');
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.classList.remove('show'); },1800);
}

// ═══ 日期浮层 ═══
function openDatePopover(){
  $('date-popover').classList.add('show');
  isDatePopoverOpen=true;
  var input=$('dp-input');
  input.value=timelineState.selectedDate||'';
  setTimeout(function(){
    try{
      if(input.showPicker){ input.showPicker(); }
      else{ input.focus(); input.click(); }
    }catch(e){}
  },30);
}
function closeDatePopover(){
  $('date-popover').classList.remove('show');
  isDatePopoverOpen=false;
}
function toggleDatePopover(){
  if(isDatePopoverOpen)closeDatePopover();
  else openDatePopover();
}

// ═══ 事件绑定（仅一次）═══
function bindEvents(){
  $('btn-back').addEventListener('click',smartBack);
  $('btn-date').addEventListener('click',toggleDatePopover);
  $('df-date').addEventListener('click',openDatePopover);
  $('df-today').addEventListener('click',function(){
    timelineState.selectedDate=todayISO();
    renderAll();
  });
  $('df-clear').addEventListener('click',function(){
    timelineState.selectedDate=null;
    renderAll();
  });
  $('dp-input').addEventListener('change',function(){
    var v=this.value;
    if(v){ timelineState.selectedDate=v; closeDatePopover(); renderAll(); }
  });
  document.addEventListener('click',function(e){
    if(!isDatePopoverOpen)return;
    var p=$('date-popover');
    if(p.contains(e.target)||$('btn-date').contains(e.target)||$('df-date').contains(e.target))return;
    closeDatePopover();
  });

  // 找一找
  $('find-entry').addEventListener('click',function(){
    window.location.href='search/';
  });

  // 时间线委托
  $('timeline-groups').addEventListener('click',function(e){
    var t=e.target.closest('[data-action]');
    if(!t)return;
    var action=t.getAttribute('data-action');
    if(action==='profile')openProfileSheet();
    else if(action==='menu')openActionSheet(t.getAttribute('data-id'));
    else if(action==='photo'){
      var pid=t.getAttribute('data-id'),idx=t.getAttribute('data-idx')||'0';
      window.location.href='photo-view/?activity='+encodeURIComponent(pid)+'&image='+idx;
    }
  });

  // 空状态按钮
  $('timeline-empty').addEventListener('click',function(e){
    if(e.target.closest('#empty-create'))openPublishModal(null);
    if(e.target.closest('#empty-today')){
      timelineState.selectedDate=todayISO();
      renderAll();
    }
  });

  // 记下这一刻
  $('btn-create').addEventListener('click',function(){ openPublishModal(null); });
  $('pm-close').addEventListener('click',function(){ closePublish(false); });
  $('pm-cancel').addEventListener('click',function(){ closePublish(false); });
  $('publish-overlay').addEventListener('click',function(e){
    if(e.target===this)closePublish(false);
  });
  $('pm-save').addEventListener('click',savePublish);
  $('publish-text').addEventListener('input',function(){ timelineState.draft.content=this.value; });
  $('act-photo').addEventListener('click',function(){ $('publish-file').click(); });
  $('act-tags').addEventListener('click',function(){
    openTagSheet(timelineState.draft.tags.slice(),function(sel){
      timelineState.draft.tags=sel.slice();
      syncActionVals();
    });
  });
  $('act-mood').addEventListener('click',function(){
    openMoodSheet(timelineState.draft.mood.emoji,function(mood){
      timelineState.draft.mood=mood;
      syncActionVals();
    });
  });
  $('publish-file').addEventListener('change',function(){ onFiles(this.files); this.value=''; });
  $('publish-photos').addEventListener('click',function(e){
    var del=e.target.closest('[data-photo-del]');
    if(!del)return;
    timelineState.draft.images.splice(parseInt(del.getAttribute('data-photo-del'),10),1);
    syncActionVals();
    renderPublishPhotos();
  });

  // Sheet（一次性委托）
  $('sheet-body').addEventListener('click',function(e){
    if(timelineState.sheetHandler)timelineState.sheetHandler(e);
  });
  $('subsheet-overlay').addEventListener('click',function(e){
    if(e.target===this)closeSheet(); // 只关当前 Sheet，不动 publish
  });
  $('sheet-body').addEventListener('keydown',function(e){
    if(e.key==='Enter'&&e.target.id==='sheet-new-input'){
      e.preventDefault();
      timelineState.sheetHandler&&timelineState.sheetHandler({target:document.getElementById('sheet-new-add')});
    }
  });

  // 确认
  $('confirm-ok').addEventListener('click',function(){
    var cb=confirmCallback;
    hideConfirm();
    if(cb)cb();
  });
  $('confirm-cancel').addEventListener('click',hideConfirm);
  $('confirm-overlay').addEventListener('click',function(e){
    if(e.target===this)hideConfirm();
  });
}

// ═══ URL 定位（找一找跳回）═══
function locateActivity(){
  var m=window.location.search.match(/[?&]activity=([^&]+)/);
  if(!m)return;
  var id=decodeURIComponent(m[1]);
  setTimeout(function(){
    var el=document.querySelector('.timeline-item[data-id="'+id+'"]');
    if(!el)return;
    el.scrollIntoView({block:'center'});
    el.classList.add('hl');
    setTimeout(function(){ el.classList.remove('hl'); },1500);
  },120);
}

// ═══ 初始化 ═══
loadDatabase();
var migrated=migrate();
if(migrated){ try{ saveDatabase(); }catch(e){} }
timelineState.activities=db.timelinePosts||[];
renderAll();
bindEvents();
locateActivity();
var imgMove=migrateImages();
if(imgMove.tasks.length){
  Promise.all(imgMove.tasks).then(function(){
    if(imgMove.getMoved()){
      try{ saveDatabase(); }catch(e){}
      renderAll();
    }
  });
}
