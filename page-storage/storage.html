<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>简纸 — 收纳盒</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+SC:wght@300;400;600;700&family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="../shared.js"></script>
<style>
body.page-storage { margin:0; background:#0F0F0E; font-family:'Noto Serif SC','Outfit',sans-serif;
  -webkit-tap-highlight-color:transparent; }
.page-storage .app-viewport { max-width:480px; margin:0 auto; background:#F5F4F0; min-height:100vh; display:flex; flex-direction:column; }
.page-storage .no-scrollbar::-webkit-scrollbar { display:none; }
.page-storage .no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }
.page-storage .header-bar { height:56px; border-bottom:1px solid #EAE7E1; padding:0 16px; display:flex; align-items:center; justify-content:space-between; background:#F5F4F0; }
.page-storage .back-btn { background:none; border:none; padding:8px; color:#2C2B29; cursor:pointer; }
.page-storage .header-title { font-size:14px; font-weight:700; color:#2C2B29; }
.page-storage .add-btn { width:32px; height:32px; border-radius:999px; background:#405140; color:#FBFBFA; border:none; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.page-storage .list-area { flex:1; overflow-y:auto; padding:16px 16px 96px; display:flex; flex-direction:column; gap:16px; }
.page-storage .box-card { padding:20px; background:#FBFBFA; border:1px solid #EAE7E1; border-radius:20px; }
.page-storage .box-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.page-storage .box-icon-title { display:flex; align-items:center; gap:8px; }
.page-storage .box-icon { font-size:20px; }
.page-storage .box-name { font-size:12px; font-weight:700; color:#2C2B29; }
.page-storage .box-add-item { background:none; border:none; font-size:11px; color:#405140; font-weight:700; cursor:pointer; font-family:inherit; }
.page-storage .item-row { display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.7); padding:6px 12px; border-radius:8px; border:1px solid #EAE7E1; margin-bottom:4px; }
.page-storage .item-name { font-size:12px; font-weight:700; color:#2C2B29; }
.page-storage .item-detail { font-size:9px; color:#A1A1AA; }
.page-storage .item-del { background:none; border:none; font-size:10px; color:#BE123C; cursor:pointer; font-family:inherit; }
.page-storage .empty-msg { font-size:10px; color:#5C5854; }
.page-storage .empty-state { text-align:center; padding:48px; color:#A1A1AA; font-size:14px; }
.page-storage .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px; }
.page-storage .modal-overlay.hidden { display:none; }
.page-storage .modal-content { background:#F5F4F0; border:1px solid #DDD9CF; width:100%; max-width:360px; border-radius:24px; padding:24px; }
.page-storage .modal-head { display:flex; justify-content:space-between; padding-bottom:8px; border-bottom:1px solid #EAE7E1; margin-bottom:16px; }
.page-storage .modal-title { font-size:14px; font-weight:700; color:#2C2B29; }
.page-storage .modal-close { background:none; border:none; color:#5C5854; font-size:16px; cursor:pointer; }
.page-storage .input-field { width:100%; height:40px; padding:0 12px; font-size:12px; border:1px solid #EAE7E1; border-radius:8px; margin-bottom:8px; box-sizing:border-box; }
.page-storage .input-field-last { width:100%; height:40px; padding:0 12px; font-size:12px; border:1px solid #EAE7E1; border-radius:8px; margin-bottom:16px; box-sizing:border-box; }
.page-storage .submit-btn { width:100%; height:44px; background:#405140; color:#FBFBFA; border:none; border-radius:12px; font-size:12px; font-weight:700; cursor:pointer; }

.page-storage .nav-bar { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); width:calc(100% - 40px); max-width:430px; height:56px; background:rgba(251,251,250,0.92); backdrop-filter:blur(12px); border:1px solid #EAE7E1; border-radius:20px; display:flex; align-items:center; justify-content:space-around; padding:0 6px; z-index:40; box-shadow:0 4px 20px rgba(0,0,0,0.1); }
.page-storage .nav-btn { display:flex; flex-direction:column; align-items:center; justify-content:center; width:48px; height:48px; border-radius:16px; background:transparent; border:none; cursor:pointer; padding:0; }
.page-storage .nav-inner { width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:12px; }
.page-storage .nav-active { background:#E3E8E3; }
.page-storage .nav-icon { width:20px; height:20px; }
.page-storage .nav-label { font-size:8px; font-weight:700; margin-top:2px; }
.page-storage .clr-sage { color:#405140; }
.page-storage .clr-ink { color:#5C5854; }

	.page-storage .num{font-family:"Inter",Arial,sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
	</style>
</head>
<body class="page-storage">
<div class="app-viewport">
  <div class="header-bar">
    <button onclick="history.back()" class="back-btn"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15.75 19.5L8.25 12l7.5-7.5"/></svg></button>
    <h3 class="header-title">收纳盒 📦</h3>
    <button onclick="openCreateBox()" class="add-btn">+</button>
  </div>
  <div class="list-area no-scrollbar" id="box-list"></div>
  <nav class="nav-bar">
    <button class="nav-btn" onclick="redirectTo('../page-today/index.html')"><div class="nav-inner"><svg class="nav-icon text-ink-500" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h2M20 12h2M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/></svg></div><span class="nav-label clr-ink">今天</span></button>
    <button class="nav-btn" onclick="redirectTo('../page-todo/todo.html')"><div class="nav-inner"><svg class="nav-icon text-ink-500" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></div><span class="nav-label clr-ink">待办</span></button>
    <button class="nav-btn" onclick="redirectTo('../page-records/records.html')"><div class="nav-inner"><svg class="nav-icon text-ink-500" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 016.5 2H20v20H6.5a2.5 2.5 0 010-5H20"/><path d="M10 8h6M10 12h4"/></svg></div><span class="nav-label clr-ink">记录</span></button>
    <button class="nav-btn" onclick="redirectTo('../page-tools/tools.html')"><div class="nav-inner"><svg class="nav-icon text-ink-500" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg></div><span class="nav-label clr-ink">工具</span></button>
    <button class="nav-btn" id="nav-storage"><div class="nav-inner nav-active"><svg class="nav-icon text-ink-500" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 7l-9-5-9 5m18 0l-9 5m9-5v10l-9 5m0-15v14"/><path d="M3.97 12.08L12 17l8.03-4.92"/></svg></div><span class="nav-label clr-sage">收纳盒</span></button>
  </nav>
</div>
<div class="modal-overlay hidden" id="global-modal"><div class="modal-content" id="modal-content-area"></div></div>
<script>
loadDatabase();

function render() {
  var c = document.getElementById('box-list');
  if (!c) return;
  c.innerHTML = '';
  if (db.customBoxes.length===0) { c.innerHTML='<div class="empty-state">还没有收纳盒</div>'; return; }
  db.customBoxes.forEach(function(box) {
    var itemsHtml = box.items.map(function(it) {
      return '<div class="item-row"><div><p class="item-name">'+escapeHtml(it.name)+'</p><p class="item-detail">品牌:'+escapeHtml(it.brand||'')+' 型号:'+escapeHtml(it.model||'')+'</p></div>' +
        '<button onclick="deleteItem(\''+box.id+'\',\''+it.id+'\')" class="item-del">✕</button></div>';
    }).join('') || '<p class="empty-msg">空的</p>';
    c.innerHTML += '<div class="box-card"><div class="box-head"><div class="box-icon-title"><span class="box-icon">'+(box.icon||'📁')+'</span><h4 class="box-name">'+escapeHtml(box.name)+'</h4></div>' +
      '<button onclick="openAddItem(\''+box.id+'\')" class="box-add-item">+ 塞入</button></div><div>'+itemsHtml+'</div></div>';
  });
}

function openCreateBox() {
  showModal('<div><div class="modal-head"><span class="modal-title">新建收纳盒 📦</span><button onclick="closeModal()" class="modal-close">✕</button></div>' +
    '<input id="box-name" placeholder="名称" class="input-field-last">' +
    '<button onclick="submitBox()" class="submit-btn">创建</button></div>');
}

function submitBox() {
  var inp = document.getElementById('box-name');
  if (!inp||!inp.value.trim()) return;
  db.customBoxes.push({id:'box_'+Date.now(), name:inp.value.trim(), icon:'📁', template:'通用模板', items:[]});
  saveDatabase(); closeModal(); render();
}

function openAddItem(boxId) {
  showModal('<div><div class="modal-head"><span class="modal-title">添加物品</span><button onclick="closeModal()" class="modal-close">✕</button></div>' +
    '<input id="item-name" placeholder="物品名" class="input-field">' +
    '<input id="item-brand" placeholder="品牌" class="input-field">' +
    '<input id="item-model" placeholder="型号" class="input-field-last">' +
    '<button onclick="submitItem(\''+boxId+'\')" class="submit-btn">存入</button></div>');
}

function submitItem(boxId) {
  var n=document.getElementById('item-name'), b=document.getElementById('item-brand'), m=document.getElementById('item-model');
  if (!n||!n.value.trim()) return;
  var box = db.customBoxes.find(function(x){return x.id===boxId;});
  if (box) {
    box.items.push({id:'bi_'+Date.now(), name:n.value.trim(), brand:b?b.value.trim():'', model:m?m.value.trim():'', date:'2028-01-01'});
    saveDatabase();
  }
  closeModal(); render();
}

function deleteItem(boxId, itemId) {
  var box = db.customBoxes.find(function(x){return x.id===boxId;});
  if (box) { box.items = box.items.filter(function(i){return i.id!==itemId;}); saveDatabase(); render(); }
}

render();
</script>
</body>
</html>
