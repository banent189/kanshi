<html lang="zh-CN">

<style>
/* ═══════ 变量 ═══════ */
:root {
  --page-bg: #F5F4F0;
  --paper: #FBFBFA;
  --ink: #2C2B29;
  --muted: #5C5854;
  --light: #A1A1AA;
  --faint: #D4D0C8;
  --line: #EAE7E1;
  --soft-green: #E3E8E3;
  --green: #405140;
  --red: #BE123C;
  --lavender: #B8A9D4;
  --weather-shadow: 0 6px 18px rgba(28,27,26,0.08);
  --card-shadow: 0 4px 10px rgba(28,27,26,0.08);
}

/* ═══════ 全局 ═══════ */
body.page-today { margin:0; background:#0F0F0E; font-family:'Noto Serif SC','Outfit',sans-serif; -webkit-tap-highlight-color:transparent; overflow-x:hidden; }
.page-today .app-viewport { max-width:480px; margin:0 auto; background:var(--page-bg); min-height:100vh; box-shadow:0 0 50px rgba(0,0,0,0.6); display:flex; flex-direction:column; }
.page-today .scroll-area { flex:1; overflow-y:auto; padding-bottom:110px; }
.page-today .no-scrollbar::-webkit-scrollbar { display:none; }
.page-today .no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }

/* ═══════ 第一层：页眉 ═══════ */
.page-today .page-header { padding:24px 22px 6px; }

/* 品牌行：KANSHI 简纸（大） ｜ 搜索（右上轻量） */
.page-today .top-row { display:flex; justify-content:space-between; align-items:center; }
.page-today .brand-group { display:flex; align-items:center; gap:12px; }
.page-today .brand { font-family:'Cinzel',Georgia,serif; font-size:36px; font-weight:700; letter-spacing:0.1em; color:var(--ink); line-height:1; margin:0; }
.page-today .brand-chip { display:inline-flex; align-items:center; justify-content:center; height:26px; padding:0 12px; border-radius:10px; background:var(--ink); color:var(--paper); font-size:13px; font-weight:600; transform:translateY(2px); }
.page-today .search-toggle { background:none; border:none; padding:0; cursor:pointer; display:flex; align-items:center; opacity:0.6; transform:translateY(2px); }
.page-today .search-toggle:active { opacity:1; }
.page-today .search-toggle img { width:24px; height:24px; display:block; }

/* 日期行：小字一行 */
.page-today .date-line { margin-top:8px; font-size:11px; color:#A1A19A; display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
.page-today .date-line-sep { color:#D4D0C8; margin:0 2px; }
.page-today .weather-mark { display:inline-flex; align-items:center; gap:4px; cursor:pointer; font-size:11px; color:#B8B4AC; }
.page-today .weather-mark:active { color:var(--muted); }
.page-today .weather-temp { font-weight:600; color:#7E997E; }
.page-today .weather-loc { color:#B8B4AC; }

/* ═══════ 第二层：今日签 ═══════ */
.page-today .fortune-section { padding:12px 22px 22px; }
.page-today .fortune-card { padding:20px 22px 22px; border:1px solid rgba(82,81,75,0.12); border-radius:24px; background:rgba(255,255,255,0.58); box-shadow:var(--card-shadow); }

/* 标签行：今日运签 + 幸运色pill（同排右上） */
.page-today .fortune-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.page-today .fortune-tag { display:inline-flex; align-items:center; justify-content:center; height:28px; padding:0 13px; border-radius:999px; background:var(--soft-green); color:#5C6B5C; font-size:12px; font-weight:600; letter-spacing:0.04em; }
.page-today .lucky-pill { display:inline-flex; align-items:center; gap:6px; padding:4px 12px 4px 10px; border-radius:999px; background:rgba(248,246,242,0.92); border:1px solid rgba(130,131,124,0.12); color:#9687BD; font-size:14px; font-weight:600; }
.page-today .lucky-dot { width:14px; height:14px; flex:none; border-radius:50%; background:var(--lavender); border:1px solid rgba(66,59,84,0.16); box-shadow:inset 0 0 0 1px rgba(255,255,255,0.2); display:inline-block; }
/* zodiac color overrides */
.page-today .lucky-dot.dot-zihei { background:#1C1B1A; }
.page-today .lucky-dot.dot-tuhuang { background:#C4A24E; }
.page-today .lucky-dot.dot-songlv { background:#2D5A27; }
.page-today .lucky-dot.dot-ouhe { background:#C9A9C6; }
.page-today .lucky-dot.dot-darkgold { background:#B8860B; }
.page-today .lucky-dot.dot-zhusha { background:#C04040; }
.page-today .lucky-dot.dot-yanzhi { background:#B22222; }
.page-today .lucky-dot.dot-tubai { background:#D2C9B8; }
.page-today .lucky-dot.dot-yuebai { background:#A8C8D8; }
.page-today .lucky-dot.dot-liujin { background:#D4AF37; }
.page-today .lucky-dot.dot-tuose { background:#A0816A; }
.page-today .lucky-dot.dot-daizi { background:#4A3C5C; }

/* 签文 */
.page-today .fortune-quote { margin:0 0 14px; font-size:16px; line-height:1.8; font-weight:700; color:var(--ink); letter-spacing:0.02em; padding-left:10px; border-left:2px solid #EAE7E1; }

/* 底部宜忌 */
.page-today .fortune-footer { padding-top:14px; border-top:1px dashed rgba(104,103,97,0.18); font-size:13px; line-height:1.5; color:var(--muted); display:flex; gap:6px; flex-wrap:wrap; align-items:baseline; }
.page-today .ff-suit { color:#4A7A5C; font-weight:700; margin-right:4px; }
.page-today .ff-sep { color:var(--faint); margin:0 12px; }
.page-today .ff-avoid { color:var(--red); font-weight:700; margin-right:4px; }
.page-today .ff-text { color:var(--muted); }

/* ═══════ 搜索面板 ═══════ */
.page-today .search-panel-wrap { display:none; padding:0 22px 16px; }
.page-today .search-panel-wrap.show { display:block; }
.page-today .search-input-wrap { position:relative; }
.page-today .search-input-field { width:100%; height:42px; padding:0 16px 0 40px; border-radius:999px; border:1px solid var(--line); background:var(--paper); font-size:12px; color:var(--ink); outline:none; box-sizing:border-box; font-family:inherit; }
.page-today .search-input-field:focus { border-color:#7E997E; }
.page-today .search-icon-left { position:absolute; left:14px; top:13px; width:16px; height:16px; color:var(--muted); }
.page-today .search-autocomplete { border-radius:16px; border:1px solid var(--line); background:#FFF; margin-top:8px; max-height:256px; overflow-y:auto; display:none; box-shadow:0 8px 24px rgba(0,0,0,0.1); }
.page-today .search-autocomplete.show { display:block; }
.page-today .search-empty { padding:12px 16px; font-size:12px; color:var(--light); }
.page-today .search-item { padding:12px 16px; font-size:12px; color:var(--ink); border-bottom:1px solid #F5F4F0; cursor:pointer; display:flex; justify-content:space-between; }
.page-today .search-item:last-child { border-bottom:none; }
.page-today .search-item:hover { background:#F5F4F0; }
.page-today .search-badge { font-size:9px; background:var(--soft-green); color:var(--green); padding:2px 6px; border-radius:4px; }

/* ═══════ 第三层：今天，留下些什么 ═══════ */
.page-today .action-section { padding:0 22px 24px; }
.page-today .section-title { font-size:13px; font-weight:700; color:var(--ink); margin-bottom:14px; letter-spacing:0.02em; }
.page-today .action-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.page-today .action-card { padding:16px; border:1px solid var(--line); border-radius:16px; text-decoration:none; color:inherit; cursor:pointer; background:var(--paper); box-shadow:var(--card-shadow); transition:all 0.3s cubic-bezier(0.16,1,0.3,1); }
.page-today .action-card:active { transform:scale(0.97); background:#F5F4F0; }
.page-today .action-card-icon { margin-bottom:6px; display:flex; }
.page-today .action-icon { width:22px; height:22px; color:#7E997E; }
.page-today .action-card-title { font-size:13px; font-weight:700; color:var(--ink); margin-bottom:2px; }
.page-today .action-card-desc { font-size:10px; color:var(--muted); }

/* ═══════ 第四层：今天的痕迹 ═══════ */
.page-today .trace-section { padding:0 22px 18px; }
.page-today .trace-empty { padding:12px 0 8px; text-align:center; color:#C5BFB5; font-size:11px; line-height:1.7; background:transparent; }

.page-today .trace-list { display:flex; flex-direction:column; gap:4px; }
.page-today .trace-item { display:flex; gap:10px; padding:10px 14px; background:var(--paper); border:1px solid var(--line); border-radius:10px; box-shadow:var(--card-shadow); transition:all 0.3s; cursor:pointer; }
.page-today .trace-item:active { transform:scale(0.98); background:#F5F4F0; }
.page-today .trace-time { font-size:9px; color:var(--light); flex-shrink:0; width:36px; padding-top:2px; }
.page-today .trace-body { flex:1; min-width:0; }
.page-today .trace-type { font-size:9px; color:#7E997E; font-weight:600; margin-bottom:2px; }
.page-today .trace-preview { font-size:11px; color:var(--ink); line-height:1.4; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.page-today .trace-all { display:inline-block; margin-top:6px; font-size:10px; color:#7E997E; cursor:pointer; text-decoration:none; text-align:right; width:100%; background:none; border:none; font-family:inherit; }
.page-today .trace-all:active { color:var(--green); }

/* ═══════ 第五层：手边工具 ═══════ */
.page-today .tools-section { padding:0 22px 24px; }
.page-today .tools-tray { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; height:86px; border-radius:22px; border:1px solid var(--line); background:rgba(255,255,255,0.5); box-shadow:0 2px 6px rgba(28,27,26,0.04); overflow:hidden; }
.page-today .tools-tray-item { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-decoration:none; color:var(--ink); cursor:pointer; position:relative; }
.page-today .tools-tray-item:active { background:rgba(227,232,227,0.5); }
.page-today .tools-tray-item + .tools-tray-item { border-left:1px solid rgba(234,231,225,0.6); }
.page-today .tools-tray-icon { width:22px; height:22px; color:#7E997E; }
.page-today .tools-tray-label { font-size:13px; font-weight:600; color:var(--ink); }

/* ═══════ 底部导航 ═══════ */
.page-today .nav-bar { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); width:calc(100% - 40px); max-width:430px; height:56px; background:rgba(251,251,250,0.92); backdrop-filter:blur(12px); border:1px solid var(--line); border-radius:20px; display:flex; align-items:center; justify-content:space-around; padding:0 6px; z-index:40; box-shadow:0 4px 20px rgba(0,0,0,0.1); }
.page-today .nav-btn { display:flex; flex-direction:column; align-items:center; justify-content:center; width:44px; height:44px; border-radius:12px; background:transparent; border:none; cursor:pointer; padding:0; }
.page-today .nav-icon-wrap { width:28px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:8px; transition:all 0.2s; }
.page-today .nav-active-pill { background:#E3E8E3; }
.page-today .nav-icon { width:18px; height:18px; transition:color 0.2s; }
.page-today .nav-label { font-size:7px; font-weight:600; margin-top:1px; transition:color 0.2s; }
.page-today .clr-sage { color:var(--green); }
.page-today .clr-ink { color:#8B8B80; }
.page-today .text-sage-800 { color:var(--green); }
.page-today .text-ink-500 { color:#8B8B80; }

/* ═══════ 模态框 ═══════ */
.page-today .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px; }
.page-today .modal-overlay.hidden { display:none; }
.page-today .modal-box { background:#F5F4F0; border:1px solid #DDD9CF; width:100%; max-width:360px; border-radius:24px; padding:24px; box-shadow:0 12px 40px rgba(0,0,0,0.3); max-height:85vh; overflow-y:auto; }

/* Toast */
.page-today .kanshi-toast { position:fixed; top:24px; left:50%; transform:translateX(-50%); z-index:999; background:#1C1B1A; color:#FBBF24; border:1px solid #2C2B29; padding:8px 20px; border-radius:999px; font-size:12px; font-weight:700; box-shadow:0 8px 24px rgba(0,0,0,0.4); display:flex; align-items:center; gap:8px; animation:toastIn 0.3s ease-out; }
@keyframes toastIn { 0%{opacity:0;transform:translateX(-50%)translateY(-12px)} 100%{opacity:1;transform:translateX(-50%)translateY(0)} }

/* 快速记账 */
.page-today .finance-type-bar { display:flex; gap:8px; margin-bottom:16px; }
.page-today .finance-type-btn { flex:1; height:40px; border-radius:10px; border:1px solid var(--line); background:var(--paper); font-family:inherit; font-size:12px; font-weight:600; cursor:pointer; color:var(--muted); transition:all 0.15s; }
.page-today .finance-type-btn.active { background:var(--ink); color:#FFF; border-color:var(--ink); }
.page-today .finance-amount-wrap { display:flex; align-items:center; gap:4px; margin-bottom:16px; }
.page-today .finance-amount-symbol { font-size:18px; font-weight:700; color:var(--ink); }
.page-today .finance-amount-input { flex:1; height:52px; border:none; background:transparent; font-size:32px; font-weight:700; outline:none; font-family:'Inter','Outfit',sans-serif; text-align:right; color:var(--ink); }
.page-today .finance-amount-input::placeholder { color:var(--faint); }
.page-today .finance-cat-grid { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:6px; margin-bottom:16px; }
.page-today .finance-cat-btn { padding:8px 4px; border-radius:8px; border:1px solid var(--line); background:var(--paper); font-size:11px; cursor:pointer; text-align:center; font-family:inherit; color:var(--muted); }
.page-today .finance-cat-btn.active { background:var(--ink); color:#FFF; border-color:var(--ink); }
.page-today .finance-note-input { width:100%; height:40px; padding:0 14px; border:1px solid var(--line); border-radius:10px; font-size:12px; outline:none; box-sizing:border-box; font-family:inherit; margin-bottom:20px; }
.page-today .btn-cancel { flex:1; height:42px; background:#F5F4F0; color:var(--muted); border:none; border-radius:12px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; }
.page-today .btn-primary { flex:1; height:42px; background:var(--green); color:#FFF; border:none; border-radius:12px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; }
.page-today .modal-actions { display:flex; gap:10px; }

	.page-today .num{font-family:"Inter",Arial,sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
	</style>
</head>

function wmoIcon(code) {
  if (code===0) return '☀️';
  if (code<=3) return '🌤️';
  if (code<=48) return '🌫️';
  if (code<=57) return '🌦️';
  if (code<=67) return '🌧️';
  if (code<=77) return '❄️';
  if (code<=82) return '🌦️';
  if (code<=99) return '⛈️';
  return '🌤️';
}
function refreshWeather() {
  var locEl = document.getElementById('weather-loc');
  var tempEl = document.getElementById('weather-temp');
  if (!locEl||!tempEl) return;
  if (!navigator.geolocation) { locEl.textContent='不支持定位'; return; }
  navigator.geolocation.getCurrentPosition(function(pos){
    var lat=pos.coords.latitude, lng=pos.coords.longitude;
    fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lng+'&current_weather=true&timezone=auto')
      .then(function(r){return r.json()})
      .then(function(d){
        if (d.current_weather) {
          tempEl.textContent=Math.round(d.current_weather.temperature)+'°';
        }
      }).catch(function(){});
    fetch('https://nominatim.openstreetmap.org/reverse?lat='+lat+'&lon='+lng+'&format=json&accept-language=zh&zoom=10')
      .then(function(r){return r.json()})
      .then(function(d){
        if (d&&d.address) {
          var a=d.address;
          locEl.textContent=(a.city||a.town||a.village||a.county||a.state_district||'当前位置');
        } else locEl.textContent='当前位置';
      }).catch(function(){locEl.textContent='当前位置'});
  }, function(){ locEl.textContent='定位失败'; });
}
refreshWeather();
var ww=document.getElementById('weather-widget');
if(ww) ww.addEventListener('click',function(){ refreshWeather(); });

var searchInput = document.getElementById('global-search-input');
var searchPanel = document.getElementById('search-autocomplete-panel');
if (searchInput && searchPanel) {
  searchInput.addEventListener('input', function() {
    var q = this.value.trim().toLowerCase();
    searchPanel.innerHTML = '';
    if (!q) { searchPanel.classList.remove('show'); return; }
    var matched = searchCatalog.filter(function(item) {
      return item.key.indexOf(q) >= 0 || item.title.indexOf(q) >= 0;
    });
    if (matched.length === 0) {
      searchPanel.innerHTML = '<div class="search-empty">没有搜索到相关的记录...</div>';
    } else {
      matched.forEach(function(item) {
        var div = document.createElement('div');
        div.className = 'search-item';
        div.innerHTML = '<span>' + item.title + '</span><span class="search-badge">打开</span>';

        searchPanel.appendChild(div);

    searchPanel.classList.add('show');
  });

    if (e.target !== searchInput && !searchPanel.contains(e.target) && e.target !== searchToggle) {
      searchPanel.classList.remove('show');
    }
  });
}

function selectFinanceType(type) {
  finType = type;
  document.getElementById('ft-expense').className = 'finance-type-btn' + (type==='支出' ? ' active' : '');
  document.getElementById('ft-income').className = 'finance-type-btn' + (type==='收入' ? ' active' : '');
}

function selectFinanceCat(cat) {
  finCat = cat;
  document.querySelectorAll('#fin-cat-grid .finance-cat-btn').forEach(function(b){
    b.classList.toggle('active', b.textContent.trim().includes(cat));
  });
}

function saveFinance() {
  var amount = document.getElementById('fin-amount');
  var note = document.getElementById('fin-note');
  var val = parseFloat(amount.value);
  if (!val || val <= 0) { amount.focus(); return; }
  var now = new Date();
  var iso = now.toISOString().slice(0,10);
  var timeStr = (now.getMonth()+1)+'月'+now.getDate()+'日 '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  if (!db.financeLogs) db.financeLogs = [];
  db.financeLogs.unshift({
    id: 'fin_'+Date.now(),
    type: finType,
    amount: val,
    category: finCat,
    note: note ? note.value.trim() : '',
    date: iso,
    timeStr: timeStr
  });
  saveDatabase();
  closeModal();
  renderTraces();
  triggerToast('已记一笔 ' + finType + ' ¥' + val.toFixed(2));
}

function refreshFortune() {
  if (typeof Lunar==='undefined') { document.getElementById('fortune-text').textContent='——'; return; }
  try {
    var lunar=Lunar.fromDate(new Date());
    var ganzhiDay=lunar.getDayInGanZhi();
    var zhi=lunar.getDayZhi();
    var yiList=lunar.getDayYi();
    var jiList=lunar.getDayJi();
    var poem=GANZHI_POEMS[ganzhiDay]||'日升月落平常心。今日宜静不宜躁。';
    var color=ZHI_COLORS[zhi]||{hex:'#B8860B',cls:'dot-darkgold',name:'暗金'};
    document.getElementById('fortune-text').innerHTML = poem;
    var fcd=document.getElementById('fortune-color-dot');
    if(fcd) fcd.className='lucky-dot '+color.cls;
    document.getElementById('fortune-color-name').textContent=color.name;
    document.getElementById('fortune-suit').textContent=yiList?yiList.slice(0,4).join('、')||'诸事皆宜':'诸事皆宜';
    document.getElementById('fortune-avoid').textContent=jiList?jiList.slice(0,4).join('、')||'无所禁忌':'无所禁忌';
  } catch(e){ document.getElementById('fortune-text').textContent='——'; }
}
refreshFortune();


// ═══════ 今天的痕迹 ═══════

function getTodayMD() {
  var d = new Date();
  return String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function renderTraces() {
  var container = document.getElementById('trace-container');
  if (!container) return;
  var todayMD = getTodayMD();
  var traces = [];

  (db.timelinePosts||[]).forEach(function(p) {
    if (!p.date) return;
    var m = p.date.match(/(\d+)月(\d+)日/);
    if (!m) return;
    var md = String(m[1]).padStart(2,'0')+'-'+String(m[2]).padStart(2,'0');
    if (md === todayMD) traces.push({ time: m[1]+'月'+m[2]+'日', type: '🌤 记录一刻', text: p.content, url: '../page-records/timeline/' });
  });
  (db.dietLogs||[]).forEach(function(p) {
    if (!p.date) return;
    var dd = p.date.slice(5);
    if (dd === todayMD) traces.push({ time: p.date.slice(5), type: '🍜 饮食', text: (p.items||[]).map(function(i){return i.name;}).join('、')||'记录了一顿饭', url: '../page-records/calories/' });
  });
  (db.diaries||[]).forEach(function(p) {
    if (!p.date) return;
    var m = p.date.match(/(\d+)月(\d+)日/);
    if (m) {
      var md = String(m[1]).padStart(2,'0')+'-'+String(m[2]).padStart(2,'0');
      if (md === todayMD) traces.push({ time: m[1]+'月'+m[2]+'日', type: '📖 日记', text: p.title||'写了一段日记', url: '../page-records/diary/' });
    } else {
      var dd = p.date.slice(5,10);
      if (dd === todayMD) traces.push({ time: p.date.slice(5), type: '📖 日记', text: p.title||'写了一段日记', url: '../page-records/diary/' });
    }
  });
  (db.inspirations||[]).forEach(function(p) {
    if (!p.date) return;
    var dd = p.date.slice(5,10);
    if (dd === todayMD) traces.push({ time: dd, type: '💡 灵感', text: p.title||'收藏了一条灵感', url: '../page-records/inspiration/' });
  });
  (db.financeLogs||[]).forEach(function(p) {
    if (!p.date) return;
    var dd = p.date.slice(5);
    if (dd === todayMD) traces.push({ time: p.timeStr||p.date, type: '¥ 记一笔', text: (p.note||p.category)+' ¥'+p.amount.toFixed(2), url: '#' });
  });
  traces.sort(function(a,b){ return a.time < b.time ? 1 : -1; });
  traces = traces.slice(0,3);

  if (traces.length === 0) {
    container.innerHTML =
      '<div class="trace-empty">' +
        '今天还是一张空白的纸。留下一句话、一张照片，或者一顿饭的味道。</div>';
    return;
  }

  var html = '<div class="trace-list">';
  traces.forEach(function(t) {
    html += '<div class="trace-item" onclick="window.location.href=\''+t.url+'\'"><span class="trace-time">'+escapeHtml(t.time)+'</span><div class="trace-body"><div class="trace-type">'+escapeHtml(t.type)+'</div><div class="trace-preview">'+escapeHtml(t.text)+'</div></div></div>';
  });
  html += '</div>';
  html += '<button class="trace-all" onclick="window.location.href=\'timeline.html\'">查看今天的全部记录 →</button>';
  container.innerHTML = html;
}
