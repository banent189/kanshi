<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>简纸 — password-manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+SC:wght@300;400;600;700&family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="../shared.js"></script>
<style>

body.page-password-manager{ margin:0; background:#0F0F0E; font-family:'Noto Serif SC','Outfit',sans-serif; -webkit-tap-highlight-color:transparent; }
.page-password-manager .app-viewport{ max-width:480px; margin:0 auto; background:#F5F4F0; min-height:100vh; display:flex; flex-direction:column; }
.page-password-manager .no-scrollbar::-webkit-scrollbar{ display:none; }
.page-password-manager .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }

/* Header */
.page-password-manager .header-bar{ height:56px; border-bottom:1px solid #EAE7E1; padding:0 16px; display:flex; align-items:center; justify-content:space-between; background:#F5F4F0; }
.page-password-manager .back-btn{ background:none; border:none; padding:8px; color:#2C2B29; cursor:pointer; }
.page-password-manager .header-title{ font-size:14px; font-weight:700; color:#2C2B29; }
.page-password-manager .add-btn-circle{ width:32px; height:32px; border-radius:999px; background:#405140; color:#FBFBFA; border:none; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; text-decoration:none; }
.page-password-manager .header-spacer{ width:32px; }

/* List area */
.page-password-manager .list-area{ flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; padding-bottom:96px; }
.page-password-manager .empty-state{ text-align:center; padding:48px; color:#A1A1AA; font-size:14px; }

/* Cards */
.page-password-manager .card{ padding:20px; background:#FBFBFA; border:1px solid #EAE7E1; border-radius:20px; box-shadow:0 4px 10px rgba(28,27,26,0.08); transition:all 0.3s cubic-bezier(0.16,1,0.3,1); }
.page-password-manager .card:active{ transform:scale(0.98); background:#F5F4F0; }
.page-password-manager .row{ display:flex; justify-content:space-between; align-items:baseline; }
.page-password-manager .row-center{ display:flex; align-items:center; gap:12px; }
.page-password-manager .row-gap{ display:flex; align-items:center; gap:12px; flex:1; cursor:pointer; }

/* Text */
.page-password-manager .text-title{ font-size:12px; font-weight:700; color:#2C2B29; }
.page-password-manager .text-body{ font-size:12px; color:#5C5854; line-height:1.6; margin-top:8px; }
.page-password-manager .text-meta{ font-size:9px; color:#A1A1AA; }
.page-password-manager .text-author{ font-size:9px; color:#A6977F; font-weight:400; }
.page-password-manager .text-score{ font-size:12px; color:#D97706; }
.page-password-manager .text-hint{ font-size:10px; color:#5C5854; }
.page-password-manager .text-subtle{ font-size:10px; color:#A1A1AA; }

/* Card footer */
.page-password-manager .card-foot{ text-align:right; border-top:1px solid #F5F4F0; padding-top:10px; margin-top:10px; }
.page-password-manager .del-btn{ background:none; border:none; font-size:10px; color:#BE123C; cursor:pointer; font-family:inherit; }

/* Modal */
.page-password-manager .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px; }
.page-password-manager .modal-overlay.hidden{ display:none; }
.page-password-manager .modal-content{ background:#F5F4F0; border:1px solid #DDD9CF; width:100%; max-width:360px; border-radius:24px; padding:24px; }
.page-password-manager .modal-head{ display:flex; justify-content:space-between; padding-bottom:8px; border-bottom:1px solid #EAE7E1; margin-bottom:16px; }
.page-password-manager .modal-title{ font-size:14px; font-weight:700; color:#2C2B29; }
.page-password-manager .modal-close{ background:none; border:none; color:#5C5854; font-size:16px; cursor:pointer; }

/* Form */
.page-password-manager .input-text{ width:100%; height:40px; padding:0 12px; font-size:12px; border:1px solid #EAE7E1; border-radius:8px; margin-bottom:12px; box-sizing:border-box; }
.page-password-manager .input-text-last{ width:100%; height:40px; padding:0 12px; font-size:12px; border:1px solid #EAE7E1; border-radius:8px; margin-bottom:16px; box-sizing:border-box; }
.page-password-manager .textarea-field{ width:100%; min-height:96px; padding:12px; font-size:12px; border:1px solid #EAE7E1; border-radius:8px; outline:none; font-family:inherit; box-sizing:border-box; margin-bottom:16px; }
.page-password-manager .textarea-field-lg{ width:100%; min-height:144px; padding:12px; font-size:12px; border:1px solid #EAE7E1; border-radius:8px; outline:none; font-family:inherit; box-sizing:border-box; margin-bottom:16px; }
.page-password-manager .select-field{ width:100%; height:36px; font-size:12px; border:1px solid #EAE7E1; border-radius:8px; margin-bottom:12px; }

/* Buttons */
.page-password-manager .btn-primary{ width:100%; height:44px; background:#405140; color:#FBFBFA; border:none; border-radius:12px; font-size:12px; font-weight:700; cursor:pointer; }
.page-password-manager .btn-teal{ width:100%; height:44px; background:#065F46; color:#FBFBFA; border:none; border-radius:12px; font-size:12px; font-weight:700; cursor:pointer; }
.page-password-manager .btn-purple{ width:100%; height:44px; background:#4C1D95; color:#FBFBFA; border:none; border-radius:12px; font-size:12px; font-weight:700; cursor:pointer; }

/* Habits */
.page-password-manager .habit-icon{ width:40px; height:40px; border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:16px; background:#F5F4F0; color:#A1A1AA; flex-shrink:0; }
.page-password-manager .habit-icon.done{ background:#D1FAE5; color:#065F46; }
.page-password-manager .check-btn{ background:#E3E8E3; border:none; border-radius:8px; padding:6px 12px; font-size:11px; cursor:pointer; font-family:inherit; font-weight:600; color:#405140; }

/* PWD */
.page-password-manager .pwd-card{ padding:20px; background:#FBFBFA; border:1px solid #EAE7E1; border-radius:20px; box-shadow:0 4px 10px rgba(28,27,26,0.08); transition:all 0.3s cubic-bezier(0.16,1,0.3,1); position:relative; overflow:hidden; display:flex; justify-content:space-between; }
.page-password-manager .pwd-card:active{ transform:scale(0.98); background:#F5F4F0; }
.page-password-manager .card:active{ transform:scale(0.98); background:#F5F4F0; }
.page-password-manager .pwd-bar{ position:absolute; left:0; top:0; bottom:0; width:4px; background:#FBBF24; }
.page-password-manager .pwd-detail{ font-size:10px; color:#5C5854; margin-top:2px; }
.page-password-manager .pwd-actions{ display:flex; gap:8px; align-items:flex-start; }
.page-password-manager .pwd-view-btn{ padding:4px 10px; font-size:10px; background:#F5F4F0; border:none; border-radius:8px; cursor:pointer; }
.page-password-manager .pwd-del-btn{ padding:4px 10px; font-size:10px; background:#FFF1F2; color:#BE123C; border:none; border-radius:8px; cursor:pointer; }

/* Toast */
.page-password-manager .kanshi-toast{ position:fixed; top:24px; left:50%; transform:translateX(-50%); z-index:999; background:#1C1B1A; color:#FBBF24; border:1px solid #2C2B29; padding:8px 20px; border-radius:999px; font-size:12px; font-weight:700; box-shadow:0 8px 24px rgba(0,0,0,0.4); animation:toastIn 0.3s ease-out; }
@keyframes toastIn{ 0%{opacity:0;transform:translateX(-50%)translateY(-12px)} 100%{opacity:1;transform:translateX(-50%)translateY(0)} }
.page-password-manager .search-bar{ padding:12px 16px; }
.page-password-manager .search-bar input{ width:100%; height:36px; padding:0 12px; font-size:12px; border:1px solid #EAE7E1; border-radius:999px; outline:none; box-sizing:border-box; background:#FFF; }

	.page-password-manager .num{font-family:"Inter",Arial,sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
	</style></head>
<body class="page-password-manager"><div class="app-viewport">
  <div class="header-bar">
    <button onclick="history.back()" class="back-btn"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15.75 19.5L8.25 12l7.5-7.5"/></svg></button>
    <h3 class="header-title">密码抽屉 🔑</h3>
    <button onclick="openWriteModal()" class="add-btn-circle">+</button>
  </div>
  <div class="search-bar"><input type="text" id="pwd-search" oninput="render(this.value)" placeholder="搜索平台..."></div>
  <div class="list-area no-scrollbar" id="pwd-list"></div>
</div>
<div class="modal-overlay hidden" id="global-modal"><div class="modal-content" id="modal-content-area"></div></div>
<script>
loadDatabase();
function render(q) {
  var c = document.getElementById('pwd-list');
  if (!c) return;
  c.innerHTML = '';
  var f = db.passwords;
  if (q) f = f.filter(function(p){return p.app.toLowerCase().indexOf(q.toLowerCase())>=0;});
  if (f.length===0) { c.innerHTML='<div class="empty-state">没有密码</div>'; return; }
  f.forEach(function(p) {
    c.innerHTML += '<div class="pwd-card"><div class="pwd-bar"></div><div><h4 class="text-title">'+escapeHtml(p.app)+'</h4><p class="text-hint">账号: '+escapeHtml(p.username)+'</p><p class="pwd-detail" id="pwm-'+p.id+'">密文: *******</p></div>' +
      '<div class="pwd-actions"><button onclick="toggleView(\''+p.id+'\',\''+p.password+'\')" class="pwd-view-btn">查看</button>' +
      '<button onclick="del(\''+p.id+'\')" class="pwd-del-btn">删除</button></div></div>';
  });
}
function toggleView(id, val) {
  var el = document.getElementById('pwm-'+id);
  if (!el) return;
  el.textContent = el.textContent.indexOf('*******')>=0 ? '密文: '+val : '密文: *******';
}
function openWriteModal() {
  showModal('<div><div class="modal-head"><span class="modal-title">添加密码 🔑</span><button onclick="closeModal()" class="modal-close">✕</button></div>' +
    '<input id="p-app" placeholder="平台" class="input-text">' +
    '<input id="p-user" placeholder="账号" class="input-text">' +
    '<input id="p-pass" type="password" placeholder="密码" class="input-text-last">' +
    '<button onclick="submitP()" class="btn-primary" style="background:#27272A;color:#FBBF24">完成加密</button></div>');
}
function submitP() {
  var app=document.getElementById('p-app'), user=document.getElementById('p-user'), pass=document.getElementById('p-pass');
  if (!app||!app.value.trim()||!pass||!pass.value.trim()) return;
  db.passwords.push({id:'pwd_'+Date.now(), app:app.value.trim(), username:user?user.value.trim():'', password:pass.value.trim()});
  saveDatabase(); closeModal(); render('');
}
function del(id) { db.passwords=db.passwords.filter(function(p){return p.id!==id;}); saveDatabase(); render(''); }
render('');
</script></body></html>
