<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>简纸 — 码上游 QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+SC:wght@300;400;600;700&family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="../shared.js"></script>
<script src="../lib/qrcode.min.js"></script>
<style>
body.page-qrcode{ margin:0; background:#0F0F0E; font-family:'Noto Serif SC','Outfit',sans-serif; }
.page-qrcode .app-viewport{ max-width:480px; margin:0 auto; background:#F5F4F0; min-height:100vh; display:flex; flex-direction:column; }
.page-qrcode .header-bar{ height:56px; border-bottom:1px solid #EAE7E1; padding:0 16px; display:flex; align-items:center; justify-content:space-between; background:#F5F4F0; }
.page-qrcode .content{ flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:24px; padding-bottom:96px; }
.page-qrcode .card{ padding:20px; background:#FBFBFA; border:1px solid #EAE7E1; border-radius:20px; ;box-shadow:0 4px 10px rgba(28,27,26,0.08);transition:all 0.3s cubic-bezier(0.16,1,0.3,1)}
.page-qrcode .card:active{ transform:scale(0.98); background:#F5F4F0; }
.page-qrcode .tab-btn{ padding:6px; font-size:12px; border-radius:8px; border:1px solid #EAE7E1; cursor:pointer; text-align:center; font-family:inherit; }
.page-qrcode .tab-btn.active{ background:#ECFDF5; color:#065F46; border-color:#10B981; }

.page-qrcode .back-btn{background:none;border:none;padding:8px;color:#2C2B29;cursor:pointer}
.page-qrcode .header-title{font-size:14px;font-weight:700}
.page-qrcode .qr-badge{font-size:9px;background:#D1FAE5;color:#065F46;padding:4px 8px;border-radius:4px}
.page-qrcode .flex-col{display:flex;flex-direction:column;gap:16px}
.page-qrcode .tab-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.page-qrcode .text-hint{font-size:10px;color:#5C5854}
.page-qrcode .qr-input{width:100%;height:40px;padding:0 12px;font-size:12px;border:1px solid #EAE7E1;border-radius:12px;outline:none;margin-top:8px;box-sizing:border-box}
.page-qrcode .submit-btn-teal{width:100%;height:44px;background:#065F46;color:#FBFBFA;border:none;border-radius:12px;font-size:12px;font-weight:700;cursor:pointer}
.page-qrcode .flex-col-center{display:flex;flex-direction:column;align-items:center;gap:16px}
.page-qrcode .qr-display-box{padding:12px;border:1px solid #EAE7E1;border-radius:16px;background:#FBFBFA}
.page-qrcode .x_is10{font-size:9px;color:#5C5854}

.page-qrcode .text-hint{font-size:10px;color:#5C5854}

.page-qrcode .qr-input{width:100%;height:40px;padding:0 12px;font-size:12px;border:1px solid #EAE7E1;border-radius:12px;outline:none;margin-top:8px;box-sizing:border-box}
.page-qrcode .text-hint{font-size:10px;color:#5C5854}
.page-qrcode .file-input{width:100%;margin-top:8px;font-size:12px}
.page-qrcode .qr-label{font-size:10px;color:#5C5854}
.page-qrcode .gen-btn{width:100%;height:44px;background:#065F46;color:#FFF;border:none;border-radius:12px;font-size:12px;font-weight:700;cursor:pointer}

	.page-qrcode .num{font-family:"Inter",Arial,sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
	</style>
</head>
<body class="page-qrcode">
<div class="app-viewport">
  <div class="header-bar">
    <button onclick="history.back()" class="back-btn"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15.75 19.5L8.25 12l7.5-7.5"/></svg></button>
    <h3 class="header-title">码上游 QR</h3>
    <span class="qr-badge">分发</span>
  </div>
  <div class="content no-scrollbar">
    <div class="card flex-col">
      <div class="tab-grid3">
        <button class="tab-btn active" id="qr-tab-link" onclick="setType('link')">🔗 网址</button>
        <button class="tab-btn" id="qr-tab-image" onclick="setType('image')">📸 图片</button>
        <button class="tab-btn" id="qr-tab-doc" onclick="setType('doc')">📁 文档</button>
      </div>
      <div id="qr-input-container">
        <label class="qr-label">输入网址</label>
        <input type="text" id="qrcode-source-text" placeholder="https://..." class="qr-input">
      </div>
      <button onclick="genQR()" class="gen-btn">生成二维码</button>
    </div>
    <div class="card hidden flex-col-center" id="qr-result">
      <div id="qr-display" class="qr-display-box"></div>
      <span class="text-hint">纯浏览器本地解析</span>
    </div>
  </div>
</div>
<script>
var activeType = 'link';
document.getElementById('qr-result').classList.add('hidden');
function setType(t) {
  activeType = t;
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.className='tab-btn'; });
  document.getElementById('qr-tab-'+t).className='tab-btn active';
  var c = document.getElementById('qr-input-container');
  if (t==='link') c.innerHTML = '<label class="qr-label">输入网址</label><input type="text" id="qrcode-source-text" placeholder="https://..." class="qr-input">';
  else c.innerHTML = '<label class="qr-label">'+{image:'📸 选择图片',doc:'📁 上传文档'}[t]+'</label><input type="file" class="file-input">';
}
function genQR() {
  var r = document.getElementById('qr-result'); r.classList.remove('hidden');
  var d = document.getElementById('qr-display'); d.innerHTML = '';
  var v = 'Kanshi 离线分发';
  var inp = document.getElementById('qrcode-source-text');
  if (inp) v = inp.value.trim() || v;
  if (typeof QRCode !== 'undefined') new QRCode(d, {text:v, width:140, height:140, colorDark:'#23211F', colorLight:'#FFFFFF', correctLevel:QRCode.CorrectLevel.H});
}
</script>
</body>
</html>
