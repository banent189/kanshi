<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>简纸 — 旅行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+SC:wght@300;400;600;700&family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="../shared.js"></script>
<style>
body.page-travel{ margin:0; background:#0F0F0E; font-family:'Noto Serif SC','Outfit',sans-serif; -webkit-tap-highlight-color:transparent; }
.page-travel .app-viewport{ max-width:480px; margin:0 auto; background:#F5F4F0; min-height:100vh; display:flex; flex-direction:column; }
.page-travel .no-scrollbar::-webkit-scrollbar{ display:none; }
.page-travel .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }
.page-travel .header-bar{ height:56px; border-bottom:1px solid #EAE7E1; padding:0 16px; display:flex; align-items:center; justify-content:space-between; background:#F5F4F0; }
.page-travel .back-btn{ background:none; border:none; padding:8px; color:#2C2B29; cursor:pointer; }
.page-travel .header-title{ font-size:14px; font-weight:700; color:#2C2B29; }
.page-travel .header-spacer{ width:32px; }
.page-travel .list-area{ flex:1; overflow-y:auto; padding:32px 24px; display:flex; flex-direction:column; align-items:center; gap:20px; }
.page-travel .empty-icon{ width:48px; height:48px; color:#BFBBB0; }
.page-travel .empty-title{ font-size:16px; font-weight:600; color:#4A4D44; text-align:center; }
.page-travel .empty-desc{ font-size:13px; color:#92978D; text-align:center; line-height:1.6; max-width:260px; }
.page-travel .add-btn{ padding:12px 28px; border-radius:999px; background:#405140; color:#FBFBFA; border:none; font-size:13px; cursor:pointer; font-family:inherit; font-weight:600; min-height:44px; display:flex; align-items:center; justify-content:center; }
.page-travel .add-btn:active{ background:#354335; }
</style>
</head>
<body class="page-travel">
<div class="app-viewport">
  <div class="header-bar">
    <button onclick="history.back()" class="back-btn"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15.75 19.5L8.25 12l7.5-7.5"/></svg></button>
    <span class="header-title">旅行</span>
    <span class="header-spacer"></span>
  </div>
  <div class="list-area">
    <svg class="empty-icon" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="2 12 22 12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
    <div class="empty-title">还没有旅行记录</div>
    <div class="empty-desc">记录一次出发，也记录一路上的想法。</div>
    <button class="add-btn" onclick="showToast('旅行功能即将开放')">添加第一段旅程</button>
  </div>
</div>
</body>
</html>
