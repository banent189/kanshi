<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>简纸 — 手势锁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+SC:wght@300;400;600;700&family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="shared.js"></script>
<style>
body.page-lock{ margin:0; background:#0F0F0E; font-family:'Noto Serif SC','Outfit',sans-serif; }
.page-lock .app-viewport{ max-width:480px; margin:0 auto; background:linear-gradient(180deg,#1C1B1A 0%,#0F0F0E 100%); min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
.page-lock .lock-title{ font-size:14px;color:#A6977F;text-align:center;margin-bottom:48px;line-height:1.6 }
.page-lock .pad{ display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;margin-bottom:48px }
.page-lock .node{ width:64px;height:64px;border-radius:999px;border:2px solid #DDD9CF;background:#27272A;transition:all 0.2s;cursor:pointer }
.page-lock .node.selected{ border-color:#7E997E;background:#405140;transform:scale(1.1);box-shadow:0 0 16px rgba(126,153,126,0.3) }
.page-lock .kanshi-toast{ position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:999;background:#1C1B1A;color:#FBBF24;border:1px solid #2C2B29;padding:8px 20px;border-radius:999px;font-size:12px;font-weight:700;animation:fadeSlideIn 0.3s ease-out }
@keyframes fadeSlideIn{0%{opacity:0;transform:translateX(-50%)translateY(-12px)}100%{opacity:1;transform:translateX(-50%)translateY(0)}}

.page-password-lock .lock-icon{font-size:48px;margin-bottom:16px}

.page-password-lock .lock-icon{font-size:48px;margin-bottom:16px}
.page-password-lock .lock-reset-btn{background:none;border:1px solid #5C5854;color:#A6977F;padding:8px 24px;border-radius:999px;font-size:12px;cursor:pointer;font-family:inherit}

	.page-lock .num{font-family:"Inter",Arial,sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
	</style>
</head>
<body class="page-lock">
<div class="app-viewport">
  <div class="lock-title" id="lock-status">
    <div class="lock-icon">🔐</div>
    按任意顺序连接最少3个节点<br>作为手势 (默认: 123)
  </div>
  <div class="pad" id="touch-pad">
    <div class="node" data-node="1"></div><div class="node" data-node="2"></div><div class="node" data-node="3"></div>
    <div class="node" data-node="4"></div><div class="node" data-node="5"></div><div class="node" data-node="6"></div>
    <div class="node" data-node="7"></div><div class="node" data-node="8"></div><div class="node" data-node="9"></div>
  </div>
  <button onclick="resetLock()" class="lock-reset-btn">重置手势</button>
</div>
<script>
loadDatabase();
var drawing = false, path = [];
var pad = document.getElementById('touch-pad');
function start(e) {
  drawing = true; path = [];
  document.querySelectorAll('.node').forEach(function(n){n.classList.remove('selected');});
  move(e);
}
function move(e) {
  if (!drawing) return;
  var cx = e.touches ? e.touches[0].clientX : e.clientX;
  var cy = e.touches ? e.touches[0].clientY : e.clientY;
  var t = document.elementFromPoint(cx, cy);
  if (t && t.classList.contains('node')) {
    var n = t.getAttribute('data-node');
    if (n && path.indexOf(n) < 0) { path.push(n); t.classList.add('selected'); }
  }
}
function end() {
  if (!drawing) return;
  drawing = false;
  var s = path.join('');
  if (s === (db.gestureLock || '123')) {
    triggerToast('解锁成功');
    setTimeout(function(){ window.location.href = 'password-manager.html'; }, 600);
  } else {
    var el = document.getElementById('lock-status');
    if (el) el.innerHTML = '<div class="lock-icon">❌</div>手势不匹配，请重试';
    setTimeout(function() {
      if(el) el.innerHTML = '<div class="lock-icon">🔐</div>按任意顺序连接最少3个节点<br>作为手势 (默认: 123)';
      document.querySelectorAll('.node').forEach(function(n){n.classList.remove('selected');});
    }, 1000);
  }
}
pad.addEventListener('mousedown', start);
pad.addEventListener('mousemove', move);
window.addEventListener('mouseup', end);
pad.addEventListener('touchstart', start);
pad.addEventListener('touchmove', move);
window.addEventListener('touchend', end);

function resetLock() {
  var p = prompt('输入全新数字手势串 (如 1235789):', '123');
  if (p && p.length >= 3) { db.gestureLock = p; saveDatabase(); alert('手势已更改为: '+p); }
}
</script>
</body>
</html>
