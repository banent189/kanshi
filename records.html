<style>
body.page-records{ margin:0; background:#0F0F0E; font-family:'Noto Serif SC','Outfit',sans-serif; -webkit-tap-highlight-color:transparent; }
.page-records .app-viewport{ max-width:480px; margin:0 auto; background:#F5F4F0; min-height:100vh; display:flex; flex-direction:column; }
.page-records .header-bar{ height:56px; border-bottom:1px solid #EAE7E1; padding:0 16px; display:flex; align-items:center; background:#F5F4F0; }
.page-records .list-area{ flex:1; overflow-y:auto; padding:16px 16px 96px; display:flex; flex-direction:column; gap:8px; }
.page-records .rec-card{ padding:20px; background:#FBFBFA; border:1px solid #EAE7E1; border-radius:20px; display:flex; align-items:center; gap:12px; cursor:pointer; ;box-shadow:0 4px 10px rgba(28,27,26,0.08);transition:all 0.3s cubic-bezier(0.16,1,0.3,1)}
.page-records .rec-card:active{ transform:scale(0.98); }
.page-records .nav-bar{ position:fixed; bottom:12px; left:50%; transform:translateX(-50%); width:calc(100% - 40px); max-width:430px; height:64px; background:rgba(251,251,250,0.9); backdrop-filter:blur(12px); border:1px solid #EAE7E1; border-radius:24px; display:flex; align-items:center; justify-content:space-around; padding:0 12px; z-index:40; box-shadow:0 4px 20px rgba(0,0,0,0.1); }
.page-records .nav-btn{ display:flex; flex-direction:column; align-items:center; justify-content:center; width:48px; height:48px; border-radius:16px; background:transparent; border:none; cursor:pointer; padding:0; }
.page-records .nav-btn-inner{ width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:12px; }
.page-records .nav-active-pill{ background:#E3E8E3; }
.page-records .nav-icon{ width:20px; height:20px; }
.page-records .nav-label{ font-size:8px; font-weight:700; margin-top:2px; }

.page-records .back-btn{background:none;border:none;padding:8px;color:#2C2B29;cursor:pointer}
.page-records .records-title{font-size:14px;font-weight:700;margin:0 auto}
.page-records .header-spacer{width:32px}
.page-records .no-link{text-decoration:none;color:inherit}
.page-records .icon-lg{font-size:24px}
.page-records .text-title{font-size:12px;font-weight:700;color:#2C2B29}
.page-records .text-hint{font-size:10px;color:#5C5854}

	.page-records .num{font-family:"Inter",Arial,sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
	</style>
</head>
