<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>简纸 — 记录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+SC:wght@300;400;600;700&family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="shared.js"></script>
<style>
/* ═══ 变量 ═══ */
.record-page-shell{
  --page-bg:#F5F4F0;
  --ink-deep:#30332D;
  --ink-title:#30342D;
  --ink-body:#555A51;
  --ink-mid:#7F847A;
  --ink-soft:#9EA299;
  --ink-faint:#B0B4AB;
  --ink-date:#92978D;
  --green:#73846C;
  --green-light:#A3B19C;
  --card-warm:#FCFBF8;
  --card-green:#F1F4EE;
  --card-cream:#F8F6F0;
  --card-habit:#F1F4EE;
  --shadow:0 6px 18px rgba(48,54,45,0.035);
  --safe-bottom:calc(72px + env(safe-area-inset-bottom,0) + 52px);
  --records-bg:#F6F4EE;
  --records-surface:#FFFDF8;
  --records-text:#30342F;
  --records-muted:#858B82;
  --records-line:#E6E3DA;
  --records-accent:#4E5D49;
  --records-accent-soft:#E9EDE5;
}

body.page-records{ margin:0; background:#0F0F0E; font-family:'Noto Serif SC','Outfit',sans-serif; -webkit-tap-highlight-color:transparent; }
.record-page-shell{ max-width:480px; margin:0 auto; background:var(--page-bg); color:var(--ink-deep); min-height:100vh; overflow-x:hidden; box-shadow:0 0 50px rgba(0,0,0,0.6); }
.record-page-shell .record-page{ padding:0 0 var(--safe-bottom); box-sizing:border-box; }
.record-page-shell .no-scrollbar::-webkit-scrollbar{ display:none; }
.record-page-shell .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }

/* ═══ Header ═══ */
.record-page-shell .record-header{
  position:sticky; top:0; z-index:30;
  display:grid; grid-template-columns:78px minmax(0,1fr) 78px; align-items:center;
  min-height:56px; padding:env(safe-area-inset-top,0) 16px 0;
  background:rgba(245,244,240,0.94); border-bottom:1px solid rgba(82,90,77,0.07);
  backdrop-filter:blur(14px);
}
.record-page-shell .record-header__side{ display:flex; align-items:center; gap:10px; }
.record-page-shell .record-header__side--right{ justify-content:flex-end; }
.record-page-shell .record-header__title{ font-size:22px; font-weight:500; letter-spacing:0.08em; margin:0; text-align:center; font-family:'Noto Serif SC','Songti SC',serif; color:var(--ink-title); }
.record-page-shell .hdr-btn{ background:none; border:none; width:44px; height:44px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft); border-radius:8px; flex-shrink:0; }
.record-page-shell .hdr-btn:active{ background:rgba(82,90,77,0.06); }
.record-page-shell .hdr-btn svg{ width:22px; height:22px; stroke-width:1.5; }
.record-page-shell .hdr-text-btn{ background:none; border:none; height:44px; padding:0 8px; font-size:14px; color:var(--green); cursor:pointer; font-family:inherit; font-weight:500; border-radius:8px; white-space:nowrap; word-break:keep-all; flex-shrink:0; }
.record-page-shell .hdr-text-btn:active{ background:rgba(82,90,77,0.06); }

/* ═══ 滚动区域 ═══ */
.record-page-shell .record-scroll{ padding:18px 16px 0; }

/* ═══ 今日动态 ═══ */
.record-page-shell .featured-card{ display:grid; grid-template-columns:52% 48%; min-height:138px; max-height:148px; overflow:hidden; border-radius:20px; border:1px solid rgba(82,90,77,0.07); background:var(--card-warm); box-shadow:var(--shadow); margin-bottom:14px; cursor:pointer; transition:transform 180ms ease; text-decoration:none; color:inherit; }
.record-page-shell .featured-card:active{ transform:scale(0.992); }
.record-page-shell .featured-img-wrap{ min-height:138px; background:#eae8e0; overflow:hidden; position:relative; }
.record-page-shell .featured-img{ width:100%; height:100%; object-fit:cover; position:absolute; inset:0; }
.record-page-shell .featured-img-placeholder{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#eae8e0,#ddd9d0); position:absolute; inset:0; }
.record-page-shell .featured-img-placeholder svg{ width:34px; height:34px; color:#bbb8ac; opacity:0.5; }
.record-page-shell .featured-body{ padding:18px 18px 16px; display:flex; flex-direction:column; justify-content:space-between; min-width:0; }
.record-page-shell .featured-label{ font-size:12px; color:var(--green); letter-spacing:0.08em; font-weight:500; }
.record-page-shell .featured-text{ font-size:15px; color:#41463E; line-height:1.55; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin:8px 0 4px; font-family:'Noto Serif SC',serif; }
.record-page-shell .featured-date{ font-size:11px; color:var(--ink-date); }
.record-page-shell .featured-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:4px; }
.record-page-shell .featured-enter{ font-size:12px; color:var(--green); font-weight:500; opacity:0.7; }

/* ═══ Mosaic ═══ */
.record-page-shell .record-mosaic{
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
  grid-template-areas:"diet inspiration" "accounting inspiration" "habits habits" "book travel";
  gap:12px;
}
.record-page-shell .record-mosaic:last-child{ margin-bottom:24px; }

/* ═══ Module Base ═══ */
.record-page-shell .record-module{
  position:relative; min-width:0; overflow:hidden; border-radius:20px; box-shadow:var(--shadow);
  transition:transform 180ms ease; padding:18px; display:flex; flex-direction:column;
  cursor:pointer; text-decoration:none; color:inherit;
}
.record-page-shell .record-module:active{ transform:scale(0.992); }
.record-page-shell .record-module[hidden]{ display:none; }

.record-page-shell .record-module--diet{ grid-area:diet; background:var(--card-green); border-color:transparent; border-style:solid; border-width:1px; min-height:180px; }
.record-page-shell .record-module--accounting{ grid-area:accounting; background:var(--card-warm); border:1px solid rgba(82,90,77,0.07); min-height:142px; }
.record-page-shell .record-module--inspiration{ grid-area:inspiration; background:var(--card-cream); border-color:transparent; border-style:solid; border-width:1px; min-height:334px; display:flex; flex-direction:column; }
.record-page-shell .record-module--habits{ grid-area:habits; background:var(--card-habit); border-color:transparent; border-style:solid; border-width:1px; min-height:148px; }
.record-page-shell .record-module--book{ grid-area:book; background:var(--card-warm); border:1px solid rgba(82,90,77,0.07); min-height:150px; }
.record-page-shell .record-module--travel{ grid-area:travel; background:var(--card-warm); border:1px solid rgba(82,90,77,0.07); min-height:150px; }

.record-page-shell .mod-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:0; }
.record-page-shell .mod-title-row{ display:flex; align-items:center; gap:5px; }
.record-page-shell .mod-icon{ width:18px; height:18px; color:var(--green); flex-shrink:0; display:block; }
.record-page-shell .mod-title{ font-size:16px; font-weight:500; color:var(--ink-title); letter-spacing:0.03em; font-family:'Noto Serif SC','Songti SC',serif; }
.record-page-shell .mod-body{ flex:1; display:flex; flex-direction:column; min-height:0; }

/* ＋ 无外圈 */
.record-page-shell .record-add-button{ width:44px; height:44px; display:grid; place-items:center; padding:0; border:0; background:transparent; color:rgba(115,132,108,0.76); cursor:pointer; flex-shrink:0; }
.record-page-shell .record-add-button__visual{ width:28px; height:28px; display:grid; place-items:center; border:0; border-radius:10px; background:transparent; font-size:19px; font-weight:300; line-height:1; }
.record-page-shell .record-add-button:active .record-add-button__visual{ background:rgba(115,132,108,0.10); transform:scale(0.94); }

/* ═══ 饮食 ═══ */
.record-page-shell .diet-meals{ margin-top:12px; }
.record-page-shell .diet-meal{ display:grid; grid-template-columns:38px minmax(0,1fr) 10px; align-items:center; gap:7px; min-height:28px; font-size:13px; color:var(--ink-body); }
.record-page-shell .diet-meal-label{ font-size:13px; color:var(--ink-mid); }
.record-page-shell .diet-meal-food{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; color:var(--ink-soft); }
.record-page-shell .diet-meal-food.tbd{ color:#A0A49B; }
.record-page-shell .diet-meal-dot{ width:7px; height:7px; border-radius:999px; border:1.5px solid rgba(115,132,108,0.48); background:transparent; flex-shrink:0; justify-self:end; }
.record-page-shell .diet-meal-dot.done{ background:var(--green); border-color:var(--green); }
.record-page-shell .diet-empty-hint{ font-size:11px; color:#969B91; text-align:center; margin-top:8px; }
.record-page-shell .diet-footer{ margin-top:8px; padding:5px 10px; border-radius:12px; background:rgba(115,132,108,0.10); display:grid; grid-template-columns:1fr 1fr; font-size:12px; color:var(--ink-body); }
.record-page-shell .diet-footer .num{ font-family:'Inter',sans-serif; font-weight:600; color:var(--green); text-align:right; }

/* ═══ 记账 ═══ */
.record-page-shell .fin-items{ margin-top:2px; }
.record-page-shell .fin-item{ display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--ink-body); min-height:30px; border-bottom:1px solid rgba(82,90,77,0.055); }
.record-page-shell .fin-item:last-child{ border-bottom:none; }
.record-page-shell .fin-item-name{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.record-page-shell .fin-item-amt{ flex-shrink:0; font-family:'Inter',sans-serif; font-variant-numeric:tabular-nums; font-size:13px; }
.record-page-shell .fin-item-amt.neg{ color:#b07a70; }
.record-page-shell .fin-empty-primary{ font-size:13px; color:#858A80; margin-top:20px; }
.record-page-shell .fin-empty-hint{ font-size:11px; color:#A1A59C; margin-top:2px; }
.record-page-shell .fin-empty-lines{ margin-top:14px; }
.record-page-shell .fin-empty-lines span{ display:block; height:1px; margin-top:13px; background:rgba(82,90,77,0.055); }
.record-page-shell .fin-footer{ margin-top:auto; padding-top:6px; font-size:13px; color:var(--ink-body); display:flex; justify-content:space-between; align-items:center; }
.record-page-shell .fin-footer-amt{ font-family:'Inter',sans-serif; font-weight:600; color:var(--green); font-size:16px; }

/* ═══ 灵感 ═══ */
.record-page-shell .record-module--inspiration{ padding:18px 17px 17px; }
.record-page-shell .inspiration-quote-mark{ position:absolute; top:62px; left:17px; margin:0; font-size:50px; line-height:1; color:rgba(115,132,108,0.10); pointer-events:none; font-family:'Noto Serif SC',serif; user-select:none; }
.record-page-shell .inspiration-text{ display:-webkit-box; margin:51px 0 0; overflow:hidden; -webkit-box-orient:vertical; -webkit-line-clamp:7; font-size:14px; line-height:1.75; color:#4C5149; font-family:'Noto Serif SC',serif; position:relative; z-index:1; }
.record-page-shell .inspiration-date{ margin-top:auto; padding-top:12px; font-size:11px; color:var(--ink-date); }

/* ═══ 习惯 — 完整点阵表格 ═══ */
.record-page-shell .habit-aux{ font-size:11px; color:var(--ink-mid); margin-top:2px; }
.record-page-shell .habit-aux .num{ font-family:'Inter',sans-serif; }
.record-page-shell .habit-grid{ display:grid; grid-template-columns:56px repeat(7,minmax(0,1fr)); align-items:center; row-gap:10px; margin-top:12px; }
.record-page-shell .habit-grid__weekday{ text-align:center; font-size:10px; color:#979C92; }
.record-page-shell .habit-grid__name{ overflow:hidden; font-size:11px; color:#5D6259; text-overflow:ellipsis; white-space:nowrap; }
.record-page-shell .habit-grid .habit-dot{ width:7px; height:7px; justify-self:center; border:1.5px solid rgba(115,132,108,0.48); border-radius:50%; background:transparent; }
.record-page-shell .habit-grid .habit-dot.is-complete{ background:var(--green); border-color:var(--green); }
.record-page-shell .habit-empty{ font-size:12px; color:var(--ink-soft); text-align:center; padding-top:20px; }

/* ═══ 书评 ═══ */
.record-page-shell .book-layout{ display:flex; gap:12px; flex:1; align-items:center; }
.record-page-shell .book-cover-wrap{ width:46px; height:66px; border-radius:8px; background:#efede7; flex-shrink:0; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.record-page-shell .book-cover-wrap svg{ width:20px; height:20px; color:var(--ink-faint); }
.record-page-shell .book-info{ flex:1; min-width:0; }
.record-page-shell .book-title{ font-size:14px; font-weight:600; color:var(--ink-deep); }
.record-page-shell .book-author{ font-size:11px; color:var(--ink-soft); margin:2px 0 4px; }
.record-page-shell .book-review{ font-size:12px; color:var(--ink-body); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.55; }
.record-page-shell .book-score{ font-size:13px; color:#b69b50; margin-top:3px; }
.record-page-shell .book-empty{ font-size:13px; color:#858A80; }
.record-page-shell .book-empty-hint{ font-size:11px; color:#A1A59C; margin-top:2px; }

/* ═══ 旅行 ═══ */
.record-page-shell .travel-img-area{ height:66px; border-radius:11px; background:#EEF0E9; overflow:hidden; display:flex; align-items:center; justify-content:center; margin-bottom:8px; }
.record-page-shell .travel-img-area svg{ width:22px; height:22px; color:rgba(115,132,108,0.45); }
.record-page-shell .travel-name{ font-size:13px; font-weight:600; color:var(--ink-deep); }
.record-page-shell .travel-hint{ font-size:11px; color:var(--ink-soft); margin-top:2px; }

/* ═══ Bottom Nav ═══ */
.record-page-shell .nav-bar{ position:fixed; bottom:12px; left:50%; transform:translateX(-50%); width:calc(100% - 40px); max-width:430px; height:56px; background:rgba(251,251,250,0.92); backdrop-filter:blur(12px); border:1px solid #EAE7E1; border-radius:20px; display:flex; align-items:center; justify-content:space-around; padding:0 6px; z-index:40; box-shadow:0 4px 20px rgba(0,0,0,0.1); }
.record-page-shell .nav-btn{ display:flex; flex-direction:column; align-items:center; justify-content:center; width:44px; height:44px; border-radius:12px; background:transparent; border:none; cursor:pointer; padding:0; }
.record-page-shell .nav-btn-inner{ width:28px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:8px; }
.record-page-shell .nav-active-pill{ background:#E3E8E3; }
.record-page-shell .nav-icon{ width:18px; height:18px; }
.record-page-shell .nav-label{ font-size:7px; font-weight:600; margin-top:1px; }
.record-page-shell .text-sage-800{ color:#405140; }
.record-page-shell .text-ink-500{ color:#8B8B80; }

@media(prefers-reduced-motion:reduce){
  .record-page-shell .record-module,
  .record-page-shell .featured-card,
  .record-page-shell .record-add-button__visual{ transition:none; }
}

/* ═══ Responsive ═══ */
@media(max-width:350px){
  .record-page-shell .featured-card{ grid-template-columns:1fr; }
  .record-page-shell .featured-img-wrap{ min-height:80px; }
  .record-page-shell .featured-body{ padding:14px; }
  .record-page-shell .record-mosaic{
    grid-template-columns:1fr;
    grid-template-areas:"diet" "accounting" "inspiration" "habits" "book" "travel";
  }
  .record-page-shell .record-module--inspiration{ min-height:auto; }
}
</style>
</head>
<body class="page-records">
<div class="record-page-shell">
<div class="record-page">

  <!-- Header -->
  <header class="record-header">
    <div class="record-header__side"></div>
    <h1 class="record-header__title">记录</h1>
    <div class="record-header__side record-header__side--right">
      <button class="hdr-btn" onclick="showRecordSearch()" aria-label="搜索">
        <svg fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button class="hdr-text-btn" onclick="redirectTo('pages/record-arrange.html')">编排</button>
    </div>
  </header>

  <main class="record-scroll no-scrollbar" id="record-scroll">

    <!-- ═══ Featured: 今日动态 ═══ -->
    <a class="featured-card" href="timeline.html" id="featured-timeline">
      <div class="featured-img-wrap">
        <img class="featured-img" id="ft-img" src="" alt="今日动态图片" style="display:none" />
        <div class="featured-img-placeholder" id="ft-placeholder">
          <svg fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
      </div>
      <div class="featured-body">
        <span class="featured-label">今日动态</span>
        <span class="featured-text" id="ft-text">记录生活中的点滴瞬间</span>
        <span class="featured-date" id="ft-date"></span>
        <div class="featured-foot">
          <span class="featured-enter">查看全部</span>
          <span style="font-size:10px;color:var(--ink-soft)" id="ft-count"></span>
        </div>
      </div>
    </a>

    <!-- ═══ Mosaic ═══ -->
    <div class="record-mosaic" id="record-mosaic">

      <!-- 饮食与体重 -->
      <article class="record-module record-module--diet" data-record-type="diet" onclick="redirectTo('calories.html')">
        <div class="mod-head">
          <div class="mod-title-row">
            <svg class="mod-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 20c-3.3 0-6-2.7-6-6 0-3.3 6-10 6-10s6 6.7 6 10c0 3.3-2.7 6-6 6z"/><path d="M9 14c0 1.7 1.3 3 3 3"/></svg>
            <span class="mod-title">饮食与体重</span>
          </div>
          <button class="record-add-button" onclick="event.stopPropagation();redirectTo('calories.html')" aria-label="新增饮食记录"><span class="record-add-button__visual">＋</span></button>
        </div>
        <div class="mod-body" id="mod-diet-body"><!-- JS --></div>
      </article>

      <!-- 记账 -->
      <article class="record-module record-module--accounting" data-record-type="accounting" onclick="redirectTo('pages/accounting.html')">
        <div class="mod-head">
          <div class="mod-title-row">
            <svg class="mod-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="12" y1="7" x2="12" y2="17"/><path d="M8 9h2"/><path d="M14 15h2"/></svg>
            <span class="mod-title">记账</span>
          </div>
          <button class="record-add-button" onclick="event.stopPropagation();redirectTo('pages/accounting.html')" aria-label="新增记账"><span class="record-add-button__visual">＋</span></button>
        </div>
        <div class="mod-body" id="mod-fin-body"><!-- JS --></div>
      </article>

      <!-- 灵感 -->
      <article class="record-module record-module--inspiration" data-record-type="inspiration" onclick="redirectTo('inspiration.html')">
        <div class="mod-head">
          <div class="mod-title-row">
            <svg class="mod-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M9.66 17.25l-6.73 2.82 2.82-6.73L16.07 3a2.12 2.12 0 013 3L9.66 17.25z"/><path d="M15.07 6.93l2.12 2.12"/></svg>
            <span class="mod-title">灵感</span>
          </div>
          <button class="record-add-button" onclick="event.stopPropagation();redirectTo('inspiration-add.html')" aria-label="新增灵感"><span class="record-add-button__visual">＋</span></button>
        </div>
        <div class="inspiration-quote-mark">"</div>
        <div class="inspiration-text" id="mod-insp-body">想到什么，<br>就先把它放在这里。</div>
        <div class="inspiration-date" id="mod-insp-date"></div>
      </article>

      <!-- 习惯打卡 -->
      <article class="record-module record-module--habits" data-record-type="habit" onclick="redirectTo('habits.html')">
        <div class="mod-head">
          <div class="mod-title-row">
            <svg class="mod-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 01-10 10A10 10 0 1112 2a10 10 0 019.95 8.5"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            <span class="mod-title">习惯打卡</span>
          </div>
          <button class="record-add-button" onclick="event.stopPropagation();redirectTo('habits.html')" aria-label="新增习惯"><span class="record-add-button__visual">＋</span></button>
        </div>
        <div class="mod-body" id="mod-habit-body">
          <div class="habit-empty">还没有习惯</div>
        </div>
      </article>

      <!-- 书评 -->
      <article class="record-module record-module--book" data-record-type="book" onclick="redirectTo('books.html')">
        <div class="mod-head">
          <div class="mod-title-row">
            <svg class="mod-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 016.5 2H20v20H6.5a2.5 2.5 0 010-5H20"/><path d="M10 8h6M10 12h4"/></svg>
            <span class="mod-title">书评</span>
          </div>
          <button class="record-add-button" onclick="event.stopPropagation();redirectTo('books.html')" aria-label="新增书评"><span class="record-add-button__visual">＋</span></button>
        </div>
        <div class="mod-body" id="mod-book-body">
          <div class="book-empty">还没有书评</div>
          <div class="book-empty-hint">看完书，分享你的感受</div>
        </div>
      </article>

      <!-- 旅行 -->
      <article class="record-module record-module--travel" data-record-type="travel" onclick="redirectTo('pages/travel.html')">
        <div class="mod-head">
          <div class="mod-title-row">
            <svg class="mod-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="2 12 22 12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
            <span class="mod-title">旅行</span>
          </div>
        </div>
        <div class="mod-body" id="mod-travel-body">
          <div class="travel-img-area">
            <svg fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          </div>
          <div class="travel-name">还没有旅行记录</div>
          <div class="travel-hint">下一段旅程，也可以从这里开始</div>
        </div>
      </article>

    </div><!-- /record-mosaic -->
  </main>
</div><!-- /record-page -->

<!-- Bottom Nav -->
<nav class="nav-bar">
  <button class="nav-btn" onclick="redirectTo('index.html')"><div class="nav-btn-inner"><svg class="nav-icon text-ink-500" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h2M20 12h2M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/></svg></div><span class="nav-label text-ink-500">今天</span></button>
  <button class="nav-btn" onclick="redirectTo('todo.html')"><div class="nav-btn-inner"><svg class="nav-icon text-ink-500" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></div><span class="nav-label text-ink-500">待办</span></button>
  <button class="nav-btn" id="nav-records"><div class="nav-btn-inner nav-active-pill"><svg class="nav-icon text-sage-800" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 016.5 2H20v20H6.5a2.5 2.5 0 010-5H20"/><path d="M10 8h6M10 12h4"/></svg></div><span class="nav-label text-sage-800">记录</span></button>
  <button class="nav-btn" onclick="redirectTo('tools.html')"><div class="nav-btn-inner"><svg class="nav-icon text-ink-500" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg></div><span class="nav-label text-ink-500">工具</span></button>
  <button class="nav-btn" onclick="redirectTo('storage.html')"><div class="nav-btn-inner"><svg class="nav-icon text-ink-500" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 7l-9-5-9 5m18 0l-9 5m9-5v10l-9 5m0-15v14"/><path d="M3.97 12.08L12 17l8.03-4.92"/></svg></div><span class="nav-label text-ink-500">收纳盒</span></button>
</nav>

<script>
// ─── 保存滚动位置 ───
var recScroll=document.getElementById('record-scroll');
if(recScroll){var savedY=localStorage.getItem('KANSHI_RECORD_SCROLL');if(savedY)setTimeout(function(){recScroll.scrollTop=parseInt(savedY);},50);recScroll.addEventListener('scroll',function(){localStorage.setItem('KANSHI_RECORD_SCROLL',recScroll.scrollTop);});}

// ─── 记录搜索 ───
function showRecordSearch(){var q=prompt('搜索记录类型、标题或内容');if(!q||!q.trim())return;q=q.trim().toLowerCase();var found=[];var t=db.timelinePosts||[];t.forEach(function(p){if(p.content&&p.content.toLowerCase().indexOf(q)>=0||p.title&&p.title.toLowerCase().indexOf(q)>=0)found.push({type:'今日动态',title:p.title||p.content.slice(0,30),url:'timeline.html'});});var d=db.dietLogs||[];d.forEach(function(p){if(p.name&&p.name.toLowerCase().indexOf(q)>=0)found.push({type:'饮食',title:p.name,url:'calories.html'});});var f=db.financeLogs||[];f.forEach(function(p){if((p.note||p.category||'').toLowerCase().indexOf(q)>=0)found.push({type:'记账',title:p.note||p.category,url:'index.html'});});var i=db.inspirations||[];i.forEach(function(p){if((p.ref||p.title||'').toLowerCase().indexOf(q)>=0)found.push({type:'灵感',title:p.title||(p.ref||'').slice(0,30),url:'inspiration.html'});});var b=db.books||[];b.forEach(function(p){if((p.title||'').toLowerCase().indexOf(q)>=0||(p.author||'').toLowerCase().indexOf(q)>=0)found.push({type:'书评',title:p.title,url:'books.html'});});if(found.length===0){showToast('未找到"'+q+'"相关记录');return;}var msg='找到 '+found.length+' 条结果:\n';found.slice(0,8).forEach(function(r){msg+='\n【'+r.type+'】'+r.title;});msg+='\n\n点击确定前往第一条';showToast('找到 '+found.length+' 条记录');}

try{
  var posts=db.timelinePosts||[];
  var ftCount=document.getElementById('ft-count');
  if(ftCount)ftCount.textContent=posts.length+' 条记录';
  if(posts.length>0){
    var last=posts[posts.length-1];
    var ftImg=document.getElementById('ft-img'), ftPh=document.getElementById('ft-placeholder');
    var ftText=document.getElementById('ft-text'), ftDate=document.getElementById('ft-date');
    if(last.image){ftImg.src=last.image;ftImg.style.display='block';ftPh.style.display='none';}
    if(last.content){var txt=last.content.replace(/\n/g,' ');ftText.textContent=txt.length>80?txt.slice(0,80)+'…':txt;}
    else if(last.title){ftText.textContent=last.title;}
    if(last.date)ftDate.textContent=last.date;
  }
}catch(e){console.error('[记录]今日动态:',e);}

try{
  var logs=(db.dietLogs||[]);
  var today=new Date(); var todayStr=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  var todayDiet=logs.filter(function(l){return l.timestamp&&l.timestamp.slice(0,10)===todayStr;});
  var body=document.getElementById('mod-diet-body');
  if(!body)throw new Error('no diet body');
  var mealLabels=['早餐','午餐','晚餐','加餐'];
  var mealLbs=['breakfast','lunch','dinner','snack'];
  if(todayDiet.length>0){
    var totalCal=0; var h='<div class="diet-meals">';
    mealLabels.forEach(function(lb,i){
      var match=todayDiet.find(function(x){return x.type===mealLbs[i];});
      totalCal+=match?match.calories||0:0;
      if(match){h+='<div class="diet-meal"><span class="diet-meal-label">'+lb+'</span><span class="diet-meal-food">'+(match.name||'')+'</span><span class="diet-meal-dot done"></span></div>';}
      else{h+='<div class="diet-meal"><span class="diet-meal-label">'+lb+'</span><span class="diet-meal-food tbd">待记录</span><span class="diet-meal-dot"></span></div>';}
    });
    h+='</div><div class="diet-footer"><span>今日摄入</span><span class="num">'+totalCal+' kcal</span></div>';
    body.innerHTML=h;
  }else{
    var eh='<div class="diet-meals">';
    mealLabels.forEach(function(lb){eh+='<div class="diet-meal"><span class="diet-meal-label">'+lb+'</span><span class="diet-meal-food tbd">待记录</span><span class="diet-meal-dot"></span></div>';});
    eh+='</div><div class="diet-empty-hint">今天还没有饮食记录</div>';
    body.innerHTML=eh;
  }
}catch(e){console.error('[记录]饮食:',e);}

try{
  var fins=db.financeLogs||[];
  var body2=document.getElementById('mod-fin-body');
  if(!body2)throw new Error('no fin body');
  if(fins.length>0){
    var h2='<div class="fin-items">'; var monthlyTotal=0;
    fins.slice(0,3).forEach(function(f){
      var sign=f.type==='income'?'+':'-';var amt=Math.abs(f.amount||0);monthlyTotal+=f.type==='income'?amt:-amt;
      h2+='<div class="fin-item"><span class="fin-item-name">'+(f.note||f.category||'')+'</span><span class="fin-item-amt '+(f.type==='expense'?'neg':'')+'">'+sign+'¥'+amt.toFixed(2)+'</span></div>';
    });
    h2+='</div>';
    var mTotalStr=monthlyTotal>=0?'+¥'+monthlyTotal.toFixed(2):'-¥'+Math.abs(monthlyTotal).toFixed(2);
    h2+='<div class="fin-footer"><span>本月</span><span class="fin-footer-amt">'+mTotalStr+'</span></div>';
    body2.innerHTML=h2;
  }else{
    body2.innerHTML='<div class="fin-empty-primary">还没有记账记录</div><div class="fin-empty-hint">从今天记下第一笔</div><div class="fin-empty-lines"><span></span><span></span></div>';
  }
}catch(e){console.error('[记录]记账:',e);}

try{
  var insp=db.inspirations||[];
  var body3=document.getElementById('mod-insp-body');
  var dateEl=document.getElementById('mod-insp-date');
  if(body3&&insp.length>0){
    var lastInsp=insp[insp.length-1];
    body3.textContent=escapeHtml(lastInsp.ref||lastInsp.title||'');
    if(dateEl)dateEl.textContent=lastInsp.date||'';
  }
}catch(e){console.error('[记录]灵感:',e);}

try{
  var habits=db.habits||[];
  var body4=document.getElementById('mod-habit-body');
  if(!body4)throw new Error('no habit body');
  if(habits.length>0){
    var today=new Date();var dow=today.getDay();if(dow===0)dow=7;
    var mon=new Date(today);mon.setDate(today.getDate()-dow+1);
    var wdNames=['一','二','三','四','五','六','日'];
    var weekLabel=(mon.getMonth()+1)+'.'+mon.getDate()+'—'+(new Date(mon.getTime()+6*86400000).getMonth()+1)+'.'+new Date(mon.getTime()+6*86400000).getDate();
    var maxStreak=0;habits.forEach(function(h){if(h.streak&&h.streak>maxStreak)maxStreak=h.streak;});
    var h4='<div class="habit-aux">本周 '+weekLabel+(maxStreak>0?' · 连续 <span class="num">'+maxStreak+'</span> 天':'')+'</div>';
    h4+='<div class="habit-grid">';
    wdNames.forEach(function(n){h4+='<span class="habit-grid__weekday">'+n+'</span>';});
    habits.slice(0,3).forEach(function(h){
      h4+='<span class="habit-grid__name">'+(h.name||'')+'</span>';
      for(var i=0;i<7;i++){
        var d=new Date(mon.getTime()+i*86400000);
        var ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
        var done=h.logs&&h.logs.indexOf(ds)>=0;
        h4+='<span class="habit-dot'+(done?' is-complete':'')+'"></span>';
      }
    });
    h4+='</div>';
    body4.innerHTML=h4;
  }
}catch(e){console.error('[记录]习惯:',e);}

try{
  var books=db.books||[];
  var body5=document.getElementById('mod-book-body');
  if(!body5)throw new Error('no book body');
  if(books.length>0){
    var lastB=books[books.length-1];
    var scoreHtml=lastB.score?'<div class="book-score">'+(lastB.score||'')+'</div>':'';
    body5.innerHTML='<div class="book-layout"><div class="book-cover-wrap"><svg fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 016.5 2H20v20H6.5a2.5 2.5 0 010-5H20"/></svg></div><div class="book-info"><div class="book-title">'+escapeHtml(lastB.title||'')+'</div><div class="book-author">'+(lastB.author||'')+'</div><div class="book-review">'+escapeHtml((lastB.review||'').slice(0,80))+'</div>'+scoreHtml+'</div></div>';
  }
}catch(e){console.error('[记录]书评:',e);}

try{
  var layout=null;
  try{layout=JSON.parse(localStorage.getItem('KANSHI_RECORD_LAYOUT'));}catch(e){}
  if(layout&&layout.order&&layout.order.length>0){
    var mosaic=document.getElementById('record-mosaic');
    if(mosaic){layout.order.forEach(function(type){var el=document.querySelector('[data-record-type="'+type+'"]');if(el&&el.parentNode===mosaic){el.hidden=layout.hidden&&layout.hidden.indexOf(type)>=0;mosaic.appendChild(el);}});}
  }
}catch(e){console.error('[记录]编排:',e);}
</script>
</body>
</html>
