<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>简纸 — 待办</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+SC:wght@300;400;600;700&family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="shared.js"></script>
<style>
body.page-todo { margin:0; background:#0F0F0E; font-family:'Noto Serif SC','Outfit',sans-serif; -webkit-tap-highlight-color:transparent; }
.page-todo .app-viewport { max-width:480px; margin:0 auto; background:#F5F4F0; min-height:100vh; box-shadow:0 0 50px rgba(0,0,0,0.6); display:flex; flex-direction:column; position:relative; }
.page-todo .no-scrollbar::-webkit-scrollbar { display:none; }
.page-todo .no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }
.page-todo .kanshi-toast { position:fixed; top:24px; left:50%; transform:translateX(-50%); z-index:999; background:#1C1B1A; color:#FBBF24; border:1px solid #2C2B29; padding:8px 20px; border-radius:999px; font-size:12px; font-weight:700; box-shadow:0 8px 24px rgba(0,0,0,0.4); display:flex; align-items:center; gap:8px; animation:fadeSlideIn 0.3s ease-out; }
@keyframes fadeSlideIn { 0%{opacity:0;transform:translateX(-50%) translateY(-12px)} 100%{opacity:1;transform:translateX(-50%) translateY(0)} }

/* Nav */
.page-todo .nav-bar { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); width:calc(100% - 40px); max-width:430px; height:56px; background:rgba(251,251,250,0.92); backdrop-filter:blur(12px); border:1px solid #EAE7E1; border-radius:20px; display:flex; align-items:center; justify-content:space-around; padding:0 6px; z-index:40; box-shadow:0 4px 20px rgba(0,0,0,0.1); }
.page-todo .nav-btn { display:flex; flex-direction:column; align-items:center; justify-content:center; width:44px; height:44px; border-radius:12px; background:transparent; border:none; cursor:pointer; padding:0; }
.page-todo .nav-btn-inner { width:28px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:8px; }
.page-todo .nav-active-pill { background:#E3E8E3; }
.page-todo .nav-icon { width:18px; height:18px; }
.page-todo .nav-label { font-size:7px; font-weight:600; margin-top:1px; }
.page-todo .text-sage-800 { color:#405140; }
.page-todo .text-ink-500 { color:#8B8B80; }

/* Header */
.page-todo .todo-header { height:56px; border-bottom:1px solid #EAE7E1; padding:0 16px; display:flex; align-items:center; justify-content:space-between; background:#F5F4F0; position:relative; z-index:10; }
.page-todo .todo-header-title { font-size:14px; font-weight:700; color:#2C2B29; }
.page-todo .todo-header-count { font-size:10px; color:#5C5854; }
.page-todo .todo-scroll { flex:1; overflow-y:auto; padding-bottom:140px; }

/* 今日小笺 */
.page-todo .todo-note { margin:12px 16px; padding:10px 14px; background:#F0EFEA; border:1px solid #E2E0D8; border-radius:12px; cursor:pointer; }
.page-todo .todo-note.hide { display:none; }
.page-todo .todo-note-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
.page-todo .todo-note-left { display:flex; align-items:flex-start; gap:10px; flex:1; min-width:0; }
.page-todo .todo-note-label { font-size:9px; color:#8B8B80; font-weight:600; flex-shrink:0; margin-top:1px; }
.page-todo .todo-note-preview { font-size:11px; color:#4A4A42; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; flex:1; line-height:1.6; }
.page-todo .todo-note-arrow { font-size:8px; color:#BFBBB0; flex-shrink:0; margin-top:3px; transition:transform 0.2s; }
.page-todo .todo-note-body { margin-top:10px; display:none; }
.page-todo .todo-note-body.open { display:block; }
.page-todo .todo-note-text { width:100%; font-size:11px; color:#4A4A42; line-height:1.6; background:none; border:none; outline:none; font-family:inherit; resize:vertical; min-height:40px; padding:0; }

/* Filter + Input */
.page-todo .todo-filters { display:flex; gap:8px; padding:0 16px 10px; }
.page-todo .filter-btn { padding:5px 14px; border-radius:999px; font-size:11px; border:1px solid #EAE7E1; cursor:pointer; transition:all 0.2s; font-family:inherit; background:#FBFBFA; color:#5C5854; }
.page-todo .filter-btn.active { background:#405140; color:#FBFBFA; border-color:#405140; }
.page-todo .filter-btn.inactive { background:#FBFBFA; color:#5C5854; }
.page-todo .todo-input-row { display:flex; gap:0; margin:0 16px 12px; border:1px solid #EAE7E1; border-radius:12px; background:#FBFBFA; overflow:hidden; }
.page-todo .todo-input-row input { flex:1; height:40px; padding:0 12px; font-size:12px; border:none; background:transparent; outline:none; font-family:inherit; color:#2C2B29; }
.page-todo .todo-input-row input::placeholder { color:#BFBBB0; }
.page-todo .todo-input-row button { width:36px; height:40px; background:#405140; color:#FBFBFA; border:none; font-size:18px; cursor:pointer; flex-shrink:0; font-family:'Outfit',sans-serif; }

/* Groups */
.page-todo .todo-group { padding:0 16px; }
.page-todo .todo-group-head { display:flex; justify-content:space-between; align-items:center; padding:8px 2px 6px; }
.page-todo .todo-group-label { font-size:10px; font-weight:600; color:#5C5854; letter-spacing:0.02em; }
.page-todo .todo-group-num { font-weight:400; color:#BFBBB0; margin-left:4px; }
.page-todo .todo-group-toggle { background:none; border:none; font-size:9px; color:#BFBBB0; cursor:pointer; font-family:inherit; padding:2px 4px; border-radius:4px; }
.page-todo .todo-group-toggle:active { background:#EAE7E1; }
.page-todo .todo-group-list { display:flex; flex-direction:column; gap:3px; }
.page-todo .todo-group-list.collapsed { display:none; }

/* Swipe */
.page-todo .todo-item-wrap { overflow:hidden; margin-bottom:2px; border-radius:16px; }
.page-todo .todo-item-swipe { display:flex; align-items:stretch; width:calc(100% + 72px); background:#FBFBFA; border:1px solid #EAE7E1; border-radius:16px; transition:transform 0.25s cubic-bezier(0.16,1,0.3,1); will-change:transform; }
.page-todo .todo-item-swipe.swiping { transition:none; }
.page-todo .todo-item-swipe.open { transform:translateX(-72px); }
.page-todo .todo-swipe-delete { width:72px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:#A56868; border:none; color:#F5F0F0; font-size:11px; cursor:pointer; font-family:inherit; font-weight:600; letter-spacing:0.5px; border-radius:0 16px 16px 0; }

/* Items */
.page-todo .todo-item { display:flex; align-items:center; justify-content:space-between; flex:1; min-width:0; padding:11px 12px; min-height:40px; transition:all 0.2s; }
.page-todo .todo-item:active { background:#F0EFEA; }
.page-todo .todo-item.done { opacity:0.6; }
.page-todo .todo-item-inner { display:flex; align-items:center; gap:12px; flex:1; min-width:0; }
.page-todo .todo-check { width:22px; height:22px; min-width:22px; border-radius:999px; border:1.5px solid #D4D0C8; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.2s; cursor:pointer; background:transparent; }
.page-todo .todo-check:active { transform:scale(0.9); }
.page-todo .todo-check.done { background:#C5D6C5; border-color:#C5D6C5; }
.page-todo .todo-check.done svg { width:11px; height:11px; color:#FFF; stroke-width:3; }
.page-todo .todo-item-text-wrap { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; cursor:pointer; }
.page-todo .todo-item-text { font-size:12px; color:#2C2B29; line-height:1.5; }
.page-todo .todo-item-sub { font-size:9px; color:#A1A1AA; line-height:1.3; }
.page-todo .done .todo-item-text { color:#A1A1AA; text-decoration:line-through; text-decoration-color:#D4D0C8; }
.page-todo .done .todo-item-sub { color:#BFBBB0; }
.page-todo .todo-empty { text-align:center; padding:40px 16px; color:#BFBBB0; font-size:12px; }
.page-todo .todo-more-btn { background:none; border:none; color:#BFBBB0; cursor:pointer; padding:4px 8px; font-size:15px; line-height:1; flex-shrink:0; letter-spacing:2px; border-radius:8px; transition:all 0.15s; }
.page-todo .todo-more-btn:active { color:#8B8B80; background:#EAE7E1; }
.page-todo .todo-date-badge { font-size:8px; color:#A1A1AA; background:#F5F4F0; padding:1px 6px; border-radius:4px; margin-left:6px; white-space:nowrap; }
.page-todo .num { font-family:"Inter",Arial,sans-serif; font-weight:700; font-variant-numeric:tabular-nums; }

/* Panel */
.page-todo .panel-overlay { position:fixed; inset:0; background:rgba(28,27,26,0.5); z-index:100; opacity:0; transition:opacity 0.3s; pointer-events:none; }
.page-todo .panel-overlay.show { opacity:1; pointer-events:auto; }
.page-todo body.panel-open { overflow:hidden; }
.page-todo .bottom-panel { position:fixed; bottom:0; left:50%; transform:translateX(-50%) translateY(100%); width:100%; max-width:480px; background:#F5F4F0; border-radius:24px 24px 0 0; z-index:101; transition:transform 0.4s cubic-bezier(0.16,1,0.3,1); box-shadow:0 -6px 30px rgba(28,27,26,0.12); padding:0 0 env(safe-area-inset-bottom,16px); max-height:82vh; overflow-y:auto; }
.page-todo .bottom-panel.show { transform:translateX(-50%) translateY(0); }
.page-todo .panel-handle { width:32px; height:4px; background:#D4D0C8; border-radius:2px; margin:10px auto 6px; flex-shrink:0; }
.page-todo .panel-title-area { padding:2px 20px 14px; border-bottom:1px solid #EAE7E1; }
.page-todo .panel-item-title { font-size:13px; font-weight:700; color:#2C2B29; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.page-todo .panel-item-date { font-size:10px; color:#A1A1AA; margin-top:3px; }
.page-todo .panel-menu { padding:6px 20px; }
.page-todo .panel-menu-btn { width:100%; padding:0 4px; border:none; background:transparent; color:#2C2B29; font-size:12px; font-family:inherit; cursor:pointer; display:flex; align-items:center; gap:12px; height:50px; border-bottom:1px solid #EAE7E1; transition:background 0.1s; text-align:left; }
.page-todo .panel-menu-btn:last-of-type { border-bottom:none; }
.page-todo .panel-menu-btn:active { background:#F0EFEA; }
.page-todo .panel-menu-btn .pmi { width:18px; height:18px; flex-shrink:0; color:#7E997E; }
.page-todo .panel-menu-divider { height:1px; background:#E2E0D8; margin:6px 20px; }
.page-todo .panel-menu-btn.danger { color:#A56868; }
.page-todo .panel-menu-btn.danger .pmi { color:#A56868; }
.page-todo .panel-menu-btn.danger:active { background:#F5EBEB; }
.page-todo .panel-cancel { text-align:center; padding:16px 20px 8px; font-size:11px; color:#A1A1AA; cursor:pointer; font-family:inherit; border:none; background:transparent; width:100%; }

/* Sub-panel */
.page-todo .sp-header { display:flex; align-items:center; gap:8px; padding:8px 20px 0; position:sticky; top:0; background:#F5F4F0; z-index:1; }
.page-todo .sp-back { background:none; border:none; padding:6px; cursor:pointer; border-radius:6px; color:#7E997E; display:flex; align-items:center; }
.page-todo .sp-back:active { background:#EAE7E1; }
.page-todo .sp-header-title { font-size:12px; font-weight:600; color:#2C2B29; flex:1; text-align:center; padding-right:28px; }
.page-todo .sp-save-btn { background:none; border:none; font-size:11px; color:#7E997E; cursor:pointer; font-family:inherit; padding:6px 8px; border-radius:6px; font-weight:600; }
.page-todo .sp-save-btn:active { background:#EAE7E1; }
.page-todo .sp-save-btn.disabled { opacity:0.4; pointer-events:none; }
.page-todo .sp-body { padding:12px 20px 20px; }
.page-todo .edit-field { margin-bottom:14px; }
.page-todo .edit-label { font-size:9px; color:#A1A1AA; display:block; margin-bottom:5px; font-weight:600; }
.page-todo .edit-input, .page-todo .edit-textarea { width:100%; padding:8px 0; border:none; border-bottom:1px solid #E2E0D8; font-size:12px; outline:none; background:transparent; color:#2C2B29; font-family:inherit; box-sizing:border-box; transition:border-color 0.15s; border-radius:0; }
.page-todo .edit-input:focus, .page-todo .edit-textarea:focus { border-bottom-color:#7E997E; }
.page-todo .edit-textarea { min-height:56px; resize:vertical; line-height:1.6; }

/* Date opts */
.page-todo .date-opt-grid { display:flex; flex-wrap:wrap; gap:6px; }
.page-todo .date-opt-btn { padding:8px 16px; border:1px solid #E2E0D8; border-radius:10px; background:#FBFBFA; color:#2C2B29; font-size:10px; cursor:pointer; font-family:inherit; transition:all 0.12s; }
.page-todo .date-opt-btn:active { background:#EAE7E1; }
.page-todo .date-opt-btn.active { background:#405140; border-color:#405140; color:#FBFBFA; }
.page-todo .date-opt-btn.remove { color:#A56868; border-color:#E0CCCC; }

/* Opt rows */
.page-todo .opt-row { width:100%; text-align:left; padding:0 4px; height:48px; border:none; background:transparent; font-size:11px; font-family:inherit; cursor:pointer; display:flex; align-items:center; gap:12px; color:#2C2B29; border-bottom:1px solid #EAE7E1; }
.page-todo .opt-row:active { background:#F0EFEA; }
.page-todo .opt-row:last-of-type { border-bottom:none; }
.page-todo .opt-row .rmi { width:16px; height:16px; flex-shrink:0; color:#7E997E; }
.page-todo .opt-row.active { color:#405140; font-weight:600; }
.page-todo .opt-row.active .rmi { color:#405140; }

/* Detail / Confirm */
.page-todo .detail-wrap { text-align:center; padding:4px 0; }
.page-todo .detail-title { font-size:13px; color:#2C2B29; margin:0 0 12px; font-weight:700; line-height:1.5; }
.page-todo .detail-row { font-size:10px; color:#5C5854; line-height:1.8; }
.page-todo .confirm-wrap { text-align:center; padding:4px 0; }
.page-todo .confirm-msg { font-size:11px; color:#5C5854; margin:0 0 16px; line-height:1.5; }
.page-todo .confirm-btns { display:flex; gap:10px; justify-content:center; }
.page-todo .confirm-btn { flex:1; padding:9px; border-radius:8px; font-size:11px; cursor:pointer; font-family:inherit; border:none; }
.page-todo .confirm-cancel { background:#FBFBFA; border:1px solid #E2E0D8; color:#5C5854; }
.page-todo .confirm-danger { background:#A56868; color:#F5F0F0; }
.page-todo .confirm-primary { background:#405140; color:#FBFBFA; }

/* Undo */
.page-todo .undo-hint { position:fixed; bottom:88px; left:50%; transform:translateX(-50%); z-index:99; background:#1C1B1A; color:#FBFBFA; border:1px solid #2C2B29; padding:10px 20px; border-radius:999px; font-size:11px; box-shadow:0 6px 20px rgba(0,0,0,0.25); display:flex; align-items:center; gap:12px; animation:fadeSlideUp 0.3s ease-out; }
@keyframes fadeSlideUp { 0%{opacity:0;transform:translateX(-50%) translateY(12px)} 100%{opacity:1;transform:translateX(-50%) translateY(0)} }
.page-todo .undo-hint-btn { background:none; border:none; color:#D4C79E; font-size:11px; cursor:pointer; font-family:inherit; text-decoration:underline; padding:0; }

/* Custom repeat */
.page-todo .cfg-row { display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
.page-todo .cfg-label { font-size:9px; color:#A1A1AA; min-width:48px; }
.page-todo .cfg-input { width:56px; padding:6px 8px; border:1px solid #E2E0D8; border-radius:8px; font-size:11px; outline:none; background:#FBFBFA; color:#2C2B29; font-family:inherit; text-align:center; }
.page-todo .cfg-input:focus { border-color:#7E997E; }
.page-todo .cfg-select { padding:6px 8px; border:1px solid #E2E0D8; border-radius:8px; font-size:11px; outline:none; background:#FBFBFA; color:#2C2B29; font-family:inherit; }
.page-todo .cfg-select:focus { border-color:#7E997E; }
.page-todo .day-pills { display:flex; gap:4px; }
.page-todo .day-pill { width:30px; height:30px; border-radius:999px; border:1px solid #E2E0D8; background:#FBFBFA; color:#2C2B29; font-size:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:inherit; transition:all 0.12s; }
.page-todo .day-pill:active { background:#EAE7E1; }
.page-todo .day-pill.on { background:#405140; border-color:#405140; color:#FBFBFA; }
</style>
</head>
<body class="page-todo">
<div class="app-viewport" id="app-viewport">
  <div class="todo-header">
    <h2 class="todo-header-title">待办</h2>
    <span class="todo-header-count" id="todo-count"></span>
  </div>
  <div class="todo-scroll no-scrollbar" id="todo-scroll">
    <div class="todo-note hide" id="todo-note-card" onclick="toggleNote()">
      <div class="todo-note-top">
        <div class="todo-note-left">
          <span class="todo-note-label">今日小笺</span>
          <span class="todo-note-preview" id="todo-note-preview">今天的松花酿酒，春水煎茶。</span>
        </div>
        <span class="todo-note-arrow" id="todo-note-arrow">⌄</span>
      </div>
      <div class="todo-note-body" id="todo-note-body">
        <textarea class="todo-note-text" id="todo-note-textarea" oninput="saveMemoNote(this.value)" placeholder="今天的松花酿酒，春水煎茶。"></textarea>
      </div>
    </div>
    <div class="todo-filters" id="todo-filter-bar">
      <button class="filter-btn active" id="todo-filter-today" onclick="filterTodo('today')">今日</button>
      <button class="filter-btn inactive" id="todo-filter-week" onclick="filterTodo('week')">本周</button>
      <button class="filter-btn inactive" id="todo-filter-all" onclick="filterTodo('all')">全部</button>
    </div>
    <div class="todo-input-row">
      <input type="text" autocomplete="off" name="kanshi_new_todo" id="todo-title-input" placeholder="今天还想完成什么？" onkeydown="if(event.key==='Enter')addTodoItem()">
      <button onclick="addTodoItem()">+</button>
    </div>
    <div id="todo-list-container"></div>
  </div>
  <nav class="nav-bar">
    <button class="nav-btn" onclick="redirectTo('index.html')"><div class="nav-btn-inner"><svg class="nav-icon text-ink-500" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h2M20 12h2M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/></svg></div><span class="nav-label text-ink-500">今天</span></button>
    <button class="nav-btn" id="nav-todo"><div class="nav-btn-inner nav-active-pill"><svg class="nav-icon text-sage-800" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></div><span class="nav-label text-sage-800">待办</span></button>
    <button class="nav-btn" onclick="redirectTo('records.html')"><div class="nav-btn-inner"><svg class="nav-icon text-ink-500" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 016.5 2H20v20H6.5a2.5 2.5 0 010-5H20"/><path d="M10 8h6M10 12h4"/></svg></div><span class="nav-label text-ink-500">记录</span></button>
    <button class="nav-btn" onclick="redirectTo('tools.html')"><div class="nav-btn-inner"><svg class="nav-icon text-ink-500" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg></div><span class="nav-label text-ink-500">工具</span></button>
    <button class="nav-btn" onclick="redirectTo('storage.html')"><div class="nav-btn-inner"><svg class="nav-icon text-ink-500" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 7l-9-5-9 5m18 0l-9 5m9-5v10l-9 5m0-15v14"/><path d="M3.97 12.08L12 17l8.03-4.92"/></svg></div><span class="nav-label text-ink-500">收纳盒</span></button>
  </nav>
</div>
<div class="panel-overlay" id="panel-overlay" onclick="closePanel()"></div>
<div class="bottom-panel" id="bottom-panel">
  <div class="panel-handle"></div>
  <div class="panel-title-area" id="panel-title-area">
    <div class="panel-item-title" id="panel-item-title"></div>
    <div class="panel-item-date" id="panel-item-date"></div>
  </div>

// ─── Data migration ───
function migrateTodo(t) {
  if (t.generatedNextTaskId !== undefined) return t;
  var now=new Date(), today=now.toISOString().slice(0,10);
  var cr=t.createdAt||today, sd=t.scheduledDate||null;
  if(!sd&&t.scope==='week') sd=today;
  if(!sd&&t.scope==='all') sd=null;
  if(!sd&&t.scope==='today') sd=today;
  return {
    id:t.id, title:t.title, status:t.completed?'completed':'pending',
    scheduledDate:sd, scheduledTime:t.scheduledTime||null,
    createdAt:cr, updatedAt:now.toISOString(),
    completedAt:t.completed?(t.completedAt||now.toISOString()):null,
    notes:t.notes||'', reminder:t.reminder||'', remindAt:t.remindAt||null, remindEnabled:t.remindEnabled||false,
    repeatRule:t.repeatRule||'', repeatConfig:t.repeatConfig||null,
    seriesId:t.seriesId||'', parentTaskId:t.parentTaskId||'',
    isException:t.isException||false, generatedNextTaskId:t.generatedNextTaskId||''
  };
}

function gi(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function wr(){
  var d=new Date(), day=d.getDay()||7, diff=d.getDate()-day+1;
  var m=new Date(d); m.setDate(diff);
  var s=new Date(m); s.setDate(m.getDate()+6);
  return {mon:m.toISOString().slice(0,10), sun:s.toISOString().slice(0,10)};
}
function fd(iso){if(!iso)return'';return parseInt(iso.slice(5,7))+'月'+parseInt(iso.slice(8,10))+'日';}
function wkn(ds){return '周'+['日','一','二','三','四','五','六'][new Date(ds+'T00:00:00').getDay()];}
function ad(ds,n){var d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function fmtLocal(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

// ─── Filter helpers ───
function isOverdue(t){return t.status==='pending'&&t.scheduledDate&&t.scheduledDate<gi();}
function isToday(t){return t.scheduledDate===gi();}
function isNext7(t){if(!t.scheduledDate)return false;var td=gi(),d=new Date(td+'T00:00:00'),e=new Date(d);e.setDate(d.getDate()+7);return t.scheduledDate>td&&t.scheduledDate<=fmtLocal(e);}
function isFuture(t){if(!t.scheduledDate)return false;var td=gi(),d=new Date(td+'T00:00:00'),e=new Date(d);e.setDate(d.getDate()+7);return t.scheduledDate>fmtLocal(e);}
function isNoDate(t){return !t.scheduledDate;}
function isTodayCompleted(t){if(t.status!=='completed'||!t.completedAt)return false;return t.completedAt.slice(0,10)===gi();}
function isWeekCompleted(t){if(t.status!=='completed'||!t.completedAt)return false;var r=wr(),cd=t.completedAt.slice(0,10);return cd>=r.mon&&cd<=r.sun;}

// ─── Swipe (touch + mouse) ───
var _swipe={sx:0,cx:0,active:false,el:null,id:null,blockClick:false};

function closeAllSwipe(){
  document.querySelectorAll('.todo-item-swipe.open').forEach(function(s){s.classList.remove('open');s.style.transform='';});
  ui.openSwipeTaskId=null;
}

function initSwipe(){
  var c=document.getElementById('todo-list-container');
  if(!c)return;
  // Touch
  c.addEventListener('touchstart',onTouchStart,{passive:true});
  c.addEventListener('touchmove',onTouchMove,{passive:true});
  c.addEventListener('touchend',onTouchEnd,{passive:true});
  // Mouse
  c.addEventListener('mousedown',onMouseDown);
  c.addEventListener('mousemove',onMouseMove);
  c.addEventListener('mouseup',onMouseUp);
  c.addEventListener('mouseleave',onMouseUp);
  // Block click for 300ms after swipe
  c.addEventListener('click',function(e){
    if(_swipe.blockClick){e.stopPropagation();e.preventDefault();_swipe.blockClick=false;}
  },true);
  // Close open swipes on outside click
  document.addEventListener('click',function(e){
    if(!e.target.closest('.todo-item-wrap')&&!e.target.closest('.todo-swipe-delete'))closeAllSwipe();
  });
}

function getSwipeEl(e){
  var w=e.target.closest('.todo-item-wrap');
  if(!w)return null;
  var sw=w.querySelector('.todo-item-swipe');
  if(!sw)return null;
  if(e.target.closest('.todo-swipe-delete')||e.target.closest('.todo-more-btn'))return null;
  return sw;
}

function swipeStart(sw,clientX){
  closeAllSwipe();

  sw.classList.add('swiping');
}
function swipeMove(clientX){
  if(!_swipe.active||!_swipe.el)return;
  _swipe.cx=clientX;
  var d=_swipe.sx-_swipe.cx;if(d<0)d=0;if(d>72)d=72;
  _swipe.el.style.transform='translateX(-'+d+'px)';
}
function swipeEnd(){
  if(!_swipe.active||!_swipe.el)return;
  var d=_swipe.sx-_swipe.cx;
  if(d>35){_swipe.el.classList.add('open');ui.openSwipeTaskId=_swipe.id;_swipe.blockClick=true;}
  else{_swipe.el.classList.remove('open');ui.openSwipeTaskId=null;}
  _swipe.el.style.transform='';_swipe.el.classList.remove('swiping');
  _swipe.active=false;_swipe.el=null;_swipe.id=null;
  if(_swipe.blockClick)setTimeout(function(){_swipe.blockClick=false;},300);
}

function onTouchStart(e){var sw=getSwipeEl(e);if(sw)swipeStart(sw,e.touches[0].clientX);}
function onTouchMove(e){if(_swipe.active)swipeMove(e.touches[0].clientX);}
function onTouchEnd(e){swipeEnd();}
function onMouseDown(e){var sw=getSwipeEl(e);if(sw)swipeStart(sw,e.clientX);}
function onMouseMove(e){if(_swipe.active&&e.buttons)swipeMove(e.clientX);}
function onMouseUp(e){if(_swipe.active)swipeEnd();}

// ─── Render ───
function render(){
  closeAllSwipe();
  var ta=document.getElementById('todo-note-textarea');
  if(ta){ta.value=db.memoNote||'';updateNotePreview();}
  var nc=document.getElementById('todo-note-card');
  if(nc)nc.classList.toggle('hide',ui.view!=='today');
  var c=document.getElementById('todo-list-container');
  if(!c)return; c.innerHTML='';
  var all=db.todos||[], ce=document.getElementById('todo-count');
  if(ui.view==='today')renderToday(c,all,ce);
  else if(ui.view==='week')renderWeek(c,all,ce);
  else renderAll(c,all,ce);
}
function renderToday(c,t,ce){
  var today=gi();
  var overdue=t.filter(isOverdue);
  var todayP=t.filter(function(x){return x.status==='pending'&&x.scheduledDate===today;});
  var todayD=t.filter(isTodayCompleted);
  todayD.sort(function(a,b){return a.completedAt<b.completedAt?1:-1;});
  var total=overdue.length+todayP.length;
  if(ce)ce.textContent=total===0?'今日已清空':'还剩 '+total+' 项';
  if(t.length===0){c.innerHTML='<div class="todo-empty">还没有待办</div>';return;}
  var h='';
  if(overdue.length)h+=grp('逾期',overdue.length,overdue,'t-ov',false);
  if(todayP.length)h+=grp('待完成',todayP.length,todayP,'t-td',false);
  if(todayD.length){
    var showDone=todayD;
    var expandAllKey='todayDoneExpand';
    if(todayD.length>3&&!ui.doneExpandedAll){
      showDone=todayD.slice(0,3);
    }
    h+=grp('今日已完成',todayD.length,showDone,'t-dn',true);
    if(todayD.length>3&&!ui.doneExpandedAll){
      h+='<div class="todo-group" style="padding:0 16px"><button class="todo-group-toggle" onclick="ui.doneExpandedAll=true;render()" style="font-size:9px;color:#7E997E;padding:4px 0">查看全部 '+todayD.length+' 项</button></div>';
    }
  }
  if(!overdue.length&&!todayP.length&&!todayD.length)h='<div class="todo-empty">还没有待办</div>';
  c.innerHTML=h;
}
function renderWeek(c,t,ce){
  var r=wr();
  var wp=t.filter(function(x){return x.status==='pending'&&x.scheduledDate&&x.scheduledDate>=r.mon&&x.scheduledDate<=r.sun;});
  var wd=t.filter(isWeekCompleted);
  if(ce)ce.textContent='本周还剩 '+wp.length+' 项';
  if(t.length===0){c.innerHTML='<div class="todo-empty">还没有待办</div>';return;}
  var dg={}; wp.forEach(function(x){if(!dg[x.scheduledDate])dg[x.scheduledDate]=[];dg[x.scheduledDate].push(x);});
  var h='';
  Object.keys(dg).sort().forEach(function(d){h+=grp(wkn(d)+'·'+fd(d),dg[d].length,dg[d],'w-'+d,false);});
  if(wd.length){
    var showDone=wd;
    if(wd.length>3&&!ui.doneExpandedAll){
      showDone=wd.slice(0,3);
    }
    h+=grp('本周已完成',wd.length,showDone,'w-dn',true);
    if(wd.length>3&&!ui.doneExpandedAll){
      h+='<div class="todo-group" style="padding:0 16px"><button class="todo-group-toggle" onclick="ui.doneExpandedAll=true;render()" style="font-size:9px;color:#7E997E;padding:4px 0">查看全部 '+wd.length+' 项</button></div>';
    }
  }
  if(!Object.keys(dg).length&&!wd.length)h='<div class="todo-empty">本周没有待办</div>';
  c.innerHTML=h;
}
function renderAll(c,t,ce){
  var p=t.filter(function(x){return x.status==='pending';}), d=t.filter(function(x){return x.status==='completed';});
  if(ce)ce.textContent='共 '+p.length+' 项待完成';
  if(t.length===0){c.innerHTML='<div class="todo-empty">还没有待办</div>';return;}
  var ov_=p.filter(isOverdue), td_=p.filter(isToday), n7_=p.filter(isNext7), ft_=p.filter(isFuture), nd_=p.filter(isNoDate);
  var h='';
  if(ov_.length)h+=grp('逾期',ov_.length,ov_,'a-ov',false);
  if(td_.length)h+=grp('今天',td_.length,td_,'a-td',false);
  if(n7_.length)h+=grp('接下来7天',n7_.length,n7_,'a-n7',false);
  if(ft_.length)h+=grp('以后',ft_.length,ft_,'a-ft',false);
  if(nd_.length)h+=grp('无日期',nd_.length,nd_,'a-nd',false);
  if(d.length){
    var showDone=d;
    if(d.length>3&&!ui.doneExpandedAll){
      showDone=d.slice(0,3);
    }
    h+=grp('已完成',d.length,showDone,'a-dn',true);
    if(d.length>3&&!ui.doneExpandedAll){
      h+='<div class="todo-group" style="padding:0 16px"><button class="todo-group-toggle" onclick="ui.doneExpandedAll=true;render()" style="font-size:9px;color:#7E997E;padding:4px 0">查看全部 '+d.length+' 项</button></div>';
    }
  }
  if(!ov_.length&&!td_.length&&!n7_.length&&!ft_.length&&!nd_.length&&!d.length)h='<div class="todo-empty">还没有待办</div>';
  c.innerHTML=h;
}
function grp(lb,ct,items,k,defCollapsed){
  var is=ui.collapsedGroups[k]; if(is===undefined)is=defCollapsed||false;
  var h=''; items.forEach(function(t){h+=ri(t);});
  return '<div class="todo-group"><div class="todo-group-head"><span class="todo-group-label">'+lb+'<span class="todo-group-num">'+ct+'</span></span>'+
    '<button class="todo-group-toggle" onclick="toggleCollapse(\''+k+'\')">'+(is?'展开':'收起')+'</button></div>'+
    '<div class="todo-group-list'+(is?' collapsed':'')+'">'+h+'</div></div>';
}
function toggleCollapse(k){
  ui.collapsedGroups[k]=!ui.collapsedGroups[k];
  render();

// ─── renderItem ───
function ri(t){
  var ck=t.status==='completed';
  var ch=ck?'<span class="todo-check done"><svg fill="none" stroke="currentColor" stroke-width="3.5" viewBox="0 0 24 24"><path d="M4.5 12.75l6 6 9-13.5"/></svg></span>':'<span class="todo-check"></span>';
  var sub=[];
  if(t.remindEnabled&&t.remindAt)sub.push('⏰ '+t.remindAt.slice(11,16));
  else if(t.reminder&&t.reminder!=='不提醒')sub.push('⏰ '+t.reminder);
  if(t.repeatRule){var rn=t.repeatRule; if(rn==='daily')rn='每天'; else if(rn==='weekly')rn='每周'; else if(rn==='monthly')rn='每月'; else if(rn==='yearly')rn='每年'; else if(rn==='workdays')rn='工作日'; else if(rn==='custom')rn='自定义'; sub.push('↻ '+rn);}
  if(!sub.length&&t.status==='pending'&&t.scheduledDate&&t.scheduledDate<gi()){var da=Math.round((Date.now()-new Date(t.scheduledDate+'T00:00:00').getTime())/86400000);sub.push(da===1?'昨天':fd(t.scheduledDate));}
  var sh=sub.length?'<span class="todo-item-sub">'+sub.join(' · ')+'</span>':'';
  return '<div class="todo-item-wrap">'+
    '<div class="todo-item-swipe'+(ck?' done':'')+'" data-todo-id="'+t.id+'">'+
    '<div class="todo-item'+(ck?' done':'')+'">'+
    '<div class="todo-item-inner">'+
    '<span class="todo-check'+(ck?' done':'')+'" onclick="ttc(\''+t.id+'\',event)">'+ch+'</span>'+
    '<div class="todo-item-text-wrap" onclick="std(\''+t.id+'\')"><span class="todo-item-text">'+escapeHtml(t.title)+'</span>'+sh+'</div></div>'+
    '<button class="todo-more-btn" onclick="otm(\''+t.id+'\',event)">···</button></div>'+
    '<button class="todo-swipe-delete" onclick="sdt(\''+t.id+'\',event)">删除</button>'+
    '</div></div>';
}

// ─── Toggle complete ───
function ttc(id,e){
  if(e)e.stopPropagation(); closeAllSwipe();
  var todo=db.todos.find(function(t){return t.id===id;}); if(!todo)return;
  if(todo.status==='completed'){
    todo.status='pending'; todo.completedAt=null; todo.updatedAt=new Date().toISOString();
    saveDatabase(); render(); return;
  }
  todo.status='completed'; todo.completedAt=new Date().toISOString(); todo.updatedAt=new Date().toISOString();
  if(todo.repeatRule&&!todo.generatedNextTaskId){
    var next=genNext(todo);
    if(next){db.todos.push(next);todo.generatedNextTaskId=next.id;saveDatabase();render();showToast('已生成下一期');return;}
  }
  saveDatabase(); render();
}

// ─── genNext ───
function genNext(todo){
  var rule=todo.repeatRule; if(!rule)return null;
  var cfg=todo.repeatConfig;
  var nextDate=calcNextDate(todo,rule,cfg);
  if(!nextDate)return null;
  if(cfg&&cfg.endType==='after'&&cfg.endCount>0){
    var seriesTodos=db.todos.filter(function(t){return t.seriesId===todo.seriesId&&t.status==='completed';});
    if(seriesTodos.length>=cfg.endCount)return null;
  }
  if(cfg&&cfg.endType==='on'&&cfg.endDate&&nextDate>cfg.endDate)return null;
  return {
    id:'todo_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
    title:todo.title,status:'pending',
    scheduledDate:nextDate,scheduledTime:todo.scheduledTime||null,
    createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),
    completedAt:null,notes:todo.notes||'',reminder:todo.reminder||'',
    remindAt:todo.remindAt||null,remindEnabled:todo.remindEnabled||false,
    repeatRule:todo.repeatRule,repeatConfig:cfg?JSON.parse(JSON.stringify(cfg)):null,
    seriesId:todo.seriesId||('series_'+Date.now()),
    parentTaskId:todo.id,isException:false,generatedNextTaskId:''
  };
}

function calcNextDate(todo,rule,cfg){
  var base=todo.scheduledDate||gi();
  var d=new Date(base+'T00:00:00');
  if(rule==='daily'){d.setDate(d.getDate()+1);return fmtLocal(d);}
  if(rule==='workdays'){d.setDate(d.getDate()+1);while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()+1);return fmtLocal(d);}
  if(rule==='weekly'){
    if(cfg&&cfg.daysOfWeek&&cfg.daysOfWeek.length){
      for(var i=0;i<14;i++){d.setDate(d.getDate()+1);if(cfg.daysOfWeek.indexOf(d.getDay()||7)>=0)return fmtLocal(d);}
      return null;
    }
    d.setDate(d.getDate()+((cfg&&cfg.interval)||1)*7);return fmtLocal(d);
  }
  if(rule==='monthly'){
    var interval=(cfg&&cfg.interval)||1; d.setMonth(d.getMonth()+interval);
    var m=d.getMonth(),y=d.getFullYear(),lastDay=new Date(y,m+1,0).getDate();
    d.setDate(Math.min(parseInt(base.slice(8,10)),lastDay));return fmtLocal(d);
  }
  if(rule==='yearly'){d.setFullYear(d.getFullYear()+((cfg&&cfg.interval)||1));return fmtLocal(d);}
  if(rule==='custom'){
    var c=cfg;if(!c)return null;
    if(c.type==='daily'){d.setDate(d.getDate()+(c.interval||1));return fmtLocal(d);}
    if(c.type==='weekly'&&c.daysOfWeek&&c.daysOfWeek.length){for(var i=0;i<28;i++){d.setDate(d.getDate()+1);if(c.daysOfWeek.indexOf(d.getDay()||7)>=0)return fmtLocal(d);}return null;}
    if(c.type==='monthly'){d.setMonth(d.getMonth()+(c.interval||1));return fmtLocal(d);}
    if(c.type==='yearly'){d.setFullYear(d.getFullYear()+(c.interval||1));return fmtLocal(d);}
  }
  return null;
}

function readableRepeat(rule,cfg){
  if(!rule)return '';
  if(rule==='daily')return '每天'; if(rule==='workdays')return '工作日';
  if(rule==='weekly'){
    if(cfg&&cfg.daysOfWeek&&cfg.daysOfWeek.length){var n={1:'一',2:'二',3:'三',4:'四',5:'五',6:'六',7:'日'},d=cfg.daysOfWeek.map(function(d){return n[d]||'';}).join('、');return '每'+(cfg.interval>1?cfg.interval+'周':'周')+d;}
    return '每周';
  }
  if(rule==='monthly')return '每月'+(cfg&&cfg.interval>1?cfg.interval+'个月':'');
  if(rule==='yearly')return '每年';
  if(rule==='custom'){
    var c=cfg;if(!c)return '自定义';
    if(c.type==='daily')return '每'+(c.interval||1)+'天';

    return '自定义';
  }

}

  }
  html+='<div class="confirm-btns" style="margin-top:4px"><button class="confirm-btn confirm-cancel" onclick="renderPanelMain()">取消</button>'+
    '<button class="confirm-btn confirm-danger" onclick="dwus(ui.activeTaskId,\'single\')">删除</button></div></div>';
  document.getElementById('panel-body').innerHTML=html;
}
function confirmSeriesDelete(){
  var todo=db.todos.find(function(t){return t.id===ui.activeTaskId;});if(!todo)return;
  var html='<div class="confirm-wrap"><p class="confirm-msg">确定要删除「'+escapeHtml(todo.title)+'」整个系列？</p>'+
    '<div class="confirm-btns"><button class="confirm-btn confirm-cancel" onclick="opdel()">取消</button>'+
    '<button class="confirm-btn confirm-danger" onclick="closeModal();dwus(ui.activeTaskId,\'all\')">删除整个系列</button></div></div>';
  showModal(html);
}

// ─── Delete scopes ───
function dwus(id,scope){
  if(scope==='all'){
    var todo=db.todos.find(function(t){return t.id===id;});if(!todo)return;
    var sid=todo.seriesId;if(!sid){dwus(id,'single');return;}
    var ids=db.todos.filter(function(t){return t.seriesId===sid;}).map(function(t){return t.id;});
    var snap={};ids.forEach(function(i){var t=db.todos.find(function(x){return x.id===i;});if(t)snap[i]=JSON.parse(JSON.stringify(t));});
    ldt=snap;ldi=-1;
    db.todos=db.todos.filter(function(t){return t.seriesId!==sid;});
    saveDatabase();dcp();render();showUndo('已删除系列共'+ids.length+'项',function(){undoSeriesDelete(snap);});
    return;
  }
  if(scope==='future'){
    var todo=db.todos.find(function(t){return t.id===id;});if(!todo)return;
    var sid=todo.seriesId,today=gi();
    var future=db.todos.filter(function(t){return t.seriesId===sid&&t.scheduledDate>today&&t.status==='pending';});
    var fids=future.map(function(t){return t.id;});
    var snap={};future.forEach(function(t){snap[t.id]=JSON.parse(JSON.stringify(t));});
    ldt=snap;ldi=-2;
    db.todos=db.todos.filter(function(t){return fids.indexOf(t.id)<0;});
    todo.isException=true;todo.repeatRule='';todo.repeatConfig=null;todo.seriesId='';
    todo.updatedAt=new Date().toISOString();saveDatabase();dcp();render();
    showUndo('已删除未来任务共'+fids.length+'项',function(){undoSeriesDelete(snap);});
    return;
  }
  dwu(id);
}
function undoSeriesDelete(snap){var ids=Object.keys(snap);ids.forEach(function(id){db.todos.push(snap[id]);});ldt=null;saveDatabase();render();removeUndo();}

// ─── Single delete + undo ───
function dwu(id){
  var idx=db.todos.findIndex(function(t){return t.id===id;});if(idx<0)return;
  ldt=JSON.parse(JSON.stringify(db.todos[idx]));ldi=idx;
  db.todos.splice(idx,1);saveDatabase();dcp();render();showUndo('已删除待办',undoSingle);
}
function undoSingle(){
  if(!ldt)return;
  if(typeof ldi==='number'&&ldi>=0){db.todos.splice(ldi,0,ldt);}
  ldt=null;saveDatabase();render();removeUndo();
}
function showUndo(msg,cb){removeUndo();var el=document.createElement('div');el.className='undo-hint';el.id='tu';
  el.innerHTML='<span>'+msg+'</span><button class="undo-hint-btn" onclick="if(window.__uc)window.__uc()">撤销</button>';
  document.body.appendChild(el);window.__uc=cb||undoSingle;
  if(undoTimer)clearTimeout(undoTimer);undoTimer=setTimeout(removeUndo,5000);
}
function removeUndo(){var el=document.getElementById('tu');if(el)el.remove();if(undoTimer){clearTimeout(undoTimer);undoTimer=null;}}

// ─── Filter switch ───
function ft_(scope){
  ui.view=scope; ui.openSwipeTaskId=null; ui.doneExpandedAll=false; closeAllSwipe();
  document.querySelectorAll('.filter-btn').forEach(function(b){b.className='filter-btn '+(b.id==='todo-filter-'+scope?'active':'inactive');});
  var inp=document.getElementById('todo-title-input');
  if(inp){if(scope==='today')inp.placeholder='今天还想完成什么？';else if(scope==='week')inp.placeholder='这周想安排什么？';else inp.placeholder='新增一件待办……';}
  render();
}
function filterTodo(scope){ft_(scope);}
function addTodoItem(){closeAllSwipe();ati();}

// ─── Init ───
var inp=document.getElementById('todo-title-input');
if(inp){inp.placeholder='今天还想完成什么？';inp.setAttribute('autocomplete','off');}
render();
setTimeout(initSwipe,50);
</script>
