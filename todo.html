<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>简纸 — 待办</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+SC:wght@300;400;600;700&family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="shared.js"></script>
<style>
/* ═══════ 基础 ═══════ */
body.page-todo { margin:0; background:#0F0F0E; font-family:'Noto Serif SC','Outfit',sans-serif;
  -webkit-tap-highlight-color:transparent; }
.page-todo .app-viewport { max-width:480px; margin:0 auto; background:#F5F4F0; min-height:100vh; box-shadow:0 0 50px rgba(0,0,0,0.6); display:flex; flex-direction:column; }
.page-todo .no-scrollbar::-webkit-scrollbar { display:none; }
.page-todo .no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }
.page-todo .paper-card { background:#FBFBFA; border:1px solid #EAE7E1; border-radius:20px; transition:all 0.3s cubic-bezier(0.16,1,0.3,1); }
.page-todo .paper-card:active { transform:scale(0.98); background:#F5F4F0; }

/* Toast */
.page-todo .kanshi-toast { position:fixed; top:24px; left:50%; transform:translateX(-50%); z-index:999; background:#1C1B1A; color:#FBBF24; border:1px solid #2C2B29; padding:8px 20px; border-radius:999px; font-size:12px; font-weight:700; box-shadow:0 8px 24px rgba(0,0,0,0.4); display:flex; align-items:center; gap:8px; animation:fadeSlideIn 0.3s ease-out; }
@keyframes fadeSlideIn { 0%{opacity:0;transform:translateX(-50%) translateY(-12px)} 100%{opacity:1;transform:translateX(-50%) translateY(0)} }

/* Nav */
.page-todo .nav-bar { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); width:calc(100% - 40px); max-width:430px; height:64px; background:rgba(251,251,250,0.9); backdrop-filter:blur(12px); border:1px solid #EAE7E1; border-radius:24px; display:flex; align-items:center; justify-content:space-around; padding:0 12px; z-index:40; box-shadow:0 4px 20px rgba(0,0,0,0.1); }
.page-todo .nav-btn { display:flex; flex-direction:column; align-items:center; justify-content:center; width:48px; height:48px; border-radius:16px; background:transparent; border:none; cursor:pointer; padding:0; }
.page-todo .nav-btn-inner { width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:12px; }
.page-todo .nav-active-pill { background:#E3E8E3; }
.page-todo .nav-icon { width:20px; height:20px; }
.page-todo .nav-label { font-size:8px; font-weight:700; margin-top:2px; }
.page-todo .text-sage-800 { color:#405140; }
.page-todo .text-ink-500 { color:#5C5854; }

/* Modal */
.page-todo .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px; }
.page-todo .modal-overlay.hidden { display:none; }
.page-todo .modal-content { background:#F5F4F0; border:1px solid #DDD9CF; width:100%; max-width:360px; border-radius:24px; padding:24px; box-shadow:0 12px 40px rgba(0,0,0,0.3); max-height:85vh; overflow-y:auto; }

/* Todo 特有 */
.page-todo .todo-scroll { flex:1; overflow-y:auto; padding-bottom:128px; }
.page-todo .todo-header { height:56px; border-bottom:1px solid #EAE7E1; padding:0 16px; display:flex; align-items:center; justify-content:space-between; background:#F5F4F0; }
.page-todo .todo-title { font-size:14px; font-weight:700; color:#2C2B29; }
.page-todo .todo-memo { margin:16px; }
.page-todo .todo-memo textarea { width:100%; min-height:80px; padding:12px; font-size:12px; background:#FFF; border:1px solid #EAE7E1; border-radius:16px; outline:none; font-family:inherit; resize:vertical; }
.page-todo .todo-filters { display:flex; gap:8px; padding:0 16px 12px; }
.page-todo .filter-btn { padding:6px 16px; border-radius:999px; font-size:12px; border:1px solid #EAE7E1; cursor:pointer; transition:all 0.2s; }
.page-todo .filter-btn.active { background:#405140; color:#FBFBFA; border-color:#405140; }
.page-todo .filter-btn.inactive { background:#FBFBFA; color:#5C5854; }
.page-todo .todo-input-row { display:flex; gap:8px; margin:0 16px 16px; }
.page-todo .todo-input-row input { flex:1; height:40px; padding:0 12px; font-size:12px; border:1px solid #EAE7E1; border-radius:12px; background:#FFF; outline:none; }
.page-todo .todo-input-row button { width:40px; height:40px; border-radius:12px; background:#405140; color:#FBFBFA; border:none; font-size:18px; cursor:pointer; }
.page-todo .todo-item { padding:16px; display:flex; align-items:center; justify-content:space-between; }
.page-todo .todo-item.checked { opacity:0.6; }
.page-todo .todo-check { width:24px; height:24px; border-radius:999px; border:1px solid #DDD9CF; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:all 0.2s; }
.page-todo .todo-check.done { background:#7E997E; border-color:#7E997E; }
.page-todo .strike-through { position:relative; }
.page-todo .strike-through::after { content:''; position:absolute; left:0; top:55%; width:100%; height:1.5px; background:#7E997E; transform:scaleX(0); transform-origin:left; transition:transform 0.25s ease-out; }
.page-todo .checked .strike-through::after { transform:scaleX(1); }

/* Todo item dynamic classes */
.page-todo .todo-item-inner { display:flex; align-items:center; gap:12px; flex:1; cursor:pointer; }
.page-todo .todo-item-text { font-size:12px; color:#2C2B29; }
.page-todo .todo-del-btn { background:none; border:none; color:#A1A1AA; cursor:pointer; padding:4px; font-size:14px; }
.page-todo .todo-count { font-size:10px; color:#5C5854; }
.page-todo .todo-list-wrap { padding:0 16px; display:flex; flex-direction:column; gap:4px; }

	.page-todo .num{font-family:"Inter",Arial,sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
	</style>
</head>
<body class="page-todo">
<div class="app-viewport">
  <div class="todo-header">
    <h2 class="todo-title">待办 ☑</h2>
    <span class="todo-count" id="todo-count"></span>
  </div>
  <div class="todo-scroll no-scrollbar">
    <div class="todo-memo">
      <textarea id="todo-note-textarea" oninput="saveMemoNote(this.value)" placeholder="今天的备忘录..."></textarea>
    </div>
    <div class="todo-filters" id="todo-filter-bar">
      <button class="filter-btn active" id="todo-filter-today" onclick="filterTodo('today')">今日</button>
      <button class="filter-btn inactive" id="todo-filter-week" onclick="filterTodo('week')">本周</button>
      <button class="filter-btn inactive" id="todo-filter-all" onclick="filterTodo('all')">全部</button>
    </div>
    <div class="todo-input-row">
      <input type="text" id="todo-title-input" placeholder="新增待办..." onkeydown="if(event.key==='Enter')addTodoItem()">
      <button onclick="addTodoItem()">+</button>
    </div>
    <div id="todo-list-container" class="todo-list-wrap"></div>
  </div>
  <!-- Nav -->
  <nav class="nav-bar">
    <button class="nav-btn" onclick="redirectTo('index.html')"><div class="nav-btn-inner"><svg class="nav-icon text-ink-500" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></div><span class="nav-label text-ink-500">今天</span></button>
    <button class="nav-btn" id="nav-todo"><div class="nav-btn-inner nav-active-pill"><svg class="nav-icon text-sage-800" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg></div><span class="nav-label text-sage-800">待办</span></button>
    <button class="nav-btn" onclick="redirectTo('records.html')"><div class="nav-btn-inner"><svg class="nav-icon text-ink-500" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"/></svg></div><span class="nav-label text-ink-500">记录</span></button>
    <button class="nav-btn" onclick="redirectTo('tools.html')"><div class="nav-btn-inner"><svg class="nav-icon text-ink-500" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/></svg></div><span class="nav-label text-ink-500">工具</span></button>
    <button class="nav-btn" onclick="redirectTo('storage.html')"><div class="nav-btn-inner"><svg class="nav-icon text-ink-500" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-14v14m0-14L4 7m0 0v10l8 4"/></svg></div><span class="nav-label text-ink-500">收纳盒</span></button>
  </nav>
  <!-- Modal -->
  <div class="modal-overlay hidden" id="global-modal"><div class="modal-content" id="modal-content-area"></div></div>
</div>

<script>
loadDatabase();
var activeTodoFilter = 'today';

function saveMemoNote(val) { db.memoNote = val; saveDatabase(); }

function renderTodos() {
  var ta = document.getElementById('todo-note-textarea');
  if (ta) ta.value = db.memoNote || '';
  var container = document.getElementById('todo-list-container');
  if (!container) return;
  container.innerHTML = '';
  var filtered = db.todos;
  if (activeTodoFilter === 'today') filtered = db.todos.filter(function(t){return t.scope==='today';});
  else if (activeTodoFilter === 'week') filtered = db.todos.filter(function(t){return t.scope==='week';});
  filtered.forEach(function(item) {
    var div = document.createElement('div');
    div.className = 'todo-item paper-card' + (item.completed ? ' checked' : '');
    div.innerHTML = '<div class="todo-item-inner" onclick="toggleTodoCompleted(\''+item.id+'\')">' +
      '<span class="todo-check' + (item.completed ? ' done' : '') + '">' +
      (item.completed ? '<svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="3.5" viewBox="0 0 24 24"><path d="M4.5 12.75l6 6 9-13.5"></path></svg>' : '') + '</span>' +
      '<span class="strike-through todo-item-text">'+escapeHtml(item.title)+'</span></div>' +
      '<button class="todo-del-btn" onclick="deleteTodoItem(\''+item.id+'\')">&times;</button>';
    container.appendChild(div);
  });
  var count = document.getElementById('todo-count');
  if (count) count.textContent = filtered.length + '/' + db.todos.length;
}

function toggleTodoCompleted(id) {
  var todo = db.todos.find(function(t){return t.id===id;});
  if (todo) { todo.completed = !todo.completed; saveDatabase(); renderTodos(); }
}

function addTodoItem() {
  var input = document.getElementById('todo-title-input');
  if (!input) return;
  var title = input.value.trim();
  if (!title) return;
  db.todos.push({ id:'todo_'+Date.now(), title:title, completed:false, scope:activeTodoFilter==='all'?'today':activeTodoFilter });
  saveDatabase();
  input.value = '';
  renderTodos();
}

function deleteTodoItem(id) {
  db.todos = db.todos.filter(function(t){return t.id!==id;});
  saveDatabase();
  renderTodos();
}

function filterTodo(scope) {
  activeTodoFilter = scope;
  document.querySelectorAll('.filter-btn').forEach(function(btn) {
    btn.className = 'filter-btn ' + (btn.id === 'todo-filter-'+scope ? 'active' : 'inactive');
  });
  renderTodos();
}

renderTodos();
</script>
</body>
</html>
