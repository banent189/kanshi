<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>简纸 — 去水印</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+SC:wght@300;400;600;700&family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body{ margin:0; background:#0F0F0E; font-family:'Noto Serif SC','Outfit',sans-serif; }
.app-viewport{ max-width:480px; margin:0 auto; background:#F5F4F0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center }

.page-watermark .is0{font-size:64px;margin-bottom:24px}
.page-watermark .is1{font-size:18px;font-weight:700;color:#2C2B29;margin-bottom:12px}
.page-watermark .is2{font-size:12px;color:#5C5854;margin-bottom:32px}
.page-watermark .is3{padding:12px 32px;background:#405140;color:#FFF;border:none;border-radius:12px;font-size:12px;font-weight:700;cursor:pointer}

	.page-watermark .num{font-family:"Inter",Arial,sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
	</style>
</head>
<body class="page-watermark">
<div class="app-viewport">
  <div class="is0">💧</div>
  <h1 class="is1">去水印工具</h1>
  <p class="is2">模块升级中，敬请期待...</p>
  <button onclick="history.back()" class="is3">返回</button>
</div>
</body>
</html>
